<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>İngilizce Çalışma Kutum</title>
<meta name="theme-color" content="#2B3A67">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İngilizce Kutum">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B3A67'/%3E%3Ctext x='50' y='64' font-size='46' text-anchor='middle' fill='%23E39A34' font-family='Georgia,serif' font-weight='700'%3EEn%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B3A67'/%3E%3Ctext x='50' y='64' font-size='46' text-anchor='middle' fill='%23E39A34' font-family='Georgia,serif' font-weight='700'%3EEn%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<!-- GoatCounter analytics — ücretsiz, çerezsiz. -->
<script data-goatcounter="https://english-box.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0F3EE;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6478;
    --navy:#2B3A67;
    --navy-dark:#1D2848;
    --amber:#E39A34;
    --amber-soft:#FBEBD3;
    --green:#4C8C6F;
    --green-soft:#E1EFE7;
    --rose:#C1577B;
    --rose-soft:#F6E2E9;
    --border:#DEE3D9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(31,42,68,0.08);
  }
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 18px;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
  }
  header.topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.topbar p{
    margin:0;
    font-size:0.82rem;
    color:#C8D0E6;
  }
  .level-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .auth-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .user-email{
    font-size:0.72rem;
    color:#C8D0E6;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:210px;
  }
  .level-badge{
    background:var(--amber);
    color:var(--navy-dark);
    font-size:0.72rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:999px;
  }
  .retest-link{
    font-size:0.72rem;
    color:#B9C4E6;
    text-decoration:underline;
    cursor:pointer;
  }
  .rank-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }
  .rank-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.82rem;
    font-weight:600;
  }
  .rank-chip .emoji{font-size:1.15rem;}
  .xp-text{font-size:0.74rem;color:#C8D0E6;font-weight:600;}
  .xp-bar-track{
    height:7px;
    background:rgba(255,255,255,0.16);
    border-radius:999px;
    margin-top:8px;
    overflow:hidden;
  }
  .xp-bar-fill{
    height:100%;
    background:var(--amber);
    border-radius:999px;
    width:0%;
    transition:width 0.7s cubic-bezier(.2,.8,.3,1);
  }
  .streak-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .streak-pill{
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    padding:8px 10px;
    font-size:0.72rem;
    flex:1;
    text-align:center;
  }
  .streak-pill strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
  }
  main{
    flex:1;
    padding:20px 18px 90px;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 4px;
    color:var(--navy);
  }
  .section-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 16px;
    line-height:1.5;
  }
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-size:0.58rem;
    color:var(--ink-soft);
    padding:6px 1px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    border-radius:10px;
  }
  nav.tabbar button.active{
    color:var(--navy);
    background:var(--amber-soft);
  }
  nav.tabbar svg{width:17px;height:17px;}

  /* Placement test */
  .pt-wrap{padding:6px 2px;}
  .pt-intro, .pt-result{text-align:center;padding:26px 8px;}
  .pt-intro h2, .pt-result h2{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    color:var(--navy);
    margin:0 0 12px;
  }
  .pt-intro p{color:var(--ink-soft);font-size:0.88rem;line-height:1.6;margin:0 0 22px;}
  .pt-skip{display:block;text-align:center;margin-top:16px;font-size:0.8rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
  .pt-progress{font-size:0.75rem;color:var(--ink-soft);text-align:center;margin-bottom:12px;}
  .pt-q{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;color:var(--navy);text-align:center;margin-bottom:18px;line-height:1.4;}
  .level-big{font-family:'Fraunces',serif;font-size:2.6rem;color:var(--navy);font-weight:700;}
  .level-name{color:var(--amber);font-weight:600;margin-bottom:14px;}

  /* Level up toast */
  .level-toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-24px);
    background:var(--green);
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    font-size:0.83rem;
    font-weight:600;
    box-shadow:0 10px 28px rgba(0,0,0,0.2);
    opacity:0;
    transition:all 0.35s ease;
    z-index:999;
    max-width:88%;
    text-align:center;
  }
  .level-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* Flashcards */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .chip{
    white-space:nowrap;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:0.8rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .progress-strip{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .progress-box{
    flex:1;
    background:var(--green-soft);
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .progress-box.learning{background:var(--amber-soft);}
  .progress-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    color:var(--navy);
  }
  .progress-box span{font-size:0.72rem;color:var(--ink-soft);}
  .tier-note{
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .badge-strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:2px 2px 16px;
  }
  .badge-item{
    flex:0 0 auto;
    width:72px;
    text-align:center;
    padding:10px 5px;
    border-radius:14px;
    background:var(--bg);
    border:1px solid var(--border);
    transition:transform 0.15s ease;
  }
  .badge-item.earned{
    background:var(--amber-soft);
    border-color:var(--amber);
    animation:badgePop 0.4s ease;
  }
  .badge-item .b-emoji{
    font-size:1.4rem;
    display:block;
    margin-bottom:4px;
    filter:grayscale(1);
    opacity:0.35;
  }
  .badge-item.earned .b-emoji{filter:none;opacity:1;}
  .badge-item .b-name{font-size:0.6rem;color:var(--ink-soft);line-height:1.2;display:block;}
  .badge-item.earned .b-name{color:var(--navy);font-weight:600;}
  @keyframes badgePop{
    0%{transform:scale(0.7);}
    60%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .tier-ring-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg);
    border-radius:14px;
    padding:14px;
    margin-bottom:16px;
  }
  .tier-ring-wrap svg{flex:0 0 auto;}
  .tier-ring-text{font-size:0.78rem;color:var(--ink-soft);line-height:1.4;}
  .tier-ring-text strong{color:var(--navy);font-family:'Fraunces',serif;font-size:1rem;}
  .confetti-piece{
    position:fixed;
    width:8px;height:8px;
    border-radius:2px;
    pointer-events:none;
    z-index:1000;
  }
  .reading-card{
    background:var(--bg);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .reading-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--navy);
    margin-bottom:10px;
  }
  .reading-text{
    font-size:0.95rem;
    line-height:1.7;
    color:var(--ink);
  }
  .reading-tr{
    font-size:0.9rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .reading-tr.show{display:block;}
  .reveal-btn{
    margin-top:14px;
    background:none;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
  }
  @keyframes cardPop{
    0%{transform:scale(0.94) translateY(4px);opacity:0.4;}
    100%{transform:scale(1) translateY(0);opacity:1;}
  }
  .flashcard, .wod-card, .write-card{animation:cardPop 0.25s ease;}
  .btn:active, .btn-full:active, .chip:active, .q-option:active, .sb-chip:active, nav.tabbar button:active{
    transform:scale(0.95);
  }
  .btn, .btn-full, .chip, .q-option, .sb-chip, nav.tabbar button{
    transition:transform 0.12s ease;
  }
  .flashcard{
    background:var(--navy);
    color:#fff;
    border-radius:18px;
    min-height:210px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
    margin-bottom:16px;
  }
  .flashcard .cat-label{
    position:absolute;
    top:14px;
    left:16px;
    font-size:0.7rem;
    color:#AEB9DA;
  }
  .flashcard .lvl-label{
    position:absolute;
    top:14px;
    right:16px;
    font-size:0.68rem;
    color:var(--amber);
    font-weight:700;
  }
  .flashcard .word-en{
    font-family:'Fraunces',serif;
    font-size:1.9rem;
    font-weight:600;
  }
  .flashcard .word-tr{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--amber);
    margin-bottom:10px;
  }
  .flashcard .example{
    font-size:0.85rem;
    color:#D6DCEE;
    margin-top:10px;
    line-height:1.5;
  }
  .flashcard .hint{
    font-size:0.72rem;
    color:#8E9AC2;
    margin-top:14px;
  }
  .card-actions{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--rose-soft);
    color:var(--rose);
  }
  .btn-primary{
    background:var(--green-soft);
    color:var(--green);
  }
  .btn-full{
    width:100%;
    background:var(--navy);
    color:#fff;
    padding:13px;
    border-radius:12px;
    border:none;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    margin-top:6px;
  }
  .deck-status{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Grammar */
  .topic-card{
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .topic-card.locked{background:#FAFAF8;}
  .topic-head{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    background:var(--surface);
  }
  .topic-card.locked .topic-head{
    background:#FAFAF8;
    cursor:pointer;
  }
  .topic-head h3{
    margin:0;
    font-family:'Fraunces',serif;
    font-size:1rem;
    font-weight:600;
    color:var(--navy);
  }
  .topic-card.locked h3{color:var(--ink-soft);}
  .topic-progress-bar{
    height:5px;
    background:var(--border);
    border-radius:4px;
    margin-top:6px;
    width:140px;
    overflow:hidden;
  }
  .topic-progress-fill{
    height:100%;
    background:var(--green);
  }
  .topic-body{
    padding:0 16px 16px;
    display:none;
    border-top:1px solid var(--border);
  }
  .topic-body.open{display:block;}
  .q-block{margin-top:16px;}
  .q-text{font-size:0.92rem;margin-bottom:10px;line-height:1.5;}
  .q-options{display:flex;flex-direction:column;gap:8px;}
  .q-option{
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:0.86rem;
    cursor:pointer;
    background:var(--surface);
  }
  .q-option.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .q-option.incorrect{background:var(--rose-soft);border-color:var(--rose);color:var(--rose);}
  .q-explain{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:8px;
    padding:8px 10px;
    background:var(--bg);
    border-radius:8px;
    display:none;
  }
  .q-explain.show{display:block;}

  /* Word of day / quiz */
  .wod-card{
    background:linear-gradient(155deg,var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff;
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .wod-card .label{font-size:0.72rem;color:#9FADD4;margin-bottom:6px;}
  .wod-card .word{
    font-family:'Fraunces',serif;
    font-size:2rem;
    font-weight:700;
  }
  .wod-card .tr{
    color:var(--amber);
    font-size:1.2rem;
    font-family:'Fraunces',serif;
    font-weight:600;
    margin-top:2px;
  }
  .wod-card .example{
    margin-top:12px;
    font-size:0.85rem;
    color:#D6DCEE;
    line-height:1.5;
  }
  .sound-btn{
    margin-top:14px;
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-size:0.78rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .quiz-score-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .stat-box{
    flex:1;
    background:var(--bg);
    border-radius:12px;
    padding:10px;
    text-align:center;
  }
  .stat-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.2rem;
    color:var(--navy);
  }
  .stat-box span{font-size:0.7rem;color:var(--ink-soft);}
  .quiz-q{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:600;
    margin-bottom:14px;
    color:var(--navy);
    text-align:center;
  }
  .quiz-progress{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .quiz-result{
    text-align:center;
    padding:20px 10px;
  }
  .quiz-result .big{
    font-family:'Fraunces',serif;
    font-size:2.4rem;
    color:var(--navy);
    font-weight:700;
  }

  /* Sentence builder */
  .sb-hint{
    text-align:center;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .sb-answer-row{
    min-height:52px;
    border:1.5px dashed var(--border);
    border-radius:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    margin-bottom:16px;
  }
  .sb-chip{
    background:var(--navy);
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .sb-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .sb-pool .sb-chip{
    background:var(--bg);
    color:var(--ink);
    border:1px solid var(--border);
  }
  .sb-feedback{
    text-align:center;
    font-size:0.85rem;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
    display:none;
  }
  .sb-feedback.show{display:block;}
  .sb-feedback.ok{background:var(--green-soft);color:var(--green);}
  .sb-feedback.no{background:var(--rose-soft);color:var(--rose);}
  .sb-counter{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Writing practice */
  .write-card{
    background:var(--bg);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    margin-bottom:16px;
  }
  .write-prompt-label{font-size:0.72rem;color:var(--ink-soft);margin-bottom:8px;}
  .write-prompt{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--navy);}
  .write-input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-size:1rem;
    font-family:'Work Sans',sans-serif;
    margin-bottom:12px;
    outline:none;
  }
  .write-input:focus{border-color:var(--navy);}
  .write-input.correct{border-color:var(--green);background:var(--green-soft);}
  .write-input.incorrect{border-color:var(--rose);background:var(--rose-soft);}
  .write-feedback{font-size:0.84rem;text-align:center;margin-bottom:8px;min-height:20px;font-weight:600;}
  .write-feedback.ok{color:var(--green);}
  .write-feedback.no{color:var(--rose);}

  /* Notification panel */
  .notif-modal{
    position:fixed;
    inset:0;
    background:rgba(31,42,68,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:1000;
  }
  .notif-modal.show{opacity:1;pointer-events:auto;}
  .notif-card{
    background:var(--surface);
    border-radius:18px;
    padding:22px 20px;
    max-width:360px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .notif-card h3{
    font-family:'Fraunces',serif;
    margin:0 0 8px;
    color:var(--navy);
    font-size:1.15rem;
  }
  .notif-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--bg);
    border-radius:10px;
    padding:9px 12px;
    font-size:0.8rem;
    margin-bottom:8px;
  }
  .notif-row strong{color:var(--navy);}

  /* Dictionary */
  .dict-search-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .dict-search-row .write-input{margin-bottom:0;}
  .dict-card{
    background:var(--bg);
    border-radius:16px;
    padding:18px;
  }
  .dict-word{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--navy);
  }
  .dict-phonetic{
    color:var(--ink-soft);
    font-size:0.85rem;
    margin-bottom:6px;
  }
  .dict-tr{
    display:inline-block;
    background:var(--amber-soft);
    color:var(--navy-dark);
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    font-size:0.85rem;
    margin:6px 0 12px;
  }
  .dict-pos{
    font-style:italic;
    color:var(--green);
    font-size:0.82rem;
    margin:10px 0 4px;
  }
  .dict-def{font-size:0.9rem;margin-bottom:3px;}
  .dict-example{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:2px 0 8px 10px;
  }

  /* Matching game */
  .match-grid{
    display:flex;
    gap:12px;
  }
  .match-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .match-item{
    background:var(--bg);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
    font-size:0.85rem;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .match-item.selected{
    border-color:var(--navy);
    background:var(--amber-soft);
  }
  .match-item.matched{
    background:var(--green-soft);
    border-color:var(--green);
    color:var(--green);
    cursor:default;
    opacity:0.6;
  }
  .match-item.wrong{
    border-color:var(--rose);
    background:var(--rose-soft);
  }

  /* Listening practice */
  .listen-card{
    text-align:center;
    padding:24px 10px;
  }
  .listen-big{
    font-size:1.1rem;
    padding:16px 28px;
    border-radius:999px;
  }
  .listen-word{
    font-family:'Fraunces',serif;
    font-size:1.4rem;
    color:var(--navy);
    margin-top:14px;
    font-weight:600;
  }

  /* Cloze / fill in the blank */
  .cloze-sentence{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--navy);
    line-height:1.5;
  }
  /* Sub-tabs */
  .subtabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:4px;
    scrollbar-width:none;
  }
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    flex:0 0 auto;
    background:var(--bg);
    border:1.5px solid var(--border);
    color:var(--ink-soft);
    border-radius:999px;
    padding:7px 14px;
    font-size:0.8rem;
    font-family:inherit;
    font-weight:500;
    cursor:pointer;
    transition:all 0.18s ease;
  }
  .subtab.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  .auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0 12px;
    color:var(--ink-soft);
    font-size:0.78rem;
  }
  .auth-divider::before,
  .auth-divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .btn-google{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#fff;
    color:#3c4043;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 16px;
    font-family:inherit;
    font-size:0.92rem;
    font-weight:500;
    cursor:pointer;
    transition:background 0.18s ease, border-color 0.18s ease;
  }
  .btn-google:hover{
    background:#f7f8f7;
    border-color:#c8cec4;
  }
  .lang-toggle{
    border:1.5px solid var(--border);
    border-radius:999px;
    padding:2px 9px;
    font-size:0.7rem;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .cloze-tr{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-top:8px;
  }
</style>

function getRank(xp){
  let r = RANKS[0];
  for(const rk of RANKS){ if(xp>=rk.min) r=rk; }
  return r;
}
function nextRankThreshold(xp){
  const idx = RANKS.indexOf(getRank(xp));
  return idx < RANKS.length-1 ? RANKS[idx+1].min : null;
}

/* ---------------- STORAGE (local cache + cloud sync) ---------------- */
const STORAGE_KEY = 'ingilizce-calisma-kutum-progress';
let memoryFallback = null;
let saveTimer = null;

async function loadCloudProgress(){
  progress = defaultProgress();
  if(supabaseClient && currentUser){
    try{
      const { data, error } = await supabaseClient
        .from('progress')
        .select('data')
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if(data && data.data){
        progress = Object.assign(progress, data.data);
      }
    }catch(e){
      // offline or network error — fall back to the last local cache for this device
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) progress = Object.assign(progress, JSON.parse(raw));
      }catch(e2){}
    }
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function saveProgress(){
  const data = JSON.stringify(progress);
  try{ localStorage.setItem(STORAGE_KEY, data); }
  catch(e){ memoryFallback = JSON.parse(data); }
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(syncCloud, 800);
}
async function syncCloud(){
  if(!supabaseClient || !currentUser) return;
  try{
    await supabaseClient.from('progress').upsert({
      user_id: currentUser.id,
      data: progress,
      updated_at: new Date().toISOString()
    });
  }catch(e){ console.error('Cloud sync failed', e); }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function unlockedVocab(){ return VOCAB.filter(w=>levelIdx(w.level) <= progress.level); }
function currentTierWords(){ return VOCAB.filter(w=>levelIdx(w.level) === progress.level); }
function unlockedSentences(){
  const all = SENTENCES.filter(s=>levelIdx(s.level) <= progress.level);
  const curCode = LEVELS[progress.level].code;
  const cur = all.filter(s=>s.level===curCode);
  const rest = all.filter(s=>s.level!==curCode);
  return [...cur, ...rest];
}
function normalize(str){
  return (str||'').toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
}
function checkLevelUp(){
  if(progress.level >= LEVELS.length-1) return false;
  const tier = currentTierWords();
  if(tier.length===0) return false;
  const known = tier.filter(w=>progress.flashcards[w.id]==='known').length;
  if(known/tier.length >= 0.7){
    progress.level++;
    saveProgress();
    return true;
  }
  return false;
}

function preferredHour(){
  const log = progress.studyLog||[];
  if(!log.length) return null;
  const buckets = {};
  log.forEach(h=>{ buckets[h]=(buckets[h]||0)+1; });
  let best=null, bestCount=-1;
  Object.entries(buckets).forEach(([h,c])=>{ if(c>bestCount){best=parseInt(h); bestCount=c;} });
  return best;
}

function checkDailyReminder(force){
  if(!progress.notif || !progress.notif.enabled) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = todayStr();
  const practicedToday = progress.quiz.lastDate === today;
  if(practicedToday && !force) return;
  const hour = new Date().getHours();
  const pref = progress.notif.hour;
  const closeToPreferred = (pref===null||pref===undefined) ? true : Math.abs(hour-pref) <= 1;
  if(!closeToPreferred && !force) return;
  if(progress.notif.lastPromptDate === today && !force) return;
  try{
    new Notification('İngilizce Çalışma Kutum', {
      body: practicedToday ? 'Harika gidiyorsun, bugünkü serini korudun! 🔥' : 'Bugün henüz çalışmadın — birkaç dakikan yeter, serini bozma. 🌱',
      tag: 'daily-reminder'
    });
  }catch(e){}
  progress.notif.lastPromptDate = today;
  saveProgress();
}

function burstConfetti(x, y, count){
  count = count || 12;
  const colors = ['#E39A34','#4C8C6F','#C1577B','#2B3A67','#6FA8DC','#F2C14E'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = x+'px';
    el.style.top = y+'px';
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = 50 + Math.random()*80;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 30;
    const rot = Math.floor(Math.random()*360);
    try{
      el.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:`translate(${dx}px, ${dy+130}px) rotate(${rot}deg)`, opacity:0}
      ], {duration:700+Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
    setTimeout(()=>el.remove(), 1150);
  }
}

}

  [/^Soru (\d+) \/ (\d+)$/, "Question $1 / $2"],
  [/^Soru (\d+) \/ (\d+) · (.+)$/, "Question $1 / $2 · $3"],

function expText(q){

function t(key){

function trUI(text){
  if(LANG!=='en') return text;
  const trimmed = text.trim();
  if(!trimmed) return text;
  if(UI_MAP[trimmed]) return text.replace(trimmed, UI_MAP[trimmed]);
  for(const [re, rep] of UI_PATTERNS){
    if(re.test(trimmed)) return text.replace(trimmed, trimmed.replace(re, rep));
  }
  return text;
}
function localizeDOM(root){
  if(LANG!=='en' || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const before = n.nodeValue;
    let after = trUI(before);
    UI_INLINE.forEach(([re,rep])=>{ after = after.replace(re, rep); });
    if(after !== before) n.nodeValue = after;

    const v = UI_MAP[el.getAttribute('placeholder').trim()];
    if(v) el.setAttribute('placeholder', v);
  });
}
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
}
function setLang(lang){
  LANG = lang;
  localStorage.setItem('app_lang', lang);
  applyStaticI18n();
  updateHeaderStats();
  render();
}

/* ---------------- TAB NAV (groups + sub-tabs) ---------------- */
const TAB_GROUPS = {
  learn:    { tabs:['flash','wod','dict'] },
  practice: { tabs:['match','listen','cloze','write','sentence'] },
  study:    { tabs:['grammar','reading'] },
  test:     { tabs:['exam'] }
};
const TAB_LABEL_KEY = {
  flash:'tab.flash', wod:'tab.wod', dict:'tab.dict',
  match:'tab.match', listen:'tab.listen', cloze:'tab.cloze', write:'tab.write', sentence:'tab.sentence',
  grammar:'tab.grammar', reading:'tab.reading', exam:'tab.exam'
};
let activeGroup = 'learn';
function groupOf(tab){
  for(const g in TAB_GROUPS){ if(TAB_GROUPS[g].tabs.includes(tab)) return g; }
  return 'learn';
}
function syncTabbar(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.group===activeGroup);
  });
}
function setActiveTab(tab){
  activeTab = tab;
  activeGroup = groupOf(tab);
  syncTabbar();
  trackEvent('/tab/'+activeTab, 'Tab: '+activeTab);
  render();
}
function subTabBarHtml(){
  const tabs = TAB_GROUPS[activeGroup].tabs;
  if(tabs.length < 2) return '';
  return `<div class="subtabs">${tabs.map(tb=>
    `<button class="subtab ${tb===activeTab?'active':''}" data-subtab="${tb}">${t(TAB_LABEL_KEY[tb])}</button>`
  ).join('')}</div>`;
}
function bindSubTabs(){
  document.querySelectorAll('.subtab').forEach(b=>{
    b.addEventListener('click', ()=>setActiveTab(b.dataset.subtab));
  });
}
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeGroup = btn.dataset.group;
    activeTab = TAB_GROUPS[activeGroup].tabs[0];
    syncTabbar();
    trackEvent('/tab/'+activeTab, 'Tab: '+activeTab);
    render();
  });
});

/* ---------------- RENDER ROUTER ---------------- */
function render(){
  const main = document.getElementById('main');
  renderInner(main);
  const bar = subTabBarHtml();
  if(bar){
    main.insertAdjacentHTML('afterbegin', bar);
    bindSubTabs();
  }
  localizeDOM(main);
}
function renderInner(main){
  if(activeTab==='flash') renderFlash(main);
  else if(activeTab==='grammar') renderGrammar(main);
  else if(activeTab==='write') renderWrite(main);
  else if(activeTab==='wod') renderWod(main);
  else if(activeTab==='sentence') renderSentence(main);
  else if(activeTab==='reading') renderReading(main);
  else if(activeTab==='exam') renderExam(main);
  else if(activeTab==='dict') renderDictionary(main);
  else if(activeTab==='match') renderMatch(main);
  else if(activeTab==='listen') renderListen(main);
  else if(activeTab==='cloze') renderCloze(main);
}

/* ---------------- AUTH (sign up / log in / email verification) ---------------- */

    main.innerHTML = `
      <div class="pt-wrap pt-intro">
        <h2>E-postanı doğrula</h2>

        ${authError ? `<div class="write-feedback no show">${authError}</div>` : ''}
        <button class="btn-full" id="verifyBtn">Doğrula ve Devam Et</button>
        <span class="pt-skip" id="resendBtn">Kodu tekrar gönder</span>
        <span class="pt-skip" id="backToLogin">Geri dön</span>
      </div>
    `;

    document.getElementById('resendBtn').addEventListener('click', doResend);

  } else {
    const isLogin = authMode === 'login';
    main.innerHTML = `
      <div class="pt-wrap pt-intro">
        <h2>${isLogin ? 'Giriş Yap' : 'Hesap Oluştur'}</h2>
        <p>${isLogin ? 'İlerlemen buluta kayıtlı — e-posta ve şifrenle devam et.' : 'E-posta ve şifre belirle, sana bir doğrulama kodu göndereceğiz.'}</p>
        <input class="write-input" id="authEmail" type="email" placeholder="E-posta adresin" autocomplete="email">
        <input class="write-input" id="authPassword" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="${isLogin?'current-password':'new-password'}">
        ${authError ? `<div class="write-feedback no show">${authError}</div>` : ''}
        <button class="btn-full" id="authSubmit">${isLogin ? 'Giriş Yap' : 'Kayıt Ol'}</button>
        <div class="auth-divider"><span>${LANG==='en' ? 'or' : 'veya'}</span></div>
        <button class="btn-google" id="googleBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.53 5.53 0 01-2.4 3.63v3h3.87c2.26-2.09 3.56-5.17 3.56-8.87z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.87-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 010-4.58V6.62H1.28a12 12 0 000 10.76l3.99-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 001.28 6.62l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          <span>${LANG==='en' ? 'Continue with Google' : 'Google ile devam et'}</span>
        </button>

      </div>
    `;
    document.getElementById('authSubmit').addEventListener('click', isLogin ? doLogin : doSignup);
    document.getElementById('googleBtn').addEventListener('click', doGoogleLogin);
    document.getElementById('authPassword').addEventListener('keydown', (e)=>{ if(e.key==='Enter') (isLogin?doLogin:doSignup)(); });

      authMode = isLogin ? 'signup' : 'login';
      authError = '';

function setAuthBusy(btnId, busyText){
  const btn = document.getElementById(btnId);
  if(btn){ btn.textContent = busyText; btn.disabled = true; }
}
async function doSignup(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password || password.length < 6){
    authError = 'Geçerli bir e-posta ve en az 6 karakterli bir şifre gir.';
    renderAuth();
    return;
  }
  setAuthBusy('authSubmit', 'Gönderiliyor...');
  try{
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ authError = error.message; renderAuth(); return; }
    pendingEmail = email;
    authMode = 'verify';
    authError = '';
    renderAuth();
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doGoogleLogin(){
  authError = '';
  try{
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo }
    });
    if(error){
      authError = (LANG==='en')
        ? 'Google sign-in failed. Please try again.'
        : 'Google ile giriş başarısız oldu. Lütfen tekrar dene.';
      renderAuth();
    }
    // on success the browser navigates to Google, then returns to this page
  }catch(e){
    authError = (LANG==='en')
      ? 'Could not reach Google sign-in. Check your connection.'
      : 'Google girişine ulaşılamadı. Bağlantını kontrol et.';
    renderAuth();
  }
}
async function doLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password){ authError = 'E-posta ve şifreni gir.'; renderAuth(); return; }
  setAuthBusy('authSubmit', 'Giriş yapılıyor...');
  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      if(error.message && error.message.toLowerCase().includes('confirm')){
        pendingEmail = email;
        authMode = 'verify';
        authError = 'Önce e-postanı doğrulaman gerekiyor.';
        renderAuth();
        return;
      }
      authError = error.message;
      renderAuth();
      return;
    }
    await onAuthed(data.user);
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doVerify(){
  const code = document.getElementById('verifyCode').value.trim();
  authError = '';
  if(!code){ authError = 'Kodu gir.'; renderAuth(); return; }
  setAuthBusy('verifyBtn', 'Doğrulanıyor...');
  try{
    const { data, error } = await supabaseClient.auth.verifyOtp({ email: pendingEmail, token: code, type: 'signup' });
    if(error){
      authError = 'Kod hatalı ya da süresi dolmuş. Tekrar dene.';
      renderAuth();
      return;
    }
    await onAuthed(data.user);
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doResend(){
  try{
    await supabaseClient.auth.resend({ type: 'signup', email: pendingEmail });
    authError = 'Kod tekrar gönderildi, e-postanı kontrol et.';
  }catch(e){
    authError = 'Kod gönderilemedi, tekrar dene.';
  }
  renderAuth();
}
async function onAuthed(user){
  currentUser = user;
  document.getElementById('authRow').style.display = 'flex';
  document.getElementById('headerLevelRow').style.display = 'flex';
  document.getElementById('rankRow').style.display = 'flex';
  document.getElementById('xpBarTrack').style.display = 'block';
  document.getElementById('streakRow').style.display = 'flex';
  document.getElementById('userEmailLabel').textContent = user.email;
  await loadCloudProgress();
  trackEvent(progress.placementDone ? '/session/returning-user' : '/session/new-user', 'Oturum');
  logStudySession();
  checkDailyReminder(false);
  if(!window._reminderInterval){
    window._reminderInterval = setInterval(()=>checkDailyReminder(false), 5*60*1000);
  }
  if(!progress.placementDone){
    showPlacementIntro();
  } else {
    flashLevelFilter = LEVELS[progress.level].code;
    readingLevelFilter = LEVELS[progress.level].code;
    document.getElementById('tabbar').style.display = 'flex';
    updateHeaderStats();
    activeTab = 'flash'; activeGroup = 'learn';
    syncTabbar();
    render();
  }
}
async function doLogout(){
  try{ await supabaseClient.auth.signOut(); }catch(e){}
  currentUser = null;
  progress = defaultProgress();
  document.getElementById('authRow').style.display = 'none';
  document.getElementById('headerLevelRow').style.display = 'none';
  document.getElementById('rankRow').style.display = 'none';
  document.getElementById('xpBarTrack').style.display = 'none';
  document.getElementById('streakRow').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  authMode = 'login';
  authError = '';
  renderAuth();
}

function showPlacementIntro(){
  document.getElementById('tabbar').style.display='none';
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="pt-wrap pt-intro">
      <h2>Önce seviyeni bulalım</h2>
      <p>20 soruluk daha kapsamlı bir test ile İngilizce seviyeni doğru tahmin edelim. Sorular kolaydan zora doğru ilerliyor. Sana en uygun kelime ve grammar içerikleriyle, tam olman gereken seviyeden başlayacaksın — yaklaşık 4-5 dakika sürer.</p>
      <button class="btn-full" id="ptStart">Teste Başla</button>
      <span class="pt-skip" id="ptSkip">Testi atla, A1'den başlayayım</span>
    </div>
  `;
  document.getElementById('ptStart').addEventListener('click', startPlacement);
  document.getElementById('ptSkip').addEventListener('click', ()=>{
    progress.level=0; progress.placementDone=true; saveProgress();
    flashLevelFilter = LEVELS[0].code;
    readingLevelFilter = LEVELS[0].code;
    finishPlacementUI();
  });
}
function startPlacement(){
  placementState = {idx:0, correct:0, answered:false};
  renderPlacementQ();
}
function renderPlacementQ(){
  const main = document.getElementById('main');
  const item = PLACEMENT_TEST[placementState.idx];
  main.innerHTML = `
    <div class="pt-wrap">
      <div class="pt-progress">Soru ${placementState.idx+1} / ${PLACEMENT_TEST.length}</div>
      <div class="pt-q">${item.q}</div>
      <div class="q-options">
        ${item.opts.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
      </div>
    </div>
  `;
  main.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(placementState.answered) return;
      placementState.answered = true;
      const chosen = opt.dataset.opt;
      main.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt===item.a) o.classList.add('correct');
      });
      if(chosen!==item.a) opt.classList.add('incorrect');
      else placementState.correct++;
      setTimeout(()=>{
        placementState.idx++;
        placementState.answered = false;
        if(placementState.idx >= PLACEMENT_TEST.length){
          const lvl = levelFromScore(placementState.correct);
          progress.level = lvl; progress.placementDone = true; saveProgress();
          trackEvent('/placement-test/level-'+LEVELS[lvl].code, 'Yerleştirme testi tamamlandı');
          renderPlacementResult(lvl);
        } else {
          renderPlacementQ();
        }
      }, 700);
    });
  });
}
function renderPlacementResult(lvl){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="pt-wrap pt-result">
      <div class="level-big">${LEVELS[lvl].code}</div>
      <div class="level-name">${LEVELS[lvl].label} seviyesi</div>
      <p class="section-sub">Kelime kartların ve grammar konuların bu seviyeye göre ayarlandı. Kelimeleri öğrendikçe daha zor seviyeler otomatik olarak açılacak.</p>
      <button class="btn-full" id="ptDone">Başlamaya Hazırım</button>
    </div>

  document.getElementById('ptDone').addEventListener('click', finishPlacementUI);
}
function finishPlacementUI(){
  document.getElementById('tabbar').style.display='flex';

  readingLevelFilter = LEVELS[progress.level].code;
  updateHeaderStats();

}

/* ---------------- FLASHCARDS ---------------- */
function currentDeck(){
  let pool = unlockedVocab();
  if(flashLevelFilter && flashLevelFilter!=='Tümü'){
    pool = pool.filter(w=>w.level===flashLevelFilter);
  }
  return flashFilter==='Tümü' ? pool : pool.filter(w=>w.cat===flashFilter);
}
function renderFlash(main){
  if(!flashLevelFilter) flashLevelFilter = LEVELS[progress.level].code;
  const levelOptions = LEVELS.filter((l,idx)=>idx<=progress.level).map(l=>l.code);
  const levelPool = flashLevelFilter==='Tümü' ? unlockedVocab() : unlockedVocab().filter(w=>w.level===flashLevelFilter);
  const cats = ["Tümü", ...new Set(levelPool.map(w=>w.cat))];
  const deck = currentDeck();
  if(flashIndex >= deck.length) flashIndex = 0;
  const word = deck[flashIndex];
  const known = Object.values(progress.flashcards).filter(v=>v==='known').length;
  const learning = Object.values(progress.flashcards).filter(v=>v==='learning').length;
  const tier = currentTierWords();
  const tierKnown = tier.filter(w=>progress.flashcards[w.id]==='known').length;
  const ratio = tier.length ? tierKnown/tier.length : 0;
  const nextLevel = progress.level < LEVELS.length-1 ? LEVELS[progress.level+1].code : null;
  const circumference = 2*Math.PI*24;
  const offset = circumference*(1-Math.min(1,ratio));

  main.innerHTML = `
    <h2 class="section-title">Kelime Kartları</h2>
    <p class="section-sub">Karta dokun, çeviriyi gör. Sonra bildiğini ya da tekrar edeceğini işaretle.</p>
    <div class="badge-strip" id="badgeStrip">
      ${BADGES.map(b=>`<div class="badge-item ${progress.badges[b.id]?'earned':''}"><span class="b-emoji">${b.emoji}</span><span class="b-name">${b.name}</span></div>`).join('')}
    </div>
    <div class="chip-row" id="levelRow">
      ${levelOptions.map(lv=>`<div class="chip ${lv===flashLevelFilter?'active':''}" data-lvl="${lv}">${lv} ${lv===LEVELS[progress.level].code?'(seviyen)':''}</div>`).join('')}
      <div class="chip ${flashLevelFilter==='Tümü'?'active':''}" data-lvl="Tümü">Tüm Seviyeler</div>
    </div>
    <div class="chip-row" id="catRow">
      ${cats.map(c=>`<div class="chip ${c===flashFilter?'active':''}" data-cat="${c}">${c}</div>`).join('')}
    </div>
    <div class="progress-strip">
      <div class="progress-box"><strong>${known}</strong><span>Biliyorum</span></div>
      <div class="progress-box learning"><strong>${learning}</strong><span>Öğreniyorum</span></div>
    </div>
    <div class="tier-ring-wrap">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#DEE3D9" stroke-width="6"/>
        <circle cx="28" cy="28" r="24" fill="none" stroke="#4C8C6F" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 28 28)"/>
      </svg>
      <div class="tier-ring-text">
        <strong>${tierKnown}/${tier.length}</strong> ${LEVELS[progress.level].code} kelimesi öğrenildi<br>
        ${nextLevel ? `%70'e ulaşınca ${nextLevel} açılır 🚀` : 'En üst seviyedesin, tebrikler! 🏆'}
      </div>
    </div>
    ${deck.length ? `
    <div class="deck-status">${flashIndex+1} / ${deck.length} — ${word.cat}</div>
    <div class="flashcard" id="flashCard">
      <span class="cat-label">${word.cat}</span>
      <span class="lvl-label">${word.level}</span>
      ${flashFlipped ? `
        <div class="word-tr">${word.tr}</div>
        <div class="example">${word.ex}<br>${word.exTr}</div>
        ${word.ex2 ? `<div class="example">${word.ex2}<br>${word.exTr2}</div>` : ''}
      ` : `
        <div class="word-en">${word.en}</div>
        <div class="hint">Çeviriyi görmek için dokun</div>
      `}
    </div>
    <div class="card-actions">
      <button class="btn btn-secondary" id="btnLearning">Tekrar Edeceğim</button>
      <button class="btn btn-primary" id="btnKnown">Biliyorum</button>
    </div>
    ` : `<p class="section-sub">Bu kategoride kart yok.</p>`}
  `;

  document.querySelectorAll('#levelRow .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      flashLevelFilter = chip.dataset.lvl;
      flashFilter = 'Tümü';
      flashIndex = 0;
      flashFlipped = false;
      render();
    });
  });
  document.querySelectorAll('#catRow .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      flashFilter = chip.dataset.cat;
      flashIndex = 0;
      flashFlipped = false;
      render();
    });
  });
  const card = document.getElementById('flashCard');
  if(card){
    card.addEventListener('click', ()=>{
      flashFlipped = !flashFlipped;
      render();
    });
  }
  const btnKnown = document.getElementById('btnKnown');
  const btnLearning = document.getElementById('btnLearning');
  if(btnKnown){
    btnKnown.addEventListener('click', (e)=>{
      e.stopPropagation();
      progress.flashcards[word.id] = 'known';
      recordWord(word.id, true);
      addXp(10);
      burstConfetti(e.clientX, e.clientY, 12);
      const leveledUp = checkLevelUp();
      afterProgress(leveledUp);
      nextCard(main, currentDeck());
    });
  }
  if(btnLearning){
    btnLearning.addEventListener('click', (e)=>{
      e.stopPropagation();
      progress.flashcards[word.id] = 'learning';
      recordWord(word.id, false);
      addXp(2);
      afterProgress(false);
      nextCard(main, currentDeck());
    });
  }
}
function nextCard(main, deck){
  flashIndex = deck.length ? (flashIndex+1) % deck.length : 0;
  flashFlipped = false;
  render();
}

/* ---------------- GRAMMAR ---------------- */
function renderGrammar(main){
  main.innerHTML = `
    <h2 class="section-title">Grammar Alıştırmaları</h2>
    <p class="section-sub">Konuya dokun, soruları çöz, doğru cevabı işaretle. Kilitli konular seviyen yükseldikçe açılır.</p>
    <div id="topicList"></div>
  `;
  const list = document.getElementById('topicList');
  GRAMMAR.forEach((topic, tIdx)=>{
    const locked = levelIdx(topic.level) > progress.level;
    const doneCount = topic.qs.filter((q,qIdx)=>progress.grammarDone[tIdx+'-'+qIdx]).length;
    const pct = Math.round(100*doneCount/topic.qs.length);
    const card = document.createElement('div');
    card.className = 'topic-card' + (locked ? ' locked' : '');
    card.innerHTML = `
      <div class="topic-head" data-t="${tIdx}">
        <div>
          <h3>${locked ? '🔒 ' : ''}${topic.topic}</h3>
          ${locked ? `<div class="tier-note" style="margin:4px 0 0;text-align:left;">${topic.level} seviyesinde açılır</div>` : `<div class="topic-progress-bar"><div class="topic-progress-fill" style="width:${pct}%"></div></div>`}
        </div>
        <span style="font-size:0.75rem;color:var(--ink-soft)">${locked ? '' : doneCount+'/'+topic.qs.length}</span>
      </div>
      <div class="topic-body ${openTopic===tIdx?'open':''}" id="topicBody${tIdx}"></div>
    `;
    list.appendChild(card);
    card.querySelector('.topic-head').addEventListener('click', ()=>{
      if(locked){
        showLevelToast(`🔒 Bu konu ${topic.level} seviyesinde açılıyor. Önce ${LEVELS[progress.level].code} kelimelerinin %70'ini öğren.`);
        return;
      }
      openTopic = openTopic===tIdx ? null : tIdx;
      render();
    });
    if(!locked && openTopic===tIdx){
      const body = card.querySelector('.topic-body');
      topic.qs.forEach((q, qIdx)=>{
        const key = tIdx+'-'+qIdx;
        const block = document.createElement('div');

/* ---------------- WRITING PRACTICE ---------------- */
function pickPool(n){
  const curCode = LEVELS[progress.level].code;
  const tierNotKnown = VOCAB.filter(w=>w.level===curCode && progress.flashcards[w.id]!=='known');
  if(tierNotKnown.length>=n) return [...tierNotKnown].sort(()=>Math.random()-0.5).slice(0,n);
  const otherNotKnown = unlockedVocab().filter(w=>w.level!==curCode && progress.flashcards[w.id]!=='known');
  const combined = [...tierNotKnown, ...[...otherNotKnown].sort(()=>Math.random()-0.5)];
  if(combined.length>=n) return combined.slice(0,n);
  const pool = unlockedVocab();
  const source = combined.length ? combined : pool;
  return [...source].sort(()=>Math.random()-0.5).slice(0, Math.min(n, pool.length));
}
function buildWriting(){

/* ---------------- ADAPTIVE MIXED EXAM ---------------- */
function wordWeight(w){
  const st = progress.wordStats[w.id];
  const total = st ? st.right+st.wrong : 0;
  const base = total===0 ? 3 : 1 + (st.wrong/total)*4;
  const tierGap = progress.level - levelIdx(w.level); // 0 = mevcut seviyen, >0 = daha kolay/geçmiş seviye
  if(tierGap <= 0) return base; // mevcut seviyen: tam ağırlık
  const known = progress.flashcards[w.id]==='known';
  if(known) return base * 0.12; // biliyorum dediğin eski kelime: neredeyse hiç çıkmasın
  return base * 0.4; // henüz 'biliyorum' denmemiş eski kelime: az da olsa tekrar için kalsın
}
function weightedSample(arr, weightFn, n){
  const pool = [...arr];
  const picked = [];
  for(let i=0;i<n && pool.length;i++){
    const weights = pool.map(weightFn);
    const total = weights.reduce((a,b)=>a+b,0) || 1;
    let r = Math.random()*total;
    let idx = 0;
    for(;idx<weights.length;idx++){ r -= weights[idx]; if(r<=0) break; }
    idx = Math.min(idx, pool.length-1);
    picked.push(pool[idx]);
    pool.splice(idx,1);
  }
  return picked;
}
function buildAdaptiveExam(){
  const vocabPool = unlockedVocab();
  const vocabPicks = weightedSample(vocabPool, wordWeight, Math.min(6, vocabPool.length));
  const vocabQs = vocabPicks.map(w=>{
    const direction = Math.random()<0.5 ? 'en-tr' : 'tr-en';
    const correct = direction==='en-tr' ? w.tr : w.en;
    const distractors = vocabPool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=> direction==='en-tr'?x.tr:x.en);
    const options = [...distractors, correct].sort(()=>Math.random()-0.5);
    return {type:'vocab', prompt: direction==='en-tr'?w.en:w.tr, options, answer:correct, wordId:w.id};
  });
  const grammarFlat = [];
  GRAMMAR.filter(t=>levelIdx(t.level)<=progress.level).forEach((topic,tIdx)=>{
    topic.qs.forEach((q,qIdx)=>{
      const key = tIdx+'-'+qIdx;
      grammarFlat.push({q, key, weight: progress.grammarDone[key] ? 0.6 : 2.2});
    });
  });
  const grammarPicks = weightedSample(grammarFlat, g=>g.weight, Math.min(4, grammarFlat.length));
  const grammarQs = grammarPicks.map(g=>({type:'grammar', prompt:g.q.q, options:g.q.opts, answer:g.q.a, key:g.key, exp:g.q.exp, expEn:g.q.expEn}));
  const curCode = LEVELS[progress.level].code;
  const readingPool = READINGS.filter(r=>r.tfEn && r.tfEn.length && r.level===curCode);
  const fallbackPool = READINGS.filter(r=>r.tfEn && r.tfEn.length && levelIdx(r.level)<=progress.level);
  const rPool = readingPool.length ? readingPool : fallbackPool;
  const reading = rPool.length ? rPool[Math.floor(Math.random()*rPool.length)] : null;
  const readingQs = reading ? [...reading.tfEn].sort(()=>Math.random()-0.5).slice(0,3).map(s=>(
    {type:'reading', prompt:s.q, options:['True','False'], answer: s.a ? 'True' : 'False', passage:reading.text, passageTitle:reading.title}
  )) : [];
  const all = [...vocabQs, ...grammarQs, ...readingQs].sort(()=>Math.random()-0.5);
  examState = {questions:all, idx:0, correctCount:0, byType:{vocab:{c:0,t:0}, grammar:{c:0,t:0}, reading:{c:0,t:0}}, finished:false, answered:false};
}

    <div class="quiz-result">
      <div class="big">${examState.correctCount}/${examState.questions.length}</div>

      ${suggestRetest ? `<p class="write-feedback ok show">🚀 Harika gidiyorsun! Seviye testini tekrar çözmeyi düşünebilirsin.</p>` : ''}
      <button class="btn-full" id="retryExam">Yeni Sınav</button>
    </div>
  `;
  document.getElementById('retryExam').addEventListener('click', ()=>{ examState = null; render(); });
}

/* ---------------- DICTIONARY (TR-EN / EN-EN) ---------------- */
function looksTurkish(str){
  return /[çğıöşüÇĞİÖŞÜ]/.test(str);
}
async function translateText(text, from, to){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('translate-failed');
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if(!translated) throw new Error('translate-empty');
  return translated;
}
async function fetchEnglishDefinition(word){
  const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
  if(res.status===404) return null;
  if(!res.ok) throw new Error('dict-failed');
  const data = await res.json();
  return Array.isArray(data) ? data[0] : null;
}
async function performLookup(term){
  term = term.trim();
  if(!term) return;
  dictState = {term, loading:true, result:null, error:null};
  render();
  trackEvent('/dictionary/search', 'Sözlük araması');
  try{
    const localMatches = VOCAB.filter(w=> w.en.toLowerCase()===term.toLowerCase() || w.tr.toLowerCase()===term.toLowerCase());
    const isTurkishInput = looksTurkish(term) || (localMatches.length>0 && localMatches[0].tr.toLowerCase()===term.toLowerCase());
    let englishWord = term;
    let turkishText = null;
    let definitionEntry = null;
    if(isTurkishInput){
      turkishText = term;
      try{ englishWord = await translateText(term, 'tr', 'en'); }catch(e){ englishWord = localMatches[0] ? localMatches[0].en : term; }
      try{ definitionEntry = await fetchEnglishDefinition(englishWord); }catch(e){}
    } else {
      try{ definitionEntry = await fetchEnglishDefinition(term); }catch(e){}
      if(definitionEntry){ englishWord = definitionEntry.word; }
      try{ turkishText = await translateText(englishWord, 'en', 'tr'); }catch(e){ turkishText = localMatches[0] ? localMatches[0].tr : null; }
    }
    if(!definitionEntry && !turkishText && localMatches.length===0){
      dictState = {term, loading:false, result:null, error:'notfound'};
    } else {
      dictState = {term, loading:false, error:null, result:{
        englishWord, turkishText, definitionEntry,
        localMatch: localMatches[0] || null
      }};
    }
  }catch(e){
    const localMatches = VOCAB.filter(w=> w.en.toLowerCase()===term.toLowerCase() || w.tr.toLowerCase()===term.toLowerCase());
    if(localMatches.length){
      dictState = {term, loading:false, error:null, result:{englishWord:localMatches[0].en, turkishText:localMatches[0].tr, definitionEntry:null, localMatch:localMatches[0]}};
    } else {
      dictState = {term, loading:false, result:null, error:'offline'};
    }
  }
  render();
}
function renderDictionary(main){
  main.innerHTML = `
    <h2 class="section-title">Sözlük</h2>
    <p class="section-sub">Türkçe veya İngilizce bir kelime yaz — hem İngilizce-İngilizce tanımını hem Türkçe karşılığını görürsün.</p>
    <div class="dict-search-row">
      <input class="write-input" id="dictInput" type="text" placeholder="Bir kelime yaz... (örn. improve / gelişmek)" value="${dictState.term ? dictState.term.replace(/"/g,'&quot;') : ''}" autocomplete="off">
      <button class="btn btn-primary" id="dictSearchBtn">Ara</button>
    </div>
    <div id="dictResult"></div>
  `;
  const input = document.getElementById('dictInput');
  const doSearch = ()=> performLookup(input.value);
  document.getElementById('dictSearchBtn').addEventListener('click', doSearch);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });
  const resArea = document.getElementById('dictResult');
  if(dictState.loading){
    resArea.innerHTML = `<p class="section-sub">Aranıyor...</p>`;
  } else if(dictState.error==='notfound'){
    resArea.innerHTML = `<p class="write-feedback no show">"${dictState.term}" için bir sonuç bulunamadı. Yazımı kontrol et.</p>`;
  } else if(dictState.error==='offline'){
    resArea.innerHTML = `<p class="write-feedback no show">Sözlük servisine ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene.</p>`;
  } else if(dictState.result){
    const r = dictState.result;
    let html = `<div class="dict-card">`;
    html += `<div class="dict-word">${r.englishWord}</div>`;
    if(r.definitionEntry && r.definitionEntry.phonetic){
      html += `<div class="dict-phonetic">${r.definitionEntry.phonetic}</div>`;
    }
    if(r.turkishText){
      html += `<div class="dict-tr">🇹🇷 ${r.turkishText}</div>`;
    }
    if(r.definitionEntry && r.definitionEntry.meanings){
      r.definitionEntry.meanings.slice(0,3).forEach(m=>{
        html += `<div class="dict-pos">${m.partOfSpeech}</div>`;
        (m.definitions||[]).slice(0,2).forEach(d=>{
          html += `<div class="dict-def">• ${d.definition}</div>`;
          if(d.example) html += `<div class="dict-example">"${d.example}"</div>`;
        });
      });
    } else if(r.localMatch){
      html += `<div class="dict-def">• ${r.localMatch.ex}</div>`;
      html += `<div class="dict-example">${r.localMatch.exTr}</div>`;
    } else {
      html += `<p class="section-sub">Bu kelime için İngilizce-İngilizce tanım bulunamadı, sadece çeviri gösteriliyor.</p>`;
    }
    html += `<button class="sound-btn" id="dictSpeak">🔊 Dinle</button>`;
    html += `</div>`;
    resArea.innerHTML = html;
    const speakBtn = document.getElementById('dictSpeak');
    if(speakBtn) speakBtn.addEventListener('click', ()=>speak(r.englishWord));
  } else {
    resArea.innerHTML = '';
  }
}

/* ---------------- MATCHING GAME ---------------- */
function buildMatchRound(){
  const pool = currentTierWords().length>=6 ? currentTierWords() : unlockedVocab();
  const picks = weightedSample(pool, wordWeight, Math.min(6, pool.length));
  const enItems = picks.map(w=>({id:w.id, text:w.en})).sort(()=>Math.random()-0.5);
  const trItems = picks.map(w=>({id:w.id, text:w.tr})).sort(()=>Math.random()-0.5);
  matchState = {words:picks, enItems, trItems, selectedEn:null, selectedTr:null, matched:{}, wrongPair:null};
}
function renderMatch(main){
  if(!matchState) buildMatchRound();
  const total = matchState.words.length;
  const doneCount = Object.keys(matchState.matched).length;
  main.innerHTML = `
    <h2 class="section-title">Eşleştir</h2>
    <p class="section-sub">Solda İngilizcesini, sağda Türkçesini bul ve ikisine de dokunarak eşleştir.</p>
    <div class="deck-status">${doneCount} / ${total} eşleşti</div>
    <div class="match-grid">
      <div class="match-col" id="matchColEn">
        ${matchState.enItems.map(it=>`<div class="match-item ${matchState.matched[it.id]?'matched':''} ${matchState.selectedEn===it.id?'selected':''} ${matchState.wrongPair&&matchState.wrongPair.en===it.id?'wrong':''}" data-id="${it.id}" data-side="en">${it.text}</div>`).join('')}
      </div>
      <div class="match-col" id="matchColTr">
        ${matchState.trItems.map(it=>`<div class="match-item ${matchState.matched[it.id]?'matched':''} ${matchState.selectedTr===it.id?'selected':''} ${matchState.wrongPair&&matchState.wrongPair.tr===it.id?'wrong':''}" data-id="${it.id}" data-side="tr">${it.text}</div>`).join('')}
      </div>
    </div>
    ${doneCount>=total ? `<button class="btn-full" id="matchNext">Yeni Tur</button>` : ''}
  `;
  main.querySelectorAll('.match-item:not(.matched)').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = parseInt(el.dataset.id);
      const side = el.dataset.side;
      if(side==='en') matchState.selectedEn = matchState.selectedEn===id ? null : id;
      else matchState.selectedTr = matchState.selectedTr===id ? null : id;
      if(matchState.selectedEn!==null && matchState.selectedTr!==null){
        if(matchState.selectedEn===matchState.selectedTr){
          matchState.matched[matchState.selectedEn] = true;
          recordWord(matchState.selectedEn, true);
          addXp(8);
          burstConfetti(el.getBoundingClientRect().left+20, el.getBoundingClientRect().top, 6);
          matchState.selectedEn = null; matchState.selectedTr = null;
          updateHeaderStats();
          checkBadges();
          if(Object.keys(matchState.matched).length>=matchState.words.length){
            const leveledUp = checkLevelUp();
            afterProgress(leveledUp);
          }
          render();
        } else {
          matchState.wrongPair = {en:matchState.selectedEn, tr:matchState.selectedTr};
          render();
          setTimeout(()=>{
            matchState.selectedEn = null; matchState.selectedTr = null; matchState.wrongPair = null;
            render();
          }, 700);
        }
      } else {
        render();
      }
    });
  });
  const nextBtn = document.getElementById('matchNext');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ buildMatchRound(); render(); });
}

/* ---------------- LISTENING PRACTICE ---------------- */
function buildListening(){
  const pool = currentTierWords().length>=6 ? currentTierWords() : unlockedVocab();
  const picks = weightedSample(pool, wordWeight, Math.min(6, pool.length));
  const questions = picks.map(w=>{
    const distractors = pool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.tr);
    const options = [...distractors, w.tr].sort(()=>Math.random()-0.5);
    return {word:w, options, answer:w.tr};
  });
  listenState = {questions, idx:0, correctCount:0, finished:false, answered:false, revealed:false};
}
function renderListen(main){
  main.innerHTML = `
    <h2 class="section-title">Dinle</h2>
    <p class="section-sub">Kelimeyi dinle, duyduğun kelimenin Türkçesini seç. Okuma değil, dinleme pratiği.</p>
    <div id="listenArea"></div>
  `;
  if(!listenState) renderListenStart();
  else if(listenState.finished) renderListenResult();
  else renderListenQuestion();
}
function renderListenStart(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  area.innerHTML = `<button class="btn-full" id="startListen">6 Soruluk Dinleme Turu Başlat</button>`;
  document.getElementById('startListen').addEventListener('click', ()=>{ buildListening(); render(); });
}
function renderListenQuestion(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  const q = listenState.questions[listenState.idx];
  area.innerHTML = `
    <div class="quiz-progress">Soru ${listenState.idx+1} / ${listenState.questions.length}</div>
    <div class="listen-card">
      <button class="sound-btn listen-big" id="listenPlay">🔊 Dinle</button>
      ${listenState.revealed ? `<div class="listen-word">${q.word.en}</div>` : ''}
    </div>
    <div class="q-options">
      ${q.options.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
    </div>
  `;
  document.getElementById('listenPlay').addEventListener('click', ()=>speak(q.word.en));
  speak(q.word.en);
  area.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(listenState.answered) return;
      listenState.answered = true;
      listenState.revealed = true;
      const chosen = opt.dataset.opt;
      area.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt===q.answer) o.classList.add('correct');
      });
      const correct = chosen===q.answer;
      if(!correct) opt.classList.add('incorrect');
      else { listenState.correctCount++; addXp(12); burstConfetti(opt.getBoundingClientRect().left+30, opt.getBoundingClientRect().top, 8); }
      recordWord(q.word.id, correct);
      setTimeout(()=>{
        listenState.idx++;
        listenState.answered = false;
        listenState.revealed = false;
        if(listenState.idx>=listenState.questions.length) finishListening();
        render();
      }, 1100);
    });
  });
}
function finishListening(){
  listenState.finished = true;
  const leveledUp = checkLevelUp();
  afterProgress(leveledUp);
  checkBadges();
}
function renderListenResult(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  area.innerHTML = `
    <div class="quiz-result">
      <div class="big">${listenState.correctCount}/${listenState.questions.length}</div>
      <p class="section-sub">doğru cevap</p>
      <button class="btn-full" id="retryListen">Yeni Tur</button>
    </div>
  `;
  document.getElementById('retryListen').addEventListener('click', ()=>{ listenState = null; render(); });
}

/* ---------------- FILL IN THE BLANK (CLOZE) ---------------- */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function findClozeSentence(w){
  const re = new RegExp('\\b'+escapeRegExp(w.en)+'\\b','i');
  if(w.ex && re.test(w.ex)) return {sentence:w.ex, sentenceTr:w.exTr};
  if(w.ex2 && re.test(w.ex2)) return {sentence:w.ex2, sentenceTr:w.exTr2};
  return null;
}
function buildCloze(){
  const tierPool = currentTierWords().filter(w=>findClozeSentence(w));
  const fullPool = unlockedVocab().filter(w=>findClozeSentence(w));
  const basePool = tierPool.length>=6 ? tierPool : fullPool;
  const picks = weightedSample(basePool, wordWeight, Math.min(6, basePool.length));
  const questions = picks.map(w=>{
    const found = findClozeSentence(w);
    const re = new RegExp('\\b'+escapeRegExp(w.en)+'\\b','i');
    const blanked = found.sentence.replace(re, '_____');
    return {word:w, blanked, sentenceTr:found.sentenceTr, answer:w.en};
  });
  clozeState = {questions, idx:0, correctCount:0, finished:false, answered:false};
}
function renderCloze(main){
  main.innerHTML = `
    <h2 class="section-title">Boşluk Doldurma</h2>
    <p class="section-sub">Cümledeki boşluğa uygun İngilizce kelimeyi yaz. Türkçe çeviri sana ipucu verir.</p>
    <div id="clozeArea"></div>
  `;
  if(!clozeState) renderClozeStart();
  else if(clozeState.finished) renderClozeResult();
  else renderClozeQuestion();
}
function renderClozeStart(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  area.innerHTML = `<button class="btn-full" id="startCloze">6 Soruluk Boşluk Doldurma Başlat</button>`;
  document.getElementById('startCloze').addEventListener('click', ()=>{ buildCloze(); render(); });
}
function renderClozeQuestion(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  const q = clozeState.questions[clozeState.idx];
  area.innerHTML = `
    <div class="quiz-progress">Soru ${clozeState.idx+1} / ${clozeState.questions.length}</div>
    <div class="write-card">
      <div class="write-prompt-label">Cümleyi tamamla</div>
      <div class="cloze-sentence">${q.blanked}</div>
      <div class="cloze-tr">${q.sentenceTr}</div>
    </div>
    <input class="write-input" id="clozeInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Eksik kelimeyi yaz...">
    <div class="write-feedback" id="clozeFeedback"></div>
    <button class="btn-full" id="clozeCheck">Kontrol Et</button>
  `;
  const input = document.getElementById('clozeInput');
  input.focus();
  const doCheck = ()=>{
    if(clozeState.answered) return;
    clozeState.answered = true;
    const isCorrect = normalize(input.value) === normalize(q.answer);
    input.classList.add(isCorrect ? 'correct' : 'incorrect');
    input.disabled = true;
    const fb = document.getElementById('clozeFeedback');
    fb.className = 'write-feedback ' + (isCorrect ? 'ok' : 'no');
    fb.textContent = isCorrect ? '✓ Doğru!' : ('✗ Doğrusu: ' + q.answer);
    recordWord(q.word.id, isCorrect);
    if(isCorrect){ clozeState.correctCount++; addXp(14); burstConfetti(window.innerWidth/2, 220, 10); }
    else { addXp(3); }
    const leveledUp = checkLevelUp();
    afterProgress(leveledUp);
    setTimeout(()=>{
      clozeState.idx++;
      clozeState.answered = false;
      if(clozeState.idx>=clozeState.questions.length) clozeState.finished = true;
      render();
    }, 1200);
  };
  document.getElementById('clozeCheck').addEventListener('click', doCheck);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doCheck(); });
}
function renderClozeResult(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  area.innerHTML = `
    <div class="quiz-result">
      <div class="big">${clozeState.correctCount}/${clozeState.questions.length}</div>
      <p class="section-sub">doğru cevap</p>
      <button class="btn-full" id="retryCloze">Yeni Tur</button>
    </div>
  `;
  document.getElementById('retryCloze').addEventListener('click', ()=>{ clozeState = null; render(); });
}

/* ---------------- READING COMPREHENSION ---------------- */
function readingQuestions(r){
  return (LANG==='en' && r.qsEn && r.qsEn.length) ? r.qsEn : r.qs;
}
function renderReading(main){
  if(!readingLevelFilter) readingLevelFilter = LEVELS[progress.level].code;
  const levelOptions = LEVELS.filter((l,idx)=>idx<=progress.level).map(l=>l.code);
  const reading = READINGS.find(r=>r.level===readingLevelFilter) || READINGS[0];
  const rqs = readingQuestions(reading);
  const doneInThis = rqs.filter((q,qi)=>progress.readingDone[reading.level+'-'+qi]).length;
  main.innerHTML = `
    <h2 class="section-title">Okuma Parçası</h2>
    <p class="section-sub">Metni oku, anlamını çıkar, sorulara cevap ver. Takılırsan Türkçe çevirisine bakabilirsin.</p>
    <div class="chip-row" id="readLevelRow">
      ${levelOptions.map(lv=>`<div class="chip ${lv===readingLevelFilter?'active':''}" data-lvl="${lv}">${lv} ${lv===LEVELS[progress.level].code?'(seviyen)':''}</div>`).join('')}
    </div>
    <div class="reading-card">
      <div class="reading-title">${reading.title}</div>
      <div class="reading-text">${reading.text}</div>
      <div class="reading-tr" id="readingTr">${reading.textTr}</div>
      <button class="reveal-btn" id="revealTr">Türkçe Çeviriyi Göster</button>
    </div>
    <div class="deck-status">${doneInThis}/${rqs.length} soru tamamlandı</div>
    <div id="readingQs"></div>
  `;
  document.querySelectorAll('#readLevelRow .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      readingLevelFilter = chip.dataset.lvl;
      render();
    });
  });
  const revealBtn = document.getElementById('revealTr');
  revealBtn.addEventListener('click', ()=>{
    const tr = document.getElementById('readingTr');
    tr.classList.toggle('show');
    revealBtn.textContent = tr.classList.contains('show') ? 'Türkçe Çeviriyi Gizle' : 'Türkçe Çeviriyi Göster';
  });
  const qArea = document.getElementById('readingQs');
  readingQuestions(reading).forEach((q, qIdx)=>{
    const key = reading.level+'-'+qIdx;
    const block = document.createElement('div');
    block.className = 'q-block';
    block.innerHTML = `
      <div class="q-text">${qIdx+1}. ${q.q}</div>
      <div class="q-options">
        ${q.opts.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
      </div>
    `;
    qArea.appendChild(block);
    block.querySelectorAll('.q-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(progress.readingDone[key]) return;
        const chosen = opt.dataset.opt;
        block.querySelectorAll('.q-option').forEach(o=>{
          o.classList.remove('correct','incorrect');
          if(o.dataset.opt===q.a) o.classList.add('correct');
        });
        if(chosen!==q.a){
          opt.classList.add('incorrect');
          addXp(2);
        } else {
          addXp(12);
          burstConfetti(opt.getBoundingClientRect().left+20, opt.getBoundingClientRect().top, 8);
        }
        progress.readingDone[key] = true;
        updateHeaderStats();
        checkBadges();
      });
    });
  });
}

  document.getElementById('retestBtn').addEventListener('click', ()=>{
    progress.placementDone = false;

  langBtn.addEventListener('click', ()=>{

    langBtn.textContent = next === 'en' ? 'EN' : 'TR';
    setLang(next);
  });
  applyStaticI18n();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  if(!window.supabase){
    document.getElementById('main').innerHTML = `
      <div class="pt-wrap pt-intro">
        <h2>Bağlantı kurulamadı</h2>
        <p>Hesap sistemi için internete ihtiyaç var. Bağlantını kontrol edip sayfayı yenile.</p>
      </div>`;
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: 'pkce'
    }
  });
  // After a Google redirect the URL carries ?code=... — clean it once the session is set.
  supabaseClient.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_IN' && (window.location.search.includes('code=') || window.location.hash.includes('access_token'))){
      try{ window.history.replaceState({}, document.title, window.location.pathname); }catch(e){}
    }
  });

  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session && data.session.user){
      await onAuthed(data.session.user);
    } else {
      authMode = 'login';
      renderAuth();
    }
  }catch(e){
    authMode = 'login';
    authError = 'Bağlantı kurulamadı, tekrar dene.';
    renderAuth();
  }
})();
