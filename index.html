<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>İngilizce Çalışma Kutum</title>
<meta name="theme-color" content="#2B3A67">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İngilizce Kutum">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B3A67'/%3E%3Ctext x='50' y='64' font-size='46' text-anchor='middle' fill='%23E39A34' font-family='Georgia,serif' font-weight='700'%3EEn%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B3A67'/%3E%3Ctext x='50' y='64' font-size='46' text-anchor='middle' fill='%23E39A34' font-family='Georgia,serif' font-weight='700'%3EEn%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0F3EE;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6478;
    --navy:#2B3A67;
    --navy-dark:#1D2848;
    --amber:#E39A34;
    --amber-soft:#FBEBD3;
    --green:#4C8C6F;
    --green-soft:#E1EFE7;
    --rose:#C1577B;
    --rose-soft:#F6E2E9;
    --border:#DEE3D9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(31,42,68,0.08);
  }
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 18px;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
  }
  header.topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.topbar p{
    margin:0;
    font-size:0.82rem;
    color:#C8D0E6;
  }
  .level-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .auth-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .user-email{
    font-size:0.72rem;
    color:#C8D0E6;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:210px;
  }
  .level-badge{
    background:var(--amber);
    color:var(--navy-dark);
    font-size:0.72rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:999px;
  }
  .retest-link{
    font-size:0.72rem;
    color:#B9C4E6;
    text-decoration:underline;
    cursor:pointer;
  }
  .rank-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }
  .rank-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.82rem;
    font-weight:600;
  }
  .rank-chip .emoji{font-size:1.15rem;}
  .xp-text{font-size:0.74rem;color:#C8D0E6;font-weight:600;}
  .xp-bar-track{
    height:7px;
    background:rgba(255,255,255,0.16);
    border-radius:999px;
    margin-top:8px;
    overflow:hidden;
  }
  .xp-bar-fill{
    height:100%;
    background:var(--amber);
    border-radius:999px;
    width:0%;
    transition:width 0.7s cubic-bezier(.2,.8,.3,1);
  }
  .streak-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .streak-pill{
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    padding:8px 10px;
    font-size:0.72rem;
    flex:1;
    text-align:center;
  }
  .streak-pill strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
  }
  main{
    flex:1;
    padding:20px 18px 90px;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 4px;
    color:var(--navy);
  }
  .section-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 16px;
    line-height:1.5;
  }
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-size:0.58rem;
    color:var(--ink-soft);
    padding:6px 1px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    border-radius:10px;
  }
  nav.tabbar button.active{
    color:var(--navy);
    background:var(--amber-soft);
  }
  nav.tabbar svg{width:17px;height:17px;}

  /* Placement test */
  .pt-wrap{padding:6px 2px;}
  .pt-intro, .pt-result{text-align:center;padding:26px 8px;}
  .pt-intro h2, .pt-result h2{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    color:var(--navy);
    margin:0 0 12px;
  }
  .pt-intro p{color:var(--ink-soft);font-size:0.88rem;line-height:1.6;margin:0 0 22px;}
  .pt-skip{display:block;text-align:center;margin-top:16px;font-size:0.8rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
  .pt-progress{font-size:0.75rem;color:var(--ink-soft);text-align:center;margin-bottom:12px;}
  .pt-q{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;color:var(--navy);text-align:center;margin-bottom:18px;line-height:1.4;}
  .level-big{font-family:'Fraunces',serif;font-size:2.6rem;color:var(--navy);font-weight:700;}
  .level-name{color:var(--amber);font-weight:600;margin-bottom:14px;}

  /* Level up toast */
  .level-toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-24px);
    background:var(--green);
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    font-size:0.83rem;
    font-weight:600;
    box-shadow:0 10px 28px rgba(0,0,0,0.2);
    opacity:0;
    transition:all 0.35s ease;
    z-index:999;
    max-width:88%;
    text-align:center;
  }
  .level-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* Flashcards */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .chip{
    white-space:nowrap;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:0.8rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .progress-strip{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .progress-box{
    flex:1;
    background:var(--green-soft);
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .progress-box.learning{background:var(--amber-soft);}
  .progress-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    color:var(--navy);
  }
  .progress-box span{font-size:0.72rem;color:var(--ink-soft);}
  .tier-note{
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .badge-strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:2px 2px 16px;
  }
  .badge-item{
    flex:0 0 auto;
    width:72px;
    text-align:center;
    padding:10px 5px;
    border-radius:14px;
    background:var(--bg);
    border:1px solid var(--border);
    transition:transform 0.15s ease;
  }
  .badge-item.earned{
    background:var(--amber-soft);
    border-color:var(--amber);
    animation:badgePop 0.4s ease;
  }
  .badge-item .b-emoji{
    font-size:1.4rem;
    display:block;
    margin-bottom:4px;
    filter:grayscale(1);
    opacity:0.35;
  }
  .badge-item.earned .b-emoji{filter:none;opacity:1;}
  .badge-item .b-name{font-size:0.6rem;color:var(--ink-soft);line-height:1.2;display:block;}
  .badge-item.earned .b-name{color:var(--navy);font-weight:600;}
  @keyframes badgePop{
    0%{transform:scale(0.7);}
    60%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .tier-ring-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg);
    border-radius:14px;
    padding:14px;
    margin-bottom:16px;
  }
  .tier-ring-wrap svg{flex:0 0 auto;}
  .tier-ring-text{font-size:0.78rem;color:var(--ink-soft);line-height:1.4;}
  .tier-ring-text strong{color:var(--navy);font-family:'Fraunces',serif;font-size:1rem;}
  .confetti-piece{
    position:fixed;
    width:8px;height:8px;
    border-radius:2px;
    pointer-events:none;
    z-index:1000;
  }
  .reading-card{
    background:var(--bg);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .reading-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--navy);
    margin-bottom:10px;
  }
  .reading-text{
    font-size:0.95rem;
    line-height:1.7;
    color:var(--ink);
  }
  .reading-tr{
    font-size:0.9rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .reading-tr.show{display:block;}
  .reveal-btn{
    margin-top:14px;
    background:none;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
  }
  @keyframes cardPop{
    0%{transform:scale(0.94) translateY(4px);opacity:0.4;}
    100%{transform:scale(1) translateY(0);opacity:1;}
  }
  .flashcard, .wod-card, .write-card{animation:cardPop 0.25s ease;}
  .btn:active, .btn-full:active, .chip:active, .q-option:active, .sb-chip:active, nav.tabbar button:active{
    transform:scale(0.95);
  }
  .btn, .btn-full, .chip, .q-option, .sb-chip, nav.tabbar button{
    transition:transform 0.12s ease;
  }
  .flashcard{
    background:var(--navy);
    color:#fff;
    border-radius:18px;
    min-height:210px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
    margin-bottom:16px;
  }
  .flashcard .cat-label{
    position:absolute;
    top:14px;
    left:16px;
    font-size:0.7rem;
    color:#AEB9DA;
  }
  .flashcard .lvl-label{
    position:absolute;
    top:14px;
    right:16px;
    font-size:0.68rem;
    color:var(--amber);
    font-weight:700;
  }
  .flashcard .word-en{
    font-family:'Fraunces',serif;
    font-size:1.9rem;
    font-weight:600;
  }
  .flashcard .word-tr{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--amber);
    margin-bottom:10px;
  }
  .flashcard .example{
    font-size:0.85rem;
    color:#D6DCEE;
    margin-top:10px;
    line-height:1.5;
  }
  .flashcard .hint{
    font-size:0.72rem;
    color:#8E9AC2;
    margin-top:14px;
  }
  .card-actions{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--rose-soft);
    color:var(--rose);
  }
  .btn-primary{
    background:var(--green-soft);
    color:var(--green);
  }
  .btn-full{
    width:100%;
    background:var(--navy);
    color:#fff;
    padding:13px;
    border-radius:12px;
    border:none;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    margin-top:6px;
  }
  .deck-status{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Grammar */
  .topic-card{
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .topic-card.locked{background:#FAFAF8;}
  .topic-head{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    background:var(--surface);
  }
  .topic-card.locked .topic-head{
    background:#FAFAF8;
    cursor:pointer;
  }
  .topic-head h3{
    margin:0;
    font-family:'Fraunces',serif;
    font-size:1rem;
    font-weight:600;
    color:var(--navy);
  }
  .topic-card.locked h3{color:var(--ink-soft);}
  .topic-progress-bar{
    height:5px;
    background:var(--border);
    border-radius:4px;
    margin-top:6px;
    width:140px;
    overflow:hidden;
  }
  .topic-progress-fill{
    height:100%;
    background:var(--green);
  }
  .topic-body{
    padding:0 16px 16px;
    display:none;
    border-top:1px solid var(--border);
  }
  .topic-body.open{display:block;}
  .q-block{margin-top:16px;}
  .q-text{font-size:0.92rem;margin-bottom:10px;line-height:1.5;}
  .q-options{display:flex;flex-direction:column;gap:8px;}
  .q-option{
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:0.86rem;
    cursor:pointer;
    background:var(--surface);
  }
  .q-option.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .q-option.incorrect{background:var(--rose-soft);border-color:var(--rose);color:var(--rose);}
  .q-explain{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:8px;
    padding:8px 10px;
    background:var(--bg);
    border-radius:8px;
    display:none;
  }
  .q-explain.show{display:block;}

  /* Word of day / quiz */
  .wod-card{
    background:linear-gradient(155deg,var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff;
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .wod-card .label{font-size:0.72rem;color:#9FADD4;margin-bottom:6px;}
  .wod-card .word{
    font-family:'Fraunces',serif;
    font-size:2rem;
    font-weight:700;
  }
  .wod-card .tr{
    color:var(--amber);
    font-size:1.2rem;
    font-family:'Fraunces',serif;
    font-weight:600;
    margin-top:2px;
  }
  .wod-card .example{
    margin-top:12px;
    font-size:0.85rem;
    color:#D6DCEE;
    line-height:1.5;
  }
  .sound-btn{
    margin-top:14px;
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-size:0.78rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .quiz-score-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .stat-box{
    flex:1;
    background:var(--bg);
    border-radius:12px;
    padding:10px;
    text-align:center;
  }
  .stat-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.2rem;
    color:var(--navy);
  }
  .stat-box span{font-size:0.7rem;color:var(--ink-soft);}
  .quiz-q{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:600;
    margin-bottom:14px;
    color:var(--navy);
    text-align:center;
  }
  .quiz-progress{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .quiz-result{
    text-align:center;
    padding:20px 10px;
  }
  .quiz-result .big{
    font-family:'Fraunces',serif;
    font-size:2.4rem;
    color:var(--navy);
    font-weight:700;
  }

  /* Sentence builder */
  .sb-hint{
    text-align:center;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .sb-answer-row{
    min-height:52px;
    border:1.5px dashed var(--border);
    border-radius:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    margin-bottom:16px;
  }
  .sb-chip{
    background:var(--navy);
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .sb-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .sb-pool .sb-chip{
    background:var(--bg);
    color:var(--ink);
    border:1px solid var(--border);
  }
  .sb-feedback{
    text-align:center;
    font-size:0.85rem;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
    display:none;
  }
  .sb-feedback.show{display:block;}
  .sb-feedback.ok{background:var(--green-soft);color:var(--green);}
  .sb-feedback.no{background:var(--rose-soft);color:var(--rose);}
  .sb-counter{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Writing practice */
  .write-card{
    background:var(--bg);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    margin-bottom:16px;
  }
  .write-prompt-label{font-size:0.72rem;color:var(--ink-soft);margin-bottom:8px;}
  .write-prompt{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--navy);}
  .write-input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-size:1rem;
    font-family:'Work Sans',sans-serif;
    margin-bottom:12px;
    outline:none;
  }
  .write-input:focus{border-color:var(--navy);}
  .write-input.correct{border-color:var(--green);background:var(--green-soft);}
  .write-input.incorrect{border-color:var(--rose);background:var(--rose-soft);}
  .write-feedback{font-size:0.84rem;text-align:center;margin-bottom:8px;min-height:20px;font-weight:600;}
  .write-feedback.ok{color:var(--green);}
  .write-feedback.no{color:var(--rose);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>İngilizce Çalışma Kutum</h1>
    <p>Kelime kelime, gün gün İngilizceni büyüt 🌱</p>
    <div class="auth-row" id="authRow" style="display:none">
      <span class="user-email" id="userEmailLabel"></span>
      <span class="retest-link" id="logoutBtn">Çıkış Yap</span>

function getRank(xp){
  let r = RANKS[0];
  for(const rk of RANKS){ if(xp>=rk.min) r=rk; }
  return r;
}
function nextRankThreshold(xp){
  const idx = RANKS.indexOf(getRank(xp));
  return idx < RANKS.length-1 ? RANKS[idx+1].min : null;
}

/* ---------------- STORAGE (local cache + cloud sync) ---------------- */
const STORAGE_KEY = 'ingilizce-calisma-kutum-progress';
let memoryFallback = null;
let saveTimer = null;

async function loadCloudProgress(){
  progress = defaultProgress();
  if(supabaseClient && currentUser){
    try{
      const { data, error } = await supabaseClient
        .from('progress')
        .select('data')
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if(data && data.data){
        progress = Object.assign(progress, data.data);
      }
    }catch(e){
      // offline or network error — fall back to the last local cache for this device
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) progress = Object.assign(progress, JSON.parse(raw));
      }catch(e2){}
    }
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function saveProgress(){
  const data = JSON.stringify(progress);
  try{ localStorage.setItem(STORAGE_KEY, data); }
  catch(e){ memoryFallback = JSON.parse(data); }
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(syncCloud, 800);
}
async function syncCloud(){
  if(!supabaseClient || !currentUser) return;
  try{
    await supabaseClient.from('progress').upsert({
      user_id: currentUser.id,
      data: progress,
      updated_at: new Date().toISOString()
    });
  }catch(e){ console.error('Cloud sync failed', e); }
}

/* ---------------- HELPERS ---------------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function unlockedVocab(){ return VOCAB.filter(w=>levelIdx(w.level) <= progress.level); }
function currentTierWords(){ return VOCAB.filter(w=>levelIdx(w.level) === progress.level); }
function unlockedSentences(){
  const all = SENTENCES.filter(s=>levelIdx(s.level) <= progress.level);
  const curCode = LEVELS[progress.level].code;
  const cur = all.filter(s=>s.level===curCode);
  const rest = all.filter(s=>s.level!==curCode);
  return [...cur, ...rest];
}
function normalize(str){
  return (str||'').toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
}
function checkLevelUp(){
  if(progress.level >= LEVELS.length-1) return false;
  const tier = currentTierWords();
  if(tier.length===0) return false;
  const known = tier.filter(w=>progress.flashcards[w.id]==='known').length;
  if(known/tier.length >= 0.7){
    progress.level++;
    saveProgress();
    return true;
  }
  return false;
}
function showLevelToast(msg){
  const t=document.createElement('div');
  t.className='level-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),400); },2800);
}
function addXp(n){
  progress.xp = (progress.xp||0) + n;
  saveProgress();
}
function checkBadges(){
  const newly = [];
  BADGES.forEach(b=>{
    if(!progress.badges[b.id] && b.check(progress)){
      progress.badges[b.id] = true;
      newly.push(b);
    }
  });
  if(newly.length){
    saveProgress();
    newly.forEach((b,i)=> setTimeout(()=>showBadgeToast(b), i*1700));
  }
  return newly;
}
function showBadgeToast(b){
  const t=document.createElement('div');
  t.className='level-toast';
  t.style.background = 'var(--navy)';
  t.textContent = `${b.emoji} Yeni rozet: ${b.name}`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  burstConfetti(window.innerWidth/2, 110, 16);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),400); },2600);
}
function burstConfetti(x, y, count){
  count = count || 12;
  const colors = ['#E39A34','#4C8C6F','#C1577B','#2B3A67','#6FA8DC','#F2C14E'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = x+'px';
    el.style.top = y+'px';
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = 50 + Math.random()*80;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 30;
    const rot = Math.floor(Math.random()*360);
    try{
      el.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:`translate(${dx}px, ${dy+130}px) rotate(${rot}deg)`, opacity:0}
      ], {duration:700+Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
    setTimeout(()=>el.remove(), 1150);
  }
}

  checkBadges();
}
function updateHeaderStats(){
  document.getElementById('streakCount').textContent = progress.quiz.streak || 0;
  const known = Object.values(progress.flashcards).filter(v=>v==='known').length;
  document.getElementById('knownCount').textContent = known;
  const totalAnswered = progress.quiz.total + progress.writing.total;
  const totalCorrect = progress.quiz.correct + progress.writing.correct;
  const avg = totalAnswered > 0 ? Math.round(100*totalCorrect/totalAnswered)+'%' : '–';
  document.getElementById('quizAvg').textContent = avg;
  document.getElementById('levelBadge').textContent = 'Seviye: ' + LEVELS[progress.level].code;
  const xp = progress.xp || 0;
  const rank = getRank(xp);
  document.getElementById('rankEmoji').textContent = rank.emoji;
  document.getElementById('rankTitle').textContent = rank.title;
  document.getElementById('xpText').textContent = xp + ' XP';
  const nextT = nextRankThreshold(xp);
  const prevT = rank.min;
  const pct = nextT===null ? 100 : Math.min(100, Math.round(100*(xp-prevT)/(nextT-prevT)));
  document.getElementById('xpBarFill').style.width = pct + '%';
}

function setAuthBusy(btnId, busyText){
  const btn = document.getElementById(btnId);
  if(btn){ btn.textContent = busyText; btn.disabled = true; }
}
async function doSignup(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password || password.length < 6){
    authError = 'Geçerli bir e-posta ve en az 6 karakterli bir şifre gir.';
    renderAuth();
    return;
  }
  setAuthBusy('authSubmit', 'Gönderiliyor...');
  try{
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ authError = error.message; renderAuth(); return; }
    pendingEmail = email;
    authMode = 'verify';
    authError = '';
    renderAuth();
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password){ authError = 'E-posta ve şifreni gir.'; renderAuth(); return; }
  setAuthBusy('authSubmit', 'Giriş yapılıyor...');
  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      if(error.message && error.message.toLowerCase().includes('confirm')){
        pendingEmail = email;
        authMode = 'verify';
        authError = 'Önce e-postanı doğrulaman gerekiyor.';
        renderAuth();
        return;
      }
      authError = error.message;
      renderAuth();
      return;
    }
    await onAuthed(data.user);
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doVerify(){
  const code = document.getElementById('verifyCode').value.trim();
  authError = '';
  if(!code){ authError = 'Kodu gir.'; renderAuth(); return; }
  setAuthBusy('verifyBtn', 'Doğrulanıyor...');
  try{
    const { data, error } = await supabaseClient.auth.verifyOtp({ email: pendingEmail, token: code, type: 'signup' });
    if(error){
      authError = 'Kod hatalı ya da süresi dolmuş. Tekrar dene.';
      renderAuth();
      return;
    }
    await onAuthed(data.user);
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
async function doResend(){
  try{
    await supabaseClient.auth.resend({ type: 'signup', email: pendingEmail });
    authError = 'Kod tekrar gönderildi, e-postanı kontrol et.';
  }catch(e){
    authError = 'Kod gönderilemedi, tekrar dene.';
  }
  renderAuth();
}

/* ---------------- WRITING PRACTICE ---------------- */
function pickPool(n){
  const curCode = LEVELS[progress.level].code;
  const tierNotKnown = VOCAB.filter(w=>w.level===curCode && progress.flashcards[w.id]!=='known');
  if(tierNotKnown.length>=n) return [...tierNotKnown].sort(()=>Math.random()-0.5).slice(0,n);
  const otherNotKnown = unlockedVocab().filter(w=>w.level!==curCode && progress.flashcards[w.id]!=='known');
  const combined = [...tierNotKnown, ...[...otherNotKnown].sort(()=>Math.random()-0.5)];
  if(combined.length>=n) return combined.slice(0,n);
  const pool = unlockedVocab();
  const source = combined.length ? combined : pool;
  return [...source].sort(()=>Math.random()-0.5).slice(0, Math.min(n, pool.length));
}
function buildWriting(){
  const words = pickPool(8);
  const items = words.map(w=>({w, direction: Math.random()<0.5 ? 'en-tr' : 'tr-en'}));
  writeState = {items, idx:0, correctCount:0, finished:false, answered:false};
}

  `;
  if(!writeState) renderWriteStart();
  else if(writeState.finished) renderWriteResult();
  else renderWriteQ();
}

  const input = document.getElementById('writeInput');

      <div class="big">${writeState.correctCount}/${writeState.items.length}</div>
      <p class="section-sub">doğru cevap</p>
      <button class="btn-full" id="retryWrite">Yeni Tur</button>
    </div>
  `;
  document.getElementById('retryWrite').addEventListener('click', ()=>{ writeState = null; render(); });
}

/* ---------------- WORD OF THE DAY + QUIZ ---------------- */
function dayIndex(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  const oneDay = 1000*60*60*24;
  return Math.floor(diff/oneDay);
}
function speak(text){
  try{
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    speechSynthesis.speak(utter);
  }catch(e){}
}
function renderWod(main){
  const pool = currentTierWords().length ? currentTierWords() : unlockedVocab();
  const word = pool[dayIndex() % pool.length];
  main.innerHTML = `
    <h2 class="section-title">Günün Kelimesi</h2>
    <p class="section-sub">Her gün yeni bir kelime, ardından küçük bir quiz.</p>
    <div class="wod-card">
      <div class="label">BUGÜNÜN KELİMESİ · ${word.level}</div>
      <div class="word">${word.en}</div>
      <div class="tr">${word.tr}</div>
      <div class="example">${word.ex}<br>${word.exTr}</div>
      <button class="sound-btn" id="speakWod">🔊 Dinle</button>
    </div>
    <div class="quiz-score-row">
      <div class="stat-box"><strong>${progress.quiz.total}</strong><span>Toplam Soru</span></div>
      <div class="stat-box"><strong>${progress.quiz.total?Math.round(100*progress.quiz.correct/progress.quiz.total):0}%</strong><span>Başarı</span></div>
      <div class="stat-box"><strong>${progress.quiz.streak||0}</strong><span>Gün Seri</span></div>
    </div>
    <div id="quizArea"></div>
  `;
  document.getElementById('speakWod').addEventListener('click', ()=>speak(word.en));
  if(!quizState){
    renderQuizStart();
  } else if(quizState.finished){
    renderQuizResult();
  } else {
    renderQuizQuestion();
  }
}
function buildQuiz(){
  const words = pickPool(5);
  const pool = unlockedVocab();
  const questions = words.map(w=>{
    const direction = Math.random() < 0.5 ? 'en-tr' : 'tr-en';
    const correct = direction==='en-tr' ? w.tr : w.en;
    const distractorPool = pool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3);
    const distractors = distractorPool.map(x=> direction==='en-tr' ? x.tr : x.en);
    const options = [...distractors, correct].sort(()=>Math.random()-0.5);
    return { prompt: direction==='en-tr' ? w.en : w.tr, direction, options, answer: correct, wordId: w.id };
  });
  quizState = {questions, idx:0, correctCount:0, finished:false, answered:false};
}
function renderQuizStart(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  area.innerHTML = `<button class="btn-full" id="startQuiz">5 Soruluk Quiz Başlat</button>`;
  document.getElementById('startQuiz').addEventListener('click', ()=>{
    buildQuiz();
    render();
  });
}
function renderQuizQuestion(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  const q = quizState.questions[quizState.idx];
  area.innerHTML = `
    <div class="quiz-progress">Soru ${quizState.idx+1} / ${quizState.questions.length}</div>
    <div class="quiz-q">${q.prompt}</div>
    <div class="q-options">
      ${q.options.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
    </div>
  `;
  area.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      const chosen = opt.dataset.opt;
      area.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt===q.answer) o.classList.add('correct');
      });
      let correct = false;
      if(chosen!==q.answer) opt.classList.add('incorrect');
      else { quizState.correctCount++; correct = true; addXp(15); burstConfetti(opt.getBoundingClientRect().left+30, opt.getBoundingClientRect().top, 8); }
      progress.flashcards[q.wordId] = correct ? 'known' : (progress.flashcards[q.wordId]==='known' ? 'known' : 'learning');
      setTimeout(()=>{
        quizState.idx++;
        quizState.answered = false;
        if(quizState.idx >= quizState.questions.length){
          finishQuiz();
        }
        render();
      }, 900);
    });
  });
}
function finishQuiz(){
  quizState.finished = true;
  progress.quiz.total += quizState.questions.length;
  progress.quiz.correct += quizState.correctCount;
  const today = todayStr();
  if(progress.quiz.lastDate !== today){
    const last = progress.quiz.lastDate;
    if(last){
      const parts = last.split('-');
      const lastDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      const now = new Date();
      const diffDays = Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(lastDate.getFullYear(),lastDate.getMonth(),lastDate.getDate()))/(1000*60*60*24));
      progress.quiz.streak = diffDays === 1 ? (progress.quiz.streak||0)+1 : 1;
    } else {
      progress.quiz.streak = 1;
    }
    progress.quiz.lastDate = today;
  }
  saveProgress();
  const leveledUp = checkLevelUp();
  afterProgress(leveledUp);
}
function renderQuizResult(){
  const area = document.getElementById('quizArea');
  if(!area) return;
  area.innerHTML = `
    <div class="quiz-result">
      <div class="big">${quizState.correctCount}/${quizState.questions.length}</div>
      <p class="section-sub">doğru cevap</p>
      <button class="btn-full" id="retryQuiz">Yeni Quiz</button>
    </div>
  `;
  document.getElementById('retryQuiz').addEventListener('click', ()=>{
    quizState = null;
    render();
  });
}

/* ---------------- SENTENCE BUILDER ---------------- */
function initSb(idx){
  const list = unlockedSentences();
  const s = list[idx % list.length];
  const pool = [...s.words].sort(()=>Math.random()-0.5);
  sbState = {idx: idx % list.length, pool, built:[], checked:false, correct:false};
}
function renderSentence(main){
  const list = unlockedSentences();
  if(!sbState || sbState.idx >= list.length) initSb(0);
  const doneCount = Object.keys(progress.sentenceDone).filter(k=>list.some((s,i)=>i===parseInt(k))).length;
  const s = list[sbState.idx];
  main.innerHTML = `
    <h2 class="section-title">Cümle Kur</h2>
    <p class="section-sub">Kelimelere doğru sırada dokunarak cümleyi oluştur. Seviyen yükseldikçe daha zor cümleler açılır.</p>
    <div class="sb-counter">Bu seviyede tamamlanan: ${doneCount} / ${list.length}</div>
    <div class="sb-hint">💡 ${s.hint}</div>
    <div class="sb-answer-row" id="sbAnswer">
      ${sbState.built.map((w,i)=>`<div class="sb-chip" data-i="${i}">${w}</div>`).join('')}
    </div>
    <div class="sb-pool" id="sbPool">
      ${sbState.pool.map((w,i)=>`<div class="sb-chip" data-i="${i}">${w}</div>`).join('')}
    </div>
    <div class="sb-feedback ${sbState.checked?'show':''} ${sbState.correct?'ok':'no'}" id="sbFeedback">
      ${sbState.checked ? (sbState.correct ? '✓ Doğru! ' + s.full : '✗ Tekrar dene. Doğrusu: ' + s.full) : ''}
    </div>
    <div class="card-actions">
      <button class="btn btn-secondary" id="sbReset">Sıfırla</button>
      <button class="btn btn-primary" id="sbCheck">Kontrol Et</button>
    </div>
    <button class="btn-full" id="sbNext">Sonraki Cümle</button>
  `;
  document.querySelectorAll('#sbPool .sb-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const i = parseInt(chip.dataset.i);
      sbState.built.push(sbState.pool[i]);
      sbState.pool.splice(i,1);
      sbState.checked = false;
      renderSentence(main);
    });
  });
  document.querySelectorAll('#sbAnswer .sb-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const i = parseInt(chip.dataset.i);
      sbState.pool.push(sbState.built[i]);
      sbState.built.splice(i,1);
      sbState.checked = false;
      renderSentence(main);
    });
  });
  document.getElementById('sbReset').addEventListener('click', ()=>{
    initSb(sbState.idx);
    renderSentence(main);
  });
  document.getElementById('sbCheck').addEventListener('click', ()=>{
    sbState.checked = true;
    sbState.correct = JSON.stringify(sbState.built) === JSON.stringify(s.words);
    if(sbState.correct){
      progress.sentenceDone[sbState.idx] = true;
      addXp(20);
      burstConfetti(window.innerWidth/2, 260, 14);
      updateHeaderStats();
      checkBadges();
    }
    renderSentence(main);
  });
  document.getElementById('sbNext').addEventListener('click', ()=>{
    const nextList = unlockedSentences();
    const nextIdx = (sbState.idx+1) % nextList.length;
    initSb(nextIdx);
    renderSentence(main);
  });
}

/* ---------------- READING COMPREHENSION ---------------- */
function renderReading(main){
  if(!readingLevelFilter) readingLevelFilter = LEVELS[progress.level].code;
  const levelOptions = LEVELS.filter((l,idx)=>idx<=progress.level).map(l=>l.code);
  const reading = READINGS.find(r=>r.level===readingLevelFilter) || READINGS[0];
  const doneInThis = reading.qs.filter((q,qi)=>progress.readingDone[reading.level+'-'+qi]).length;
  main.innerHTML = `
    <h2 class="section-title">Okuma Parçası</h2>
    <p class="section-sub">Metni oku, anlamını çıkar, sorulara cevap ver. Takılırsan Türkçe çevirisine bakabilirsin.</p>
    <div class="chip-row" id="readLevelRow">
      ${levelOptions.map(lv=>`<div class="chip ${lv===readingLevelFilter?'active':''}" data-lvl="${lv}">${lv} ${lv===LEVELS[progress.level].code?'(seviyen)':''}</div>`).join('')}
    </div>
    <div class="reading-card">
      <div class="reading-title">${reading.title}</div>
      <div class="reading-text">${reading.text}</div>
      <div class="reading-tr" id="readingTr">${reading.textTr}</div>
      <button class="reveal-btn" id="revealTr">Türkçe Çeviriyi Göster</button>
    </div>
    <div class="deck-status">${doneInThis}/${reading.qs.length} soru tamamlandı</div>
    <div id="readingQs"></div>
  `;
  document.querySelectorAll('#readLevelRow .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      readingLevelFilter = chip.dataset.lvl;
      renderReading(main);
    });
  });
  const revealBtn = document.getElementById('revealTr');
  revealBtn.addEventListener('click', ()=>{
    const tr = document.getElementById('readingTr');
    tr.classList.toggle('show');
    revealBtn.textContent = tr.classList.contains('show') ? 'Türkçe Çeviriyi Gizle' : 'Türkçe Çeviriyi Göster';
  });
  const qArea = document.getElementById('readingQs');
  reading.qs.forEach((q, qIdx)=>{
    const key = reading.level+'-'+qIdx;
    const block = document.createElement('div');
    block.className = 'q-block';
    block.innerHTML = `
      <div class="q-text">${qIdx+1}. ${q.q}</div>
      <div class="q-options">
        ${q.opts.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
      </div>
    `;
    qArea.appendChild(block);
    block.querySelectorAll('.q-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(progress.readingDone[key]) return;
        const chosen = opt.dataset.opt;
        block.querySelectorAll('.q-option').forEach(o=>{
          o.classList.remove('correct','incorrect');
          if(o.dataset.opt===q.a) o.classList.add('correct');
        });
        if(chosen!==q.a){
          opt.classList.add('incorrect');
          addXp(2);
        } else {
          addXp(12);
          burstConfetti(opt.getBoundingClientRect().left+20, opt.getBoundingClientRect().top, 8);
        }
        progress.readingDone[key] = true;
        updateHeaderStats();
        checkBadges();
      });
    });
  });
}


(async function init(){
  document.getElementById('retestBtn').addEventListener('click', ()=>{
    progress.placementDone = false;
    showPlacementIntro();
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);

  if(!window.supabase){
    document.getElementById('main').innerHTML = `
      <div class="pt-wrap pt-intro">
        <h2>Bağlantı kurulamadı</h2>
        <p>Hesap sistemi için internete ihtiyaç var. Bağlantını kontrol edip sayfayı yenile.</p>
      </div>`;
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session && data.session.user){
      await onAuthed(data.session.user);
    } else {
      authMode = 'login';
      renderAuth();
    }
  }catch(e){
    authMode = 'login';
    authError = 'Bağlantı kurulamadı, tekrar dene.';
    renderAuth();
  }
})();
</script>
