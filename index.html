<style>
  :root{
    --bg:#F0F3EE;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6478;
    --navy:#2B3A67;
    --navy-dark:#1D2848;
    --amber:#E39A34;
    --amber-soft:#FBEBD3;
    --green:#4C8C6F;
    --green-soft:#E1EFE7;
    --rose:#C1577B;
    --rose-soft:#F6E2E9;
    --border:#DEE3D9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(31,42,68,0.08);
  }
  header.topbar{
    padding-top:calc(18px + env(safe-area-inset-top));
    background:var(--navy);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 18px;
    border-bottom-left-radius:22px;
    border-bottom-right-radius:22px;
  }
  header.topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.topbar p{
    margin:0;
    font-size:0.82rem;
    color:#C8D0E6;
  }
  .level-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .auth-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .user-email{
    font-size:0.72rem;
    color:#C8D0E6;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:210px;
  }
  .level-badge{
    background:var(--amber);
    color:var(--navy-dark);
    font-size:0.72rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:999px;
  }
  .retest-link{
    font-size:0.72rem;
    color:#B9C4E6;
    text-decoration:underline;
    cursor:pointer;
  }
  .rank-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }
  .rank-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.82rem;
    font-weight:600;
  }
  .rank-chip .emoji{font-size:1.15rem;}
  .xp-text{font-size:0.74rem;color:#C8D0E6;font-weight:600;}
  .xp-bar-track{
    height:7px;
    background:rgba(255,255,255,0.16);
    border-radius:999px;
    margin-top:8px;
    overflow:hidden;
  }
  .xp-bar-fill{
    height:100%;
    background:var(--amber);
    border-radius:999px;
    width:0%;
    transition:width 0.7s cubic-bezier(.2,.8,.3,1);
  }
  .streak-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .streak-pill{
    background:rgba(255,255,255,0.1);
    border-radius:12px;
    padding:8px 10px;
    font-size:0.72rem;
    flex:1;
    text-align:center;
  }
  .streak-pill strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    font-weight:600;
  }
  main{
    flex:1;
    padding:20px 18px 90px;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 4px;
    color:var(--navy);
  }
  .section-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 16px;
    line-height:1.5;
  }
  nav.tabbar{
    padding-bottom:env(safe-area-inset-bottom);
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-size:0.58rem;
    color:var(--ink-soft);
    padding:6px 1px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    border-radius:10px;
  }
  nav.tabbar button.active{
    color:var(--navy);
    background:var(--amber-soft);
  }
  nav.tabbar svg{width:17px;height:17px;}

  /* Placement test */
  .pt-wrap{padding:6px 2px;}
  .pt-intro, .pt-result{text-align:center;padding:26px 8px;}
  .pt-intro h2, .pt-result h2{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    color:var(--navy);
    margin:0 0 12px;
  }
  .pt-intro p{color:var(--ink-soft);font-size:0.88rem;line-height:1.6;margin:0 0 22px;}
  .pt-skip{display:block;text-align:center;margin-top:16px;font-size:0.8rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
  .pt-progress{font-size:0.75rem;color:var(--ink-soft);text-align:center;margin-bottom:12px;}
  .pt-q{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;color:var(--navy);text-align:center;margin-bottom:18px;line-height:1.4;}
  .level-big{font-family:'Fraunces',serif;font-size:2.6rem;color:var(--navy);font-weight:700;}
  .level-name{color:var(--amber);font-weight:600;margin-bottom:14px;}

  /* Level up toast */
  .level-toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-24px);
    background:var(--green);
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    font-size:0.83rem;
    font-weight:600;
    box-shadow:0 10px 28px rgba(0,0,0,0.2);
    opacity:0;
    transition:all 0.35s ease;
    z-index:999;
    max-width:88%;
    text-align:center;
  }
  .level-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* Flashcards */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .chip{
    white-space:nowrap;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:0.8rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  .progress-strip{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .progress-box{
    flex:1;
    background:var(--green-soft);
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .progress-box.learning{background:var(--amber-soft);}
  .progress-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    color:var(--navy);
  }
  .progress-box span{font-size:0.72rem;color:var(--ink-soft);}
  .tier-note{
    font-size:0.75rem;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .badge-strip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:2px 2px 16px;
  }
  .badge-item{
    flex:0 0 auto;
    width:72px;
    text-align:center;
    padding:10px 5px;
    border-radius:14px;
    background:var(--bg);
    border:1px solid var(--border);
    transition:transform 0.15s ease;
  }
  .badge-item.earned{
    background:var(--amber-soft);
    border-color:var(--amber);
    animation:badgePop 0.4s ease;
  }
  .badge-item .b-emoji{
    font-size:1.4rem;
    display:block;
    margin-bottom:4px;
    filter:grayscale(1);
    opacity:0.35;
  }
  .badge-item.earned .b-emoji{filter:none;opacity:1;}
  .badge-item .b-name{font-size:0.6rem;color:var(--ink-soft);line-height:1.2;display:block;}
  .badge-item.earned .b-name{color:var(--navy);font-weight:600;}
  @keyframes badgePop{
    0%{transform:scale(0.7);}
    60%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .tier-ring-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg);
    border-radius:14px;
    padding:14px;
    margin-bottom:16px;
  }
  .tier-ring-wrap svg{flex:0 0 auto;}
  .tier-ring-text{font-size:0.78rem;color:var(--ink-soft);line-height:1.4;}
  .tier-ring-text strong{color:var(--navy);font-family:'Fraunces',serif;font-size:1rem;}
  .confetti-piece{
    position:fixed;
    width:8px;height:8px;
    border-radius:2px;
    pointer-events:none;
    z-index:1000;
  }
  .reading-card{
    background:var(--bg);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .reading-title{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--navy);
    margin-bottom:10px;
  }
  .reading-text{
    font-size:0.95rem;
    line-height:1.7;
    color:var(--ink);
  }
  .reading-tr{
    font-size:0.9rem;
    line-height:1.7;
    color:var(--ink-soft);
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .reading-tr.show{display:block;}
  .reveal-btn{
    margin-top:14px;
    background:none;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
  }
  @keyframes cardPop{
    0%{transform:scale(0.94) translateY(4px);opacity:0.4;}
    100%{transform:scale(1) translateY(0);opacity:1;}
  }
  .flashcard, .wod-card, .write-card{animation:cardPop 0.25s ease;}
  .btn:active, .btn-full:active, .chip:active, .q-option:active, .sb-chip:active, nav.tabbar button:active{
    transform:scale(0.95);
  }
  .btn, .btn-full, .chip, .q-option, .sb-chip, nav.tabbar button{
    transition:transform 0.12s ease;
  }
  .flashcard{
    background:var(--navy);
    color:#fff;
    border-radius:18px;
    min-height:210px;
    padding:26px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    position:relative;
    margin-bottom:16px;
  }
  .flashcard .cat-label{
    position:absolute;
    top:14px;
    left:16px;
    font-size:0.7rem;
    color:#AEB9DA;
  }
  .flashcard .lvl-label{
    position:absolute;
    top:14px;
    right:16px;
    font-size:0.68rem;
    color:var(--amber);
    font-weight:700;
  }
  .flashcard .word-en{
    font-family:'Fraunces',serif;
    font-size:1.9rem;
    font-weight:600;
  }
  .flashcard .word-tr{
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--amber);
    margin-bottom:10px;
  }
  .flashcard .example{
    font-size:0.85rem;
    color:#D6DCEE;
    margin-top:10px;
    line-height:1.5;
  }
  .flashcard .hint{
    font-size:0.72rem;
    color:#8E9AC2;
    margin-top:14px;
  }
  .card-actions{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--rose-soft);
    color:var(--rose);
  }
  .btn-primary{
    background:var(--green-soft);
    color:var(--green);
  }
  .btn-full{
    width:100%;
    background:var(--navy);
    color:#fff;
    padding:13px;
    border-radius:12px;
    border:none;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    margin-top:6px;
  }
  .deck-status{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Grammar */
  .topic-card{
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .topic-card.locked{background:#FAFAF8;}
  .topic-head{
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    background:var(--surface);
  }
  .topic-card.locked .topic-head{
    background:#FAFAF8;
    cursor:pointer;
  }
  .topic-head h3{
    margin:0;
    font-family:'Fraunces',serif;
    font-size:1rem;
    font-weight:600;
    color:var(--navy);
  }
  .topic-card.locked h3{color:var(--ink-soft);}
  .topic-progress-bar{
    height:5px;
    background:var(--border);
    border-radius:4px;
    margin-top:6px;
    width:140px;
    overflow:hidden;
  }
  .topic-progress-fill{
    height:100%;
    background:var(--green);
  }
  .topic-body{
    padding:0 16px 16px;
    display:none;
    border-top:1px solid var(--border);
  }
  .topic-body.open{display:block;}
  .q-block{margin-top:16px;}
  .q-text{font-size:0.92rem;margin-bottom:10px;line-height:1.5;}
  .q-options{display:flex;flex-direction:column;gap:8px;}
  .q-option{
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:0.86rem;
    cursor:pointer;
    background:var(--surface);
  }
  .q-option.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);}
  .q-option.incorrect{background:var(--rose-soft);border-color:var(--rose);color:var(--rose);}
  .q-explain{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:8px;
    padding:8px 10px;
    background:var(--bg);
    border-radius:8px;
    display:none;
  }
  .q-explain.show{display:block;}

  /* Word of day / quiz */
  .wod-card{
    background:linear-gradient(155deg,var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff;
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .wod-card .label{font-size:0.72rem;color:#9FADD4;margin-bottom:6px;}
  .wod-card .word{
    font-family:'Fraunces',serif;
    font-size:2rem;
    font-weight:700;
  }
  .wod-card .tr{
    color:var(--amber);
    font-size:1.2rem;
    font-family:'Fraunces',serif;
    font-weight:600;
    margin-top:2px;
  }
  .wod-card .example{
    margin-top:12px;
    font-size:0.85rem;
    color:#D6DCEE;
    line-height:1.5;
  }
  .sound-btn{
    margin-top:14px;
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-size:0.78rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .quiz-score-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .stat-box{
    flex:1;
    background:var(--bg);
    border-radius:12px;
    padding:10px;
    text-align:center;
  }
  .stat-box strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.2rem;
    color:var(--navy);
  }
  .stat-box span{font-size:0.7rem;color:var(--ink-soft);}
  .quiz-q{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:600;
    margin-bottom:14px;
    color:var(--navy);
    text-align:center;
  }
  .quiz-progress{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .quiz-result{
    text-align:center;
    padding:20px 10px;
  }
  .quiz-result .big{
    font-family:'Fraunces',serif;
    font-size:2.4rem;
    color:var(--navy);
    font-weight:700;
  }

  /* Sentence builder */
  .sb-hint{
    text-align:center;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .sb-answer-row{
    min-height:52px;
    border:1.5px dashed var(--border);
    border-radius:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    margin-bottom:16px;
  }
  .sb-chip{
    background:var(--navy);
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .sb-pool{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .sb-pool .sb-chip{
    background:var(--bg);
    color:var(--ink);
    border:1px solid var(--border);
  }
  .sb-feedback{
    text-align:center;
    font-size:0.85rem;
    padding:10px;
    border-radius:10px;
    margin-bottom:12px;
    display:none;
  }
  .sb-feedback.show{display:block;}
  .sb-feedback.ok{background:var(--green-soft);color:var(--green);}
  .sb-feedback.no{background:var(--rose-soft);color:var(--rose);}
  .sb-counter{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  /* Writing practice */
  .write-card{
    background:var(--bg);
    border-radius:16px;
    padding:22px 18px;
    text-align:center;
    margin-bottom:16px;
  }
  .write-prompt-label{font-size:0.72rem;color:var(--ink-soft);margin-bottom:8px;}
  .write-prompt{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--navy);}
  .write-input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    font-size:1rem;
    font-family:'Work Sans',sans-serif;
    margin-bottom:12px;
    outline:none;
  }
  .write-input:focus{border-color:var(--navy);}
  .write-input.correct{border-color:var(--green);background:var(--green-soft);}
  .write-input.incorrect{border-color:var(--rose);background:var(--rose-soft);}
  .write-feedback{font-size:0.84rem;text-align:center;margin-bottom:8px;min-height:20px;font-weight:600;}
  .write-feedback.ok{color:var(--green);}
  .write-feedback.no{color:var(--rose);}

  /* Notification panel */
  .notif-modal{
    position:fixed;
    inset:0;
    background:rgba(31,42,68,0.45);
    display:flex;

const STORAGE_KEY = 'ingilizce-calisma-kutum-progress';

async function loadCloudProgress(){
  progress = defaultProgress();
  if(supabaseClient && currentUser){
    try{
      const { data, error } = await supabaseClient
        .from('progress')
        .select('data')
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if(data && data.data){
        progress = sanitizeProgress(data.data);
      }
    }catch(e){
      // offline or network error — fall back to the last local cache for this device
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) progress = sanitizeProgress(JSON.parse(raw));
      }catch(e2){}

/* ---------------- UNTRUSTED PROGRESS VALIDATION ----------------
   Anything coming back from the database or localStorage is treated as
   untrusted input: a tampered row must not be able to pollute prototypes,
   blow up memory, or hand us fields we never wrote. We rebuild the object
   from scratch, keeping only known keys with the expected shapes.        */
const DANGEROUS_KEYS = ['__proto__','constructor','prototype'];
function safeInt(v, min, max, fallback){
  const n = Number(v);
  if(!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, Math.trunc(n)));
}
function safeBool(v){ return v === true; }
function safeStr(v, max){
  return typeof v === 'string' ? v.slice(0, max || 40) : '';
}
function safeIdMap(obj, allowed, cap){
  const out = Object.create(null);
  if(!obj || typeof obj !== 'object') return out;
  let n = 0;
  for(const k of Object.keys(obj)){
    if(n >= (cap || 5000)) break;
    if(DANGEROUS_KEYS.includes(k)) continue;
    if(!/^[0-9]{1,7}$/.test(k) && !/^[0-9]{1,4}-[0-9]{1,4}$/.test(k) && !/^[A-Za-z0-9_-]{1,32}$/.test(k)) continue;
    const v = obj[k];
    if(allowed && !allowed.includes(v)) continue;
    out[k] = allowed ? v : safeBool(v);
    n++;
  }
  return Object.assign({}, out);
}
function sanitizeProgress(raw){
  const base = defaultProgress();
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return base;
  const p = base;
  p.level        = safeInt(raw.level, 0, LEVELS.length-1, 0);
  p.xp           = safeInt(raw.xp, 0, 100000000, 0);
  p.placementDone= safeBool(raw.placementDone);
  p.flashcards   = safeIdMap(raw.flashcards, ['known','learning'], 20000);
  p.grammarDone  = safeIdMap(raw.grammarDone, null, 5000);
  p.sentenceDone = safeIdMap(raw.sentenceDone, null, 5000);
  p.readingDone  = safeIdMap(raw.readingDone, null, 5000);
  p.badges       = safeIdMap(raw.badges, null, 200);

  const q = (raw.quiz && typeof raw.quiz === 'object') ? raw.quiz : {};
  p.quiz = {
    correct:  safeInt(q.correct, 0, 10000000, 0),
    total:    safeInt(q.total,   0, 10000000, 0),
    streak:   safeInt(q.streak,  0, 100000, 0),
    lastDate: /^\d{4}-\d{2}-\d{2}$/.test(q.lastDate) ? q.lastDate : null
  };
  const w = (raw.writing && typeof raw.writing === 'object') ? raw.writing : {};
  p.writing = {
    correct: safeInt(w.correct, 0, 10000000, 0),
    total:   safeInt(w.total,   0, 10000000, 0)
  };

  const ws = (raw.wordStats && typeof raw.wordStats === 'object') ? raw.wordStats : {};
  const stats = {};
  let c = 0;
  for(const k of Object.keys(ws)){
    if(c >= 20000) break;
    if(DANGEROUS_KEYS.includes(k) || !/^[0-9]{1,7}$/.test(k)) continue;
    const e = ws[k];
    if(!e || typeof e !== 'object') continue;
    stats[k] = { right: safeInt(e.right, 0, 1000000, 0), wrong: safeInt(e.wrong, 0, 1000000, 0) };
    c++;
  }
  p.wordStats = stats;

  p.studyLog = Array.isArray(raw.studyLog)
    ? raw.studyLog.slice(-40).map(h=>safeInt(h, 0, 23, 0)).filter(h=>Number.isInteger(h))
    : [];

  p.examHistory = Array.isArray(raw.examHistory)
    ? raw.examHistory.slice(-20).filter(h=>h && typeof h === 'object').map(h=>({
        date:    /^\d{4}-\d{2}-\d{2}$/.test(h.date) ? h.date : '',
        correct: safeInt(h.correct, 0, 1000, 0),
        total:   safeInt(h.total,   0, 1000, 0),
        level:   LEVELS.some(l=>l.code===h.level) ? h.level : ''
      }))
    : [];

  const n = (raw.notif && typeof raw.notif === 'object') ? raw.notif : {};
  p.notif = {
    enabled: safeBool(n.enabled),
    hour: (n.hour === null || n.hour === undefined) ? null : safeInt(n.hour, 0, 23, null),
    lastPromptDate: /^\d{4}-\d{2}-\d{2}$/.test(n.lastPromptDate) ? n.lastPromptDate : null
  };
  return p;
}

function saveProgress(){
  const data = JSON.stringify(progress);
  try{ localStorage.setItem(STORAGE_KEY, data); }
  catch(e){ memoryFallback = JSON.parse(data); }
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(syncCloud, 800);
}
async function syncCloud(){
  if(!supabaseClient || !currentUser) return;
  try{
    await supabaseClient.from('progress').upsert({
      user_id: currentUser.id,
      data: progress,
      updated_at: new Date().toISOString()
    });
  }catch(e){ /* stay quiet: error objects can carry request details */ }
}

/* ---------------- HELPERS ---------------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function unlockedVocab(){ return VOCAB.filter(w=>levelIdx(w.level) <= progress.level); }
function currentTierWords(){ return VOCAB.filter(w=>levelIdx(w.level) === progress.level); }
function unlockedSentences(){
  const all = SENTENCES.filter(s=>levelIdx(s.level) <= progress.level);
  const curCode = LEVELS[progress.level].code;
  const cur = all.filter(s=>s.level===curCode);
  const rest = all.filter(s=>s.level!==curCode);
  return [...cur, ...rest];
}
function normalize(str){
  return (str||'').toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
}
function checkLevelUp(){
  if(progress.level >= LEVELS.length-1) return false;
  const tier = currentTierWords();
  if(tier.length===0) return false;
  const known = tier.filter(w=>progress.flashcards[w.id]==='known').length;
  if(known/tier.length >= 0.7){
    progress.level++;
    saveProgress();
    return true;
  }
  return false;
}

function addXp(n){
  progress.xp = (progress.xp||0) + n;
  saveProgress();
}
function trackEvent(path, title){
  try{
    if(window.goatcounter && typeof window.goatcounter.count === 'function'){
      window.goatcounter.count({ path: path, title: title || path, event: true });
    }
  }catch(e){}
}
function recordWord(id, correct){
  if(!progress.wordStats) progress.wordStats = {};
  if(!progress.wordStats[id]) progress.wordStats[id] = {right:0, wrong:0};
  if(correct) progress.wordStats[id].right++;
  else progress.wordStats[id].wrong++;
}
function logStudySession(){
  const hour = new Date().getHours();
  progress.studyLog = progress.studyLog || [];
  progress.studyLog.push(hour);
  if(progress.studyLog.length>40) progress.studyLog = progress.studyLog.slice(-40);
  saveProgress();
}
function preferredHour(){
  const log = progress.studyLog||[];
  if(!log.length) return null;
  const buckets = {};
  log.forEach(h=>{ buckets[h]=(buckets[h]||0)+1; });
  let best=null, bestCount=-1;
  Object.entries(buckets).forEach(([h,c])=>{ if(c>bestCount){best=parseInt(h); bestCount=c;} });
  return best;
}
async function enableNotifications(){
  if(!('Notification' in window)){ alert('Bu tarayıcı bildirimleri desteklemiyor.'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm === 'granted'){
      progress.notif.enabled = true;
      progress.notif.hour = preferredHour();
      saveProgress();
      trackEvent('/notifications/enabled', 'Bildirimler açıldı');
      if('serviceWorker' in navigator){
        try{ await navigator.serviceWorker.register('sw.js'); }catch(e){}
      }
    } else {
      progress.notif.enabled = false;
      saveProgress();
    }
  }catch(e){}
  showNotifPanel();
}
function disableNotifications(){
  progress.notif.enabled = false;
  saveProgress();
  showNotifPanel();
}

function exportMyData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    email: currentUser ? currentUser.email : null,
    progress: progress
  };
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'oratino-my-data.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
    trackEvent('/account/export', 'Data exported');
  }catch(e){
    alert(LANG==='en' ? 'Export failed. Please try again.' : 'Dışa aktarma başarısız. Lütfen tekrar dene.');
  }
}
let _deleteArmed = false;
async function deleteMyAccount(){
  const btn = document.getElementById('deleteAccountBtn');
  if(!_deleteArmed){
    _deleteArmed = true;
    if(btn) btn.textContent = LANG==='en'
      ? 'Tap again to permanently delete'
      : 'Kalıcı olarak silmek için tekrar dokun';
    if(btn) btn.classList.add('btn-danger-armed');
    setTimeout(()=>{
      _deleteArmed = false;
      const b = document.getElementById('deleteAccountBtn');
      if(b){ b.textContent = LANG==='en' ? 'Delete my account' : 'Hesabımı sil'; b.classList.remove('btn-danger-armed'); }
    }, 6000);
    return;
  }
  _deleteArmed = false;
  if(btn){ btn.disabled = true; btn.textContent = LANG==='en' ? 'Deleting...' : 'Siliniyor...'; }
  let ok = false;
  try{
    // 1) remove the user's own data row (allowed by RLS)
    if(currentUser){
      await supabaseClient.from('progress').delete().eq('user_id', currentUser.id);
    }
    // 2) ask the server to delete the auth account itself
    const { data: sess } = await supabaseClient.auth.getSession();
    const token = sess && sess.session ? sess.session.access_token : null;
    if(token){
      const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
      });
      ok = res.ok;
    }
  }catch(e){ ok = false; }
  // 3) always clear the device and sign out, whatever the server said
  try{ await supabaseClient.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  currentUser = null;
  progress = defaultProgress();
  trackEvent('/account/delete', 'Account deleted');
  const modal = document.getElementById('notifModal');
  if(modal) modal.classList.remove('show');
  authMode = 'login';
  authError = ok
    ? (LANG==='en' ? 'Your account and data have been deleted.' : 'Hesabın ve verilerin silindi.')
    : (LANG==='en'
        ? 'Your data was removed and you have been signed out. If the account itself still exists, contact us and we will erase it.'
        : 'Verilerin silindi ve oturumun kapatıldı. Hesap hâlâ duruyorsa bize yaz, tamamen kaldıralım.');
  renderAuth();
}

function checkDailyReminder(force){
  if(!progress.notif || !progress.notif.enabled) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = todayStr();
  const practicedToday = progress.quiz.lastDate === today;
  if(practicedToday && !force) return;
  const hour = new Date().getHours();
  const pref = progress.notif.hour;
  const closeToPreferred = (pref===null||pref===undefined) ? true : Math.abs(hour-pref) <= 1;
  if(!closeToPreferred && !force) return;
  if(progress.notif.lastPromptDate === today && !force) return;
  try{
    new Notification('Oratino', {
      body: practicedToday ? 'Harika gidiyorsun, bugünkü serini korudun! 🔥' : 'Bugün henüz çalışmadın — birkaç dakikan yeter, serini bozma. 🌱',
      tag: 'daily-reminder'
    });
  }catch(e){}
  progress.notif.lastPromptDate = today;
  saveProgress();
}
function checkBadges(){
  const newly = [];
  BADGES.forEach(b=>{
    if(!progress.badges[b.id] && b.check(progress)){
      progress.badges[b.id] = true;
      newly.push(b);
    }
  });
  if(newly.length){
    saveProgress();
    newly.forEach((b,i)=> setTimeout(()=>showBadgeToast(b), i*1700));
  }
  return newly;
}
function showBadgeToast(b){
  const t=document.createElement('div');
  t.className='level-toast';
  t.style.background = 'var(--navy)';
  t.textContent = trUI(`${b.emoji} Yeni rozet: ${b.name}`);
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  burstConfetti(window.innerWidth/2, 110, 16);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),400); },2600);
}
function burstConfetti(x, y, count){
  count = count || 12;
  const colors = ['#E39A34','#4C8C6F','#C1577B','#2B3A67','#6FA8DC','#F2C14E'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = x+'px';
    el.style.top = y+'px';
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = 50 + Math.random()*80;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 30;
    const rot = Math.floor(Math.random()*360);
    try{
      el.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:`translate(${dx}px, ${dy+130}px) rotate(${rot}deg)`, opacity:0}
      ], {duration:700+Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)'});
    }catch(e){}
    setTimeout(()=>el.remove(), 1150);
  }
}

}
function updateHeaderStats(){
  document.getElementById('streakCount').textContent = progress.quiz.streak || 0;
  const known = Object.values(progress.flashcards).filter(v=>v==='known').length;
  document.getElementById('knownCount').textContent = known;

  const totalCorrect = progress.quiz.correct + progress.writing.correct;
  const avg = totalAnswered > 0 ? Math.round(100*totalCorrect/totalAnswered)+'%' : '–';
  document.getElementById('quizAvg').textContent = avg;
  document.getElementById('levelBadge').textContent = (LANG==='en'?'Level: ':'Seviye: ') + LEVELS[progress.level].code;
  const xp = progress.xp || 0;
  const rank = getRank(xp);
  document.getElementById('rankEmoji').textContent = rank.emoji;
  document.getElementById('rankTitle').textContent = rank.title;
  document.getElementById('xpText').textContent = xp + ' XP';
  const nextT = nextRankThreshold(xp);
  const prevT = rank.min;
  const pct = nextT===null ? 100 : Math.min(100, Math.round(100*(xp-prevT)/(nextT-prevT)));
  document.getElementById('xpBarFill').style.width = pct + '%';
  localizeDOM(document.querySelector('.topbar'));
}

// dynamic patterns: [regex, replacement]
const UI_PATTERNS = [
  [/^Soru (\d+) \/ (\d+)$/, "Question $1 / $2"],
  [/^Soru (\d+) \/ (\d+) · (.+)$/, "Question $1 / $2 · $3"],
  [/^(\d+) \/ (\d+) — (.+)$/, "$1 / $2 — $3"],
  [/^(\d+) \/ (\d+) eşleşti$/, "$1 / $2 matched"],
  [/^(\d+)\/(\d+) soru tamamlandı$/, "$1/$2 questions completed"],
  [/^Bu seviyede tamamlanan: (\d+) \/ (\d+)$/, "Completed at this level: $1 / $2"],
  [/^Seviye: (.+)$/, "Level: $1"],
  [/^BUGÜNÜN KELİMESİ · (.+)$/, "WORD OF THE DAY · $1"],
  [/^%(\d+) başarı(.*)$/, "$1% score$2"],
  [/^(\d+) XP$/, "$1 XP"],
  [/^(.+) seviyesinde açılır$/, "Unlocks at $1"],
  [/^✗ Doğrusu: (.+)$/, "✗ Correct answer: $1"],
  [/^✗ Tekrar dene\. Doğrusu: (.+)$/, "✗ Try again. Correct: $1"],
  [/^🎉 Tebrikler! (.+) seviyesine geçtin, yeni kelimeler açıldı\.$/, "🎉 Congratulations! You've reached $1 — new words unlocked."],
  [/^🔒 Bu konu (.+) seviyesinde açılıyor\. Önce (.+) kelimelerinin %70'ini öğren\.$/, "🔒 This topic unlocks at $1. First learn 70% of the $2 words."],
  [/^(.+) Yeni rozet: (.+)$/, "$1 New badge: $2"],
  [/^(\d+)\/(\d+) (.+) kelimesi öğrenildi$/, "$1/$2 $3 words learned"],
  [/^%70'e ulaşınca (.+) açılır 🚀$/, "Reach 70% to unlock $1 🚀"]
];
const UI_INLINE = [
  [/ · Kelime %/g, " · Vocabulary "],
  [/ · Grammar %/g, " · Grammar "],
  [/ · Okuma %/g, " · Reading "],
  [/(A1|A2|B1|B2|C1) kelimesi öğrenildi/g, "$1 words learned"],
  [/\(seviyen\)/g, "(your level)"],
  [/ soru tamamlandı/g, " questions completed"],
  [/ kelimesi öğrenildi/g, " words learned"]
];
function escapeHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(v){ return escapeHtml(v); }
function uiLabel(v){
  return (LANG === 'en' && UI_MAP[v]) ? UI_MAP[v] : v;
}
function expText(q){
  return (LANG==='en' && q.expEn) ? q.expEn : q.exp;
}
function t(key){
  const e = UI_STRINGS[key];
  if(!e) return key;
  return LANG==='en' ? e[0] : e[1];
}
function trUI(text){
  if(LANG!=='en') return text;
  const trimmed = text.trim();
  if(!trimmed) return text;
  if(UI_MAP[trimmed]) return text.replace(trimmed, UI_MAP[trimmed]);
  for(const [re, rep] of UI_PATTERNS){
    if(re.test(trimmed)) return text.replace(trimmed, trimmed.replace(re, rep));
  }
  return text;
}
function localizeDOM(root){
  if(LANG!=='en' || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const before = n.nodeValue;
    let after = trUI(before);
    UI_INLINE.forEach(([re,rep])=>{ after = after.replace(re, rep); });
    if(after !== before) n.nodeValue = after;
  });
  root.querySelectorAll('[placeholder]').forEach(el=>{
    const v = UI_MAP[el.getAttribute('placeholder').trim()];
    if(v) el.setAttribute('placeholder', v);
  });
}
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
}
function setLang(lang){
  LANG = lang;
  localStorage.setItem('app_lang', lang);
  applyStaticI18n();
  updateHeaderStats();
  render();
}

/* ---------------- TAB NAV (groups + sub-tabs) ---------------- */
const TAB_GROUPS = {
  learn:    { tabs:['today','flash','wod','mystery','dict'] },
  practice: { tabs:['match','listen','cloze','write','sentence','grammar','connect','reading','story'] },
  speak:    { tabs:['chat'] },
  progress: { tabs:['stats','boss','exam','ielts'] }
};
const TAB_LABEL_KEY = {
  today:'tab.today', flash:'tab.flash', wod:'tab.wod', mystery:'tab.mystery', dict:'tab.dict', boss:'tab.boss',
  chat:'tab.chat', match:'tab.match', listen:'tab.listen', cloze:'tab.cloze', write:'tab.write', sentence:'tab.sentence',
  grammar:'tab.grammar', connect:'tab.connect', reading:'tab.reading', story:'tab.story', exam:'tab.exam', ielts:'tab.ielts', stats:'tab.stats'
};
let activeGroup = 'learn';
function groupOf(tab){
  for(const g in TAB_GROUPS){ if(TAB_GROUPS[g].tabs.includes(tab)) return g; }
  return 'learn';
}
function syncTabbar(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.group===activeGroup);
  });
}
function setActiveTab(tab){
  activeTab = tab;
  activeGroup = groupOf(tab);
  syncTabbar();
  trackEvent('/tab/'+activeTab, 'Tab: '+activeTab);
  render();
}
function subTabBarHtml(){
  const tabs = TAB_GROUPS[activeGroup].tabs;
  if(tabs.length < 2) return '';
  return `<div class="subtabs">${tabs.map(tb=>
    `<button class="subtab ${tb===activeTab?'active':''}" data-subtab="${tb}">${t(TAB_LABEL_KEY[tb])}</button>`
  ).join('')}</div>`;
}
function bindSubTabs(){
  document.querySelectorAll('.subtab').forEach(b=>{
    b.addEventListener('click', ()=>setActiveTab(b.dataset.subtab));
  });
}
document.querySelectorAll('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeGroup = btn.dataset.group;
    activeTab = TAB_GROUPS[activeGroup].tabs[0];
    syncTabbar();
    trackEvent('/tab/'+activeTab, 'Tab: '+activeTab);
    render();
  });
});

/* ---------------- RENDER ROUTER ---------------- */
function render(){
  const main = document.getElementById('main');
  renderInner(main);
  const bar = subTabBarHtml();
  if(bar){
    main.insertAdjacentHTML('afterbegin', bar);
    bindSubTabs();
  }
  localizeDOM(main);
  if(dnaState.word) renderWordDNA();
}
function renderInner(main){
  if(activeTab==='today') renderToday(main);
  else if(activeTab==='stats') renderStats(main);
  else if(activeTab==='flash') renderFlash(main);
  else if(activeTab==='grammar') renderGrammar(main);
  else if(activeTab==='write') renderWrite(main);
  else if(activeTab==='wod') renderWod(main);
  else if(activeTab==='sentence') renderSentence(main);
  else if(activeTab==='reading') renderReading(main);
  else if(activeTab==='story') renderStories(main);
  else if(activeTab==='connect') renderConnectives(main);
  else if(activeTab==='mystery') renderMystery(main);
  else if(activeTab==='boss') renderBoss(main);
  else if(activeTab==='ielts') renderIelts(main);
  else if(activeTab==='exam') renderExam(main);
  else if(activeTab==='dict') renderDictionary(main);
  else if(activeTab==='match') renderMatch(main);
  else if(activeTab==='listen') renderListen(main);
  else if(activeTab==='cloze') renderCloze(main);
  else if(activeTab==='chat') renderChat(main);
}

function setAuthBusy(btnId, busyText){
  const btn = document.getElementById(btnId);

}
async function doSignup(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError = '';
  if(!email || !password || password.length < 6){
    authError = 'Geçerli bir e-posta ve en az 6 karakterli bir şifre gir.';
    renderAuth();
    return;
  }
  setAuthBusy('authSubmit', 'Gönderiliyor...');
  try{
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ authError = friendlyAuthError(error); renderAuth(); return; }
    pendingEmail = email;
    authMode = 'verify';
    authError = '';
    renderAuth();
  }catch(e){
    authError = 'Bağlantı hatası, tekrar dene.';
    renderAuth();
  }
}
function friendlyAuthError(error){
  // Never render a raw provider message into the DOM; map to our own safe text.
  const raw = String((error && error.message) || '').toLowerCase();
  const en = LANG === 'en';
  if(raw.includes('already registered') || raw.includes('already exists'))
    return en ? 'This email is already registered. Try logging in.' : 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if(raw.includes('invalid login') || raw.includes('invalid credentials'))
    return en ? 'Email or password is incorrect.' : 'E-posta veya şifre hatalı.';
  if(raw.includes('email not confirmed') || raw.includes('not confirmed'))
    return en ? 'Please verify your email first.' : 'Önce e-postanı doğrulaman gerekiyor.';
  if(raw.includes('password') && raw.includes('6'))
    return en ? 'Your password must be at least 6 characters.' : 'Şifren en az 6 karakter olmalı.';
  if(raw.includes('rate limit') || raw.includes('too many'))
    return en ? 'Too many attempts. Please wait a moment and try again.' : 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.';
  return en ? 'Something went wrong. Please try again.' : 'Bir şeyler ters gitti. Lütfen tekrar dene.';
}

/* ---------------- SESSION HARDENING ----------------
   Auto sign-out after prolonged inactivity so a session left open on a
   shared or stolen device does not stay usable indefinitely.            */
const IDLE_LIMIT_MS = 2 * 60 * 60 * 1000; // 2 hours
let _idleTimer = null;
function resetIdleTimer(){
  if(!currentUser) return;
  if(_idleTimer) clearTimeout(_idleTimer);
  _idleTimer = setTimeout(async ()=>{
    if(!currentUser) return;
    try{ await supabaseClient.auth.signOut(); }catch(e){}
    currentUser = null;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    authMode = 'login';
    authError = (LANG === 'en')
      ? 'You were signed out after a period of inactivity.'
      : 'Uzun süre işlem yapılmadığı için oturumun kapatıldı.';
    renderAuth();
  }, IDLE_LIMIT_MS);
}
['click','keydown','touchstart','visibilitychange'].forEach(evt=>{
  window.addEventListener(evt, resetIdleTimer, { passive: true });
});

async function doGoogleLogin(){

async function doLogin(){

  const password = document.getElementById('authPassword').value;

  try{

async function doVerify(){

    }

/* ---------------- WRITING PRACTICE ---------------- */
function pickPool(n){
  const curCode = LEVELS[progress.level].code;
  const tierNotKnown = VOCAB.filter(w=>w.level===curCode && progress.flashcards[w.id]!=='known');
  if(tierNotKnown.length>=n) return [...tierNotKnown].sort(()=>Math.random()-0.5).slice(0,n);
  const otherNotKnown = unlockedVocab().filter(w=>w.level!==curCode && progress.flashcards[w.id]!=='known');
  const combined = [...tierNotKnown, ...[...otherNotKnown].sort(()=>Math.random()-0.5)];
  if(combined.length>=n) return combined.slice(0,n);
  const pool = unlockedVocab();
  const source = combined.length ? combined : pool;
  return [...source].sort(()=>Math.random()-0.5).slice(0, Math.min(n, pool.length));
}
function buildWriting(){
  const words = pickPool(8);
  const items = words.map(w=>({w, direction: Math.random()<0.5 ? 'en-tr' : 'tr-en'}));
  writeState = {items, idx:0, correctCount:0, finished:false, answered:false};
}

    </div>

  `;
  if(!writeState) renderWriteStart();
  else if(writeState.finished) renderWriteResult();
  else renderWriteQ();
}

      const diffDays = Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(lastDate.getFullYear(),lastDate.getMonth(),lastDate.getDate()))/(1000*60*60*24));

/* ---------------- ADAPTIVE MIXED EXAM ---------------- */
function wordWeight(w){
  const st = progress.wordStats[w.id];
  const total = st ? st.right+st.wrong : 0;
  const base = total===0 ? 3 : 1 + (st.wrong/total)*4;
  const tierGap = progress.level - levelIdx(w.level); // 0 = mevcut seviyen, >0 = daha kolay/geçmiş seviye
  if(tierGap <= 0) return base; // mevcut seviyen: tam ağırlık
  const known = progress.flashcards[w.id]==='known';
  if(known) return base * 0.12; // biliyorum dediğin eski kelime: neredeyse hiç çıkmasın
  return base * 0.4; // henüz 'biliyorum' denmemiş eski kelime: az da olsa tekrar için kalsın
}
function weightedSample(arr, weightFn, n){
  const pool = [...arr];
  const picked = [];
  for(let i=0;i<n && pool.length;i++){
    const weights = pool.map(weightFn);
    const total = weights.reduce((a,b)=>a+b,0) || 1;
    let r = Math.random()*total;
    let idx = 0;
    for(;idx<weights.length;idx++){ r -= weights[idx]; if(r<=0) break; }
    idx = Math.min(idx, pool.length-1);
    picked.push(pool[idx]);
    pool.splice(idx,1);
  }
  return picked;
}
function buildAdaptiveExam(){
  const vocabPool = unlockedVocab();
  const vocabPicks = weightedSample(vocabPool, wordWeight, Math.min(6, vocabPool.length));
  const vocabQs = vocabPicks.map(w=>{
    const direction = Math.random()<0.5 ? 'en-tr' : 'tr-en';
    const correct = direction==='en-tr' ? w.tr : w.en;
    const distractors = vocabPool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=> direction==='en-tr'?x.tr:x.en);
    const options = [...distractors, correct].sort(()=>Math.random()-0.5);
    return {type:'vocab', prompt: direction==='en-tr'?w.en:w.tr, options, answer:correct, wordId:w.id};
  });
  const grammarFlat = [];
  GRAMMAR.filter(t=>levelIdx(t.level)<=progress.level).forEach((topic,tIdx)=>{
    topic.qs.forEach((q,qIdx)=>{
      const key = tIdx+'-'+qIdx;
      grammarFlat.push({q, key, weight: progress.grammarDone[key] ? 0.6 : 2.2});
    });
  });
  const grammarPicks = weightedSample(grammarFlat, g=>g.weight, Math.min(4, grammarFlat.length));
  const grammarQs = grammarPicks.map(g=>({type:'grammar', prompt:g.q.q, options:g.q.opts, answer:g.q.a, key:g.key, exp:g.q.exp, expEn:g.q.expEn}));
  const curCode = LEVELS[progress.level].code;
  const readingPool = READINGS.filter(r=>r.tfEn && r.tfEn.length && r.level===curCode);
  const fallbackPool = READINGS.filter(r=>r.tfEn && r.tfEn.length && levelIdx(r.level)<=progress.level);
  const rPool = readingPool.length ? readingPool : fallbackPool;
  const reading = rPool.length ? rPool[Math.floor(Math.random()*rPool.length)] : null;
  const readingQs = reading ? [...reading.tfEn].sort(()=>Math.random()-0.5).slice(0,3).map(s=>(
    {type:'reading', prompt:s.q, options:['True','False'], answer: s.a ? 'True' : 'False', passage:reading.text, passageTitle:reading.title}
  )) : [];
  const all = [...vocabQs, ...grammarQs, ...readingQs].sort(()=>Math.random()-0.5);
  examState = {questions:all, idx:0, correctCount:0, byType:{vocab:{c:0,t:0}, grammar:{c:0,t:0}, reading:{c:0,t:0}}, finished:false, answered:false};
}
function renderExam(main){
  const history = progress.examHistory||[];
  const last = history[history.length-1];
  const best = history.length ? Math.max(...history.map(h=>Math.round(100*h.correct/h.total))) : null;
  main.innerHTML = `
    <h2 class="section-title">Karma Sınav</h2>
    <p class="section-sub">Kelime, grammar ve bir İngilizce okuma parçasını karıştırır; en çok zorlandığın kelime ve konulara daha sık yer verir. Her sınav farklı olur.</p>
    <div class="quiz-score-row">
      <div class="stat-box"><strong>${history.length}</strong><span>Toplam Sınav</span></div>
      <div class="stat-box"><strong>${last ? Math.round(100*last.correct/last.total)+'%' : '–'}</strong><span>Son Skor</span></div>
      <div class="stat-box"><strong>${best!==null ? best+'%' : '–'}</strong><span>En İyi</span></div>
    </div>
    <div id="examArea"></div>
  `;
  const area = document.getElementById('examArea');
  if(!examState){
    area.innerHTML = `<button class="btn-full" id="startExam">12 Soruluk Karma Sınav Başlat</button>`;
    document.getElementById('startExam').addEventListener('click', ()=>{ buildAdaptiveExam(); render(); });
  } else if(examState.finished){
    renderExamResult(area);
  } else {
    renderExamQ(area);
  }
}

      if(q.type==='vocab'){

function finishExam(){

function renderExamResult(area){

/* ---------------- STORIES ----------------
   Chapters unlock in order: the questions assume you followed the last one,
   so letting someone jump to chapter 3 would only teach them that the app's
   questions can be guessed.                                              */
let storyState = { id:null, chapter:0, showTr:false };

function storyProgressKey(sid, ci){ return 's:' + sid + ':' + ci; }
function chapterDone(sid, ci, story){
  const qs = storyQuestions(story.chapters[ci]);
  return qs.every((q,qi)=>progress.readingDone[storyProgressKey(sid,ci)+':'+qi]);
}
function storyQuestions(ch){ return (LANG==='en' && ch.qsEn && ch.qsEn.length) ? ch.qsEn : ch.qs; }

function renderStories(main){
  if(!storyState.id){ renderStoryList(main); return; }
  renderStoryChapter(main);
}

function renderStoryList(main){
  main.innerHTML = `
    <h2 class="section-title">${LANG==='en' ? 'Stories' : 'Hikâyeler'}</h2>
    <p class="section-sub">${LANG==='en'
      ? 'Longer than the reading passages, and continuous — each chapter carries on from the last. Chapters unlock as you finish them.'
      : 'Okuma parçalarından daha uzun ve birbirinin devamı — her bölüm öncekinden devam ediyor. Bölümler bitirdikçe açılıyor.'}</p>
    <div class="story-list">
      ${STORIES.map(st=>{
        const done = st.chapters.filter((c,i)=>chapterDone(st.id,i,st)).length;
        return `<button class="story-card" data-story="${st.id}">
          <span class="story-emoji">${st.emoji}</span>
          <span class="story-body">
            <span class="story-title">${escapeHtml(st.title)}</span>
            <span class="story-blurb">${escapeHtml(LANG==='en' ? st.blurb : st.blurbTr)}</span>
            <span class="story-meta">${st.level} · ${done}/${st.chapters.length} ${LANG==='en'?'chapters':'bölüm'}</span>
            <span class="story-track"><span class="story-fill" style="width:${Math.round(100*done/st.chapters.length)}%"></span></span>
          </span>
        </button>`;
      }).join('')}
    </div>`;
  main.querySelectorAll('.story-card').forEach(b=>{
    b.addEventListener('click', ()=>{
      const st = STORIES.find(x=>x.id===b.dataset.story);
      const firstUnread = st.chapters.findIndex((c,i)=>!chapterDone(st.id,i,st));
      storyState = { id:st.id, chapter: firstUnread === -1 ? 0 : firstUnread, showTr:false };
      render();
    });
  });
}

function renderStoryChapter(main){
  const story = STORIES.find(x=>x.id===storyState.id);
  const ci = storyState.chapter;
  const ch = story.chapters[ci];
  const qs = storyQuestions(ch);
  const base = storyProgressKey(story.id, ci);
  const answered = qs.filter((q,qi)=>progress.readingDone[base+':'+qi]).length;
  const allDone = answered === qs.length;
  const hasNext = ci + 1 < story.chapters.length;

  main.innerHTML = `
    <button class="conn-back" id="storyBack">← ${escapeHtml(story.title)}</button>
    <div class="story-chapter-nav">
      ${story.chapters.map((c,i)=>{
        const done = chapterDone(story.id, i, story);
        const locked = i > 0 && !chapterDone(story.id, i-1, story);
        return `<button class="story-dot ${i===ci?'active':''} ${done?'done':''} ${locked?'locked':''}"
                 data-ch="${i}" ${locked?'disabled':''}>${done ? '✓' : i+1}</button>`;
      }).join('')}
    </div>
    <div class="reading-card story-text-card">
      <div class="reading-title">${escapeHtml(ch.title)}</div>
      <div class="story-text">${ch.text.split('\n\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>
      ${storyState.showTr ? `<div class="story-text story-tr">${ch.textTr.split('\n\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>` : ''}
      <button class="reveal-btn" id="storyTrBtn">${storyState.showTr
        ? (LANG==='en'?'Hide Turkish':'Türkçeyi gizle')
        : (LANG==='en'?'Show Turkish':'Türkçesini göster')}</button>
    </div>

    ${ch.words && ch.words.length ? `
      <div class="chat-target-label">${LANG==='en' ? 'Words from this chapter' : 'Bu bölümün kelimeleri'}</div>
      <div class="chat-target-words">
        ${ch.words.map(w=>`<span class="chat-word-chip story-word" data-w="${escapeAttr(w)}">${escapeHtml(w)}</span>`).join('')}
      </div>` : ''}

    <div class="deck-status">${answered}/${qs.length} ${LANG==='en'?'questions answered':'soru cevaplandı'}</div>
    <div id="storyQs"></div>
    <div id="storyDone"></div>
  `;

  document.getElementById('storyBack').addEventListener('click', ()=>{ storyState.id = null; render(); });
  document.getElementById('storyTrBtn').addEventListener('click', ()=>{ storyState.showTr = !storyState.showTr; render(); });
  main.querySelectorAll('.story-dot:not(.locked)').forEach(b=>{
    b.addEventListener('click', ()=>{ storyState.chapter = +b.dataset.ch; storyState.showTr = false; render(); });
  });
  main.querySelectorAll('.story-word').forEach(b=>{
    b.addEventListener('click', ()=>{
      const found = VOCAB.find(v=>v.en.toLowerCase() === b.dataset.w.toLowerCase());
      if(found) openWordDNA(found); else speak(b.dataset.w);
    });
  });

  const qArea = document.getElementById('storyQs');
  qs.forEach((q, qi)=>{
    const key = base + ':' + qi;
    const done = !!progress.readingDone[key];
    const block = document.createElement('div');
    block.className = 'q-block';
    block.innerHTML = `
      <div class="q-text">${qi+1}. ${escapeHtml(q.q)}</div>
      <div class="q-options">
        ${q.opts.map(o=>`<div class="q-option ${done && o===q.a ? 'correct':''}" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}
      </div>`;
    qArea.appendChild(block);
    block.querySelectorAll('.q-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(progress.readingDone[key]) return;
        block.querySelectorAll('.q-option').forEach(o=>{
          o.classList.remove('correct','incorrect');
          if(o.dataset.opt===q.a) o.classList.add('correct');
        });
        const ok = opt.dataset.opt === q.a;
        if(!ok){ opt.classList.add('incorrect'); addXp(3); }
        else { addXp(14); burstConfetti(opt.getBoundingClientRect().left+20, opt.getBoundingClientRect().top, 8); }
        progress.readingDone[key] = true;
        recordSkill('listening', ok);
        saveProgress();
        updateHeaderStats();
        checkBadges();
        render();
      });
    });
  });

  if(allDone){
    const box = document.getElementById('storyDone');
    box.innerHTML = `
      <div class="reading-done">
        <div class="reading-done-emoji">${hasNext ? '📖' : '🎉'}</div>
        <div class="reading-done-title">${LANG==='en' ? 'Chapter complete' : 'Bölüm tamamlandı'}</div>
        <p class="section-sub">${hasNext
          ? (LANG==='en' ? 'The story continues.' : 'Hikâye devam ediyor.')
          : (LANG==='en' ? 'That is the end — for now.' : 'Şimdilik burada bitiyor.')}</p>
        ${hasNext ? `<button class="btn-full" id="storyNext">${LANG==='en' ? 'Next chapter' : 'Sonraki bölüm'} →</button>` : ''}
      </div>`;
    const nb = document.getElementById('storyNext');
    if(nb) nb.addEventListener('click', ()=>{ storyState.chapter = ci + 1; storyState.showTr = false; render(); });
  }
}


/* ---------------- EXAM SESSION PERSISTENCE ----------------
   The exam lives in memory, so a refresh — or a phone killing the tab —
   used to wipe it and hand back a fresh 30 minutes. That is both frustrating
   and a way to cheat the clock, so the session is written to the device and
   restored with the time that actually remains.                          */
const IELTS_SESSION_KEY = 'oratino_ielts_session';

function saveIeltsSession(){
  if(!ieltsState) return;
  try{
    localStorage.setItem(IELTS_SESSION_KEY, JSON.stringify({
      testId: ieltsState.test.id,
      section: ieltsState.section,
      answers: ieltsState.answers,
      writing: ieltsState.writing,
      checklist: ieltsState.checklist,
      playCount: ieltsState.playCount,
      startedAt: ieltsState.startedAt,
      endsAt: ieltsState.endsAt,
      warned: !!ieltsState.warned,
      finished: !!ieltsState.finished,
      result: ieltsState.result || null
    }));
  }catch(e){}
}
function clearIeltsSession(){
  try{ localStorage.removeItem(IELTS_SESSION_KEY); }catch(e){}
}
function restoreIeltsSession(){
  let raw = null;
  try{ raw = localStorage.getItem(IELTS_SESSION_KEY); }catch(e){ return false; }
  if(!raw) return false;
  let d;
  try{ d = JSON.parse(raw); }catch(e){ clearIeltsSession(); return false; }
  const test = IELTS_TESTS.find(t=>t.id === d.testId);
  if(!test || typeof d.endsAt !== 'number'){ clearIeltsSession(); return false; }

  ieltsState = {
    test,
    section: d.finished ? 'result' : (['listening','reading','writing','intro'].includes(d.section) ? d.section : 'listening'),
    questions: {
      listening: test.listening.questions.map((q,i)=>({ ...q, section:'listening', n:i+1 })),
      reading:   test.reading.questions.map((q,i)=>({ ...q, section:'reading', n:i+1 }))
    },
    answers: (d.answers && typeof d.answers === 'object') ? d.answers : {},
    writing: typeof d.writing === 'string' ? d.writing : '',
    checklist: (d.checklist && typeof d.checklist === 'object') ? d.checklist : {},
    playCount: Math.min(2, Math.max(0, parseInt(d.playCount) || 0)),
    startedAt: d.startedAt || Date.now(),
    endsAt: d.endsAt,
    warned: !!d.warned,
    finished: !!d.finished,
    result: d.result || null,
    resumed: true
  };
  if(ieltsState.finished) return true;
  // the clock kept running while the page was closed
  if(Date.now() >= ieltsState.endsAt){ finishIelts(true); return true; }
  startIeltsClock();
  return true;
}

/* ---------------- IELTS-STYLE MOCK EXAM ----------------
   Three sections in the real order, a running clock, and no feedback until
   the end — because knowing whether you were right changes how you answer
   the next question, which is exactly what the real exam denies you.     */
let ieltsState = null;
const IELTS_MINUTES = 30;

function ieltsBand(raw){
  const row = IELTS_BANDS.find(r => raw >= r.min);
  return row ? row.band : '4.0 -';
}
function startIelts(testId){
  const test = IELTS_TESTS.find(t=>t.id===testId) || IELTS_TESTS[0];
  const listening = test.listening.questions.map((q,i)=>({ ...q, section:'listening', n:i+1 }));
  const reading   = test.reading.questions.map((q,i)=>({ ...q, section:'reading', n:i+1 }));
  ieltsState = {
    test,
    section: 'listening',
    questions: { listening, reading },
    answers: {},
    writing: '',
    checklist: {},
    playCount: 0,
    startedAt: Date.now(),
    endsAt: Date.now() + IELTS_MINUTES*60*1000,
    finished: false,
    result: null
  };
  trackEvent('/ielts/start', 'IELTS mock started');
  saveIeltsSession();
  startIeltsClock();
  render();
}
let _ieltsTimer = null;
function startIeltsClock(){
  if(_ieltsTimer) clearInterval(_ieltsTimer);
  _ieltsTimer = setInterval(()=>{
    if(!ieltsState || ieltsState.finished){ clearInterval(_ieltsTimer); _ieltsTimer = null; return; }
    if(Date.now() >= ieltsState.endsAt){ finishIelts(true); return; }
    const el = document.getElementById('ieltsClock');
    if(el) el.textContent = ieltsClockText();
    const ratio = ieltsTimeLeftRatio();
    const fill = document.getElementById('ieltsTimeFill');
    if(fill) fill.style.width = Math.round(ratio*100) + '%';
    if(ratio < 1/6){
      const bar = document.querySelector('.ielts-bar');
      if(bar && !bar.classList.contains('low')){
        bar.classList.add('low');
        if(el) el.classList.add('low');
        if(fill) fill.classList.add('low');
      }
    }
  }, 1000);
}
function ieltsClockText(){
  const left = Math.max(0, ieltsState.endsAt - Date.now());
  const m = Math.floor(left/60000), sec = Math.floor((left%60000)/1000);
  return m + ':' + String(sec).padStart(2,'0');
}
function ieltsAnswerKey(section, n){ return section + '-' + n; }

function finishIelts(ranOut){
  const st = ieltsState;
  if(!st || st.finished) return;
  if(_ieltsTimer){ clearInterval(_ieltsTimer); _ieltsTimer = null; }
  let lCorrect = 0, rCorrect = 0;
  st.questions.listening.forEach(q=>{
    if(st.answers[ieltsAnswerKey('listening', q.n)] === q.a) lCorrect++;
  });
  st.questions.reading.forEach(q=>{
    if(st.answers[ieltsAnswerKey('reading', q.n)] === q.a) rCorrect++;
  });
  const raw = lCorrect + rCorrect;
  const words = st.writing.trim() ? st.writing.trim().split(/\s+/).length : 0;
  const checked = Object.values(st.checklist).filter(Boolean).length;
  st.result = {
    listening: { correct:lCorrect, total:st.questions.listening.length },
    reading:   { correct:rCorrect, total:st.questions.reading.length },
    raw, band: ieltsBand(raw),
    words, checked, checklistTotal: st.test.writing.checklist.length,
    ranOut: !!ranOut,
    minutesUsed: Math.round((Date.now() - st.startedAt)/60000)
  };
  st.finished = true;
  st.section = 'result';
  st.resumed = false;
  recordSkill('listening', lCorrect >= st.questions.listening.length/2);
  addXp(40 + raw * 5);
  progress.examHistory = progress.examHistory || [];
  progress.examHistory.push({ date: todayStr(), correct: raw, total: 25, level: 'IELTS' });
  if(progress.examHistory.length>20) progress.examHistory = progress.examHistory.slice(-20);
  saveProgress();
  checkBadges();
  trackEvent('/ielts/finish', 'IELTS mock finished');
  saveIeltsSession();
  render();
}


/* Turns a raw score into something a learner can act on: what the band means
   in practice, which section let them down, and where in the app to go next. */
function ieltsBandMeaning(band){
  const b = parseFloat(band);
  if(b >= 8) return { en:'Very good user. You handle complex language reliably and misunderstandings are rare.',
                      tr:'Çok iyi kullanıcı. Karmaşık dili güvenle idare ediyorsun, yanlış anlamalar nadir.' };
  if(b >= 7) return { en:'Good user. You cope well with detailed argument, though some subtleties still slip past.',
                      tr:'İyi kullanıcı. Detaylı argümanları iyi takip ediyorsun, ama bazı incelikler hâlâ kaçıyor.' };
  if(b >= 6) return { en:'Competent user. You get the main ideas and most detail; accuracy drops under time pressure.',
                      tr:'Yeterli kullanıcı. Ana fikirleri ve detayın çoğunu alıyorsun; zaman baskısı altında isabet düşüyor.' };
  if(b >= 5) return { en:'Modest user. You follow familiar topics, but dense or abstract text costs you marks.',
                      tr:'Orta düzey kullanıcı. Tanıdık konuları takip ediyorsun ama yoğun veya soyut metin puan kaybettiriyor.' };
  return { en:'Limited user. Focus on building the vocabulary base before drilling exam technique.',
           tr:'Sınırlı kullanıcı. Sınav tekniğine yüklenmeden önce kelime temelini kurmaya odaklan.' };
}

/** Where the marks were actually lost, by question type. */
function ieltsTypeBreakdown(st){
  const rows = {};
  const add = (label, ok)=>{
    rows[label] = rows[label] || { correct:0, total:0 };
    rows[label].total++;
    if(ok) rows[label].correct++;
  };
  st.questions.listening.forEach(q=>{
    add(LANG==='en' ? 'Listening detail' : 'Dinlemede detay',
        st.answers[ieltsAnswerKey('listening', q.n)] === q.a);
  });
  st.questions.reading.forEach(q=>{
    const label = q.type === 'tfng' ? 'True / False / Not Given'
                : q.type === 'headings' ? (LANG==='en' ? 'Matching headings' : 'Başlık eşleştirme')
                : (LANG==='en' ? 'Sentence completion' : 'Cümle tamamlama');
    add(label, st.answers[ieltsAnswerKey('reading', q.n)] === q.a);
  });
  return Object.entries(rows).map(([label, v])=>({
    label, ...v, pct: Math.round(100 * v.correct / v.total)
  })).sort((a,b)=>a.pct - b.pct);
}

/** Concrete next steps, chosen from what actually went wrong. */
function ieltsAdvice(st, res){
  const tips = [];
  const byType = ieltsTypeBreakdown(st);
  const worst = byType[0];
  const blanks = [...st.questions.listening.map(q=>({q,section:'listening'})),
                  ...st.questions.reading.map(q=>({q,section:'reading'}))]
    .filter(({q,section})=>!st.answers[ieltsAnswerKey(section,q.n)]).length;

  if(res.ranOut || blanks > 2){
    tips.push({ en:'Time management cost you more than knowledge did. Answer every question, even as a guess — there is no penalty for a wrong answer.',
                tr:'Zaman yönetimi sana bilgiden daha pahalıya mal oldu. Her soruyu cevapla, tahmin olsa bile — yanlış cevabın cezası yok.' });
  }
  if(worst && worst.pct < 60){
    if(worst.label.includes('Not Given')){
      tips.push({ en:'NOT GIVEN is the trap: ask whether the text contradicts the statement (FALSE) or simply never addresses it (NOT GIVEN). Never use outside knowledge.',
                  tr:'NOT GIVEN tuzağı: metin ifadeyle çelişiyor mu (FALSE), yoksa konuya hiç değinmiyor mu (NOT GIVEN)? Dışarıdan bildiğini asla katma.' });
    } else if(/heading|Başlık/.test(worst.label)){
      tips.push({ en:'For headings, read only the first and last sentence of each paragraph first. The heading matches the paragraph\'s whole movement, not one striking detail inside it.',
                  tr:'Başlık sorularında önce her paragrafın sadece ilk ve son cümlesini oku. Başlık, içindeki çarpıcı bir detayla değil, paragrafın bütün hareketiyle eşleşir.' });
    } else if(/completion|tamamlama/.test(worst.label)){
      tips.push({ en:'Completion answers are the text\'s own words, not synonyms. Find the sentence in the passage and copy from it.',
                  tr:'Tamamlama cevapları metnin kendi kelimeleridir, eş anlamlı değil. Cümleyi parçada bul ve oradan al.' });
    } else {
      tips.push({ en:'You lost most marks on listening detail. Numbers, times and prices are where answers hide — write them down as you hear them.',
                  tr:'En çok puanı dinlemede detayda kaybettin. Cevaplar sayılarda, saatlerde ve fiyatlarda saklanır — duyar duymaz not al.' });
    }
  }
  if(res.words < st.test.writing.minWords){
    tips.push({ en:`Your essay was under ${st.test.writing.minWords} words. In the real exam that is an automatic penalty before anyone reads the content.`,
                tr:`Kompozisyonun ${st.test.writing.minWords} kelimenin altında. Gerçek sınavda bu, içeriği kimse okumadan önce otomatik puan kaybıdır.` });
  }
  if(res.reading.correct / res.reading.total < res.listening.correct / res.listening.total - 0.15){
    tips.push({ en:'Reading is behind your listening. Long passages are a stamina problem as much as a language one — the Stories tab is built for exactly that.',
                tr:'Okuman dinlemenin gerisinde. Uzun metinler dil kadar dayanıklılık meselesidir — Hikâye sekmesi tam bunun için var.' });
  }
  if(!tips.length){
    tips.push({ en:'No single weak area stands out. Keep the daily mission going and retake this in a week to see whether the score holds.',
                tr:'Tek bir zayıf alan öne çıkmıyor. Günlük göreve devam et ve bir hafta sonra tekrar gir, puanın tutuyor mu gör.' });
  }
  return tips.slice(0, 3);
}

function renderIelts(main){
  if(!ieltsState && restoreIeltsSession()){ /* picked up where it was left */ }
  if(!ieltsState){ renderIeltsIntro(main); return; }
  if(ieltsState.section === 'result'){ renderIeltsResult(main); return; }
  if(ieltsState.section === 'listening'){ renderIeltsListening(main); return; }
  if(ieltsState.section === 'reading'){ renderIeltsReading(main); return; }
  if(ieltsState.section === 'writing'){ renderIeltsWriting(main); return; }
  // an unknown section would strand the candidate on the start screen with the
  // clock running, so send them to the first section instead
  ieltsState.section = 'listening';
  renderIeltsListening(main);
}

function renderIeltsIntro(main){

  const best = past.length ? Math.max(...past.map(h=>h.correct)) : null;

      : 'Sınav sırasına göre üç bölüm, hepsinin üzerinde tek bir saat ve bitirmeden hiç geri bildirim yok. Soru tipleri gerçek sınavın kullandığı tipler.'}</p>

    <div class="ielts-plan">
      <div class="ielts-plan-row"><span class="ielts-sec-badge">1</span>
        <div><strong>${LANG==='en'?'Listening':'Dinleme'}</strong>
        <span>${LANG==='en'?'10 questions · audio plays twice':'10 soru · ses iki kez çalınır'}</span></div></div>
      <div class="ielts-plan-row"><span class="ielts-sec-badge">2</span>
        <div><strong>${LANG==='en'?'Reading':'Okuma'}</strong>
        <span>${LANG==='en'?'15 questions · headings, True/False/Not Given, completion':'15 soru · başlık eşleştirme, True/False/Not Given, tamamlama'}</span></div></div>
      <div class="ielts-plan-row"><span class="ielts-sec-badge">3</span>
        <div><strong>${LANG==='en'?'Writing':'Yazma'}</strong>
        <span>${LANG==='en'?'1 essay · at least 150 words':'1 kompozisyon · en az 150 kelime'}</span></div></div>
    </div>

    <div class="ielts-warn">⏱ ${IELTS_MINUTES} ${LANG==='en'
      ? 'minutes for everything. The clock does not stop between sections.'
      : 'dakika, tamamı için. Saat bölümler arasında durmaz.'}</div>

    ${best !== null ? `<div class="quiz-score-row">
      <div class="stat-box"><strong>${past.length}</strong><span>${LANG==='en'?'Attempts':'Deneme'}</span></div>
      <div class="stat-box"><strong>${best}/25</strong><span>${LANG==='en'?'Best raw':'En iyi ham'}</span></div>
      <div class="stat-box"><strong>${ieltsBand(best)}</strong><span>${LANG==='en'?'Best band':'En iyi band'}</span></div>
    </div>` : ''}

    <button class="btn-full" id="ieltsStart">${LANG==='en' ? 'Begin the test' : 'Denemeye başla'}</button>
    <p class="attribution">${LANG==='en'
      ? 'Not affiliated with or endorsed by IELTS. Band figures are indicative only.'
      : 'IELTS ile bağlantılı veya onaylı değildir. Band değerleri yalnızca fikir vermek içindir.'}</p>
  `;
  document.getElementById('ieltsStart').addEventListener('click', ()=>startIelts('mock1'));
}

function ieltsTimeLeftRatio(){
  const total = IELTS_MINUTES * 60 * 1000;
  return Math.max(0, Math.min(1, (ieltsState.endsAt - Date.now()) / total));
}
function ieltsResumeNote(){
  if(!ieltsState || !ieltsState.resumed) return '';
  ieltsState.resumed = false;
  return `<p class="write-feedback ok show">${LANG==='en'
    ? 'Picked up where you left off — your answers and the clock were saved.'
    : 'Kaldığın yerden devam ediyorsun — cevapların ve süren kaydedilmişti.'}</p>`;
}
function ieltsHeader(label, answered, total){
  const ratio = ieltsTimeLeftRatio();
  const low = ratio < 1/6;   // under five minutes
  return `
    <div class="ielts-bar ${low ? 'low' : ''}">
      <span class="ielts-sec-name">${escapeHtml(label)}</span>
      <span class="ielts-clock ${low ? 'low' : ''}" id="ieltsClock">${ieltsClockText()}</span>
      <span class="ielts-count">${answered}/${total}</span>
    </div>
    <div class="ielts-timebar"><span class="ielts-timefill ${low ? 'low' : ''}" id="ieltsTimeFill" style="width:${Math.round(ratio*100)}%"></span></div>`;
}
/** Numbered strip so you can see, at a glance, which questions are still blank. */
function ieltsNav(list, section){
  const st = ieltsState;
  return `<div class="ielts-nav">
    ${list.map(q=>{
      const done = !!st.answers[ieltsAnswerKey(section, q.n)];
      return `<button class="ielts-nav-dot ${done?'done':''}" data-goto="${section}-${q.n}">${q.n}</button>`;
    }).join('')}
  </div>`;
}
function bindIeltsNav(main){
  main.querySelectorAll('.ielts-nav-dot').forEach(b=>{
    b.addEventListener('click', ()=>{
      const el = document.getElementById('q-' + b.dataset.goto);
      if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' });
    });
  });
}

function renderIeltsQuestions(container, list, section){
  const st = ieltsState;
  list.forEach(q=>{
    const key = ieltsAnswerKey(section, q.n);
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = 'q-' + section + '-' + q.n;
    const typeLabel = q.type === 'tfng' ? 'True / False / Not Given'
                    : q.type === 'headings' ? (LANG==='en'?'Matching headings':'Başlık eşleştirme')
                    : q.type === 'completion' ? (LANG==='en'?'Sentence completion':'Cümle tamamlama')
                    : (LANG==='en'?'Multiple choice':'Çoktan seçmeli');
    const opts = q.type === 'tfng' ? ['TRUE','FALSE','NOT GIVEN'] : q.opts;
    block.innerHTML = `
      <div class="ielts-qtype">${escapeHtml(typeLabel)}</div>
      <div class="q-text">${q.n}. ${escapeHtml(q.q)}</div>
      <div class="q-options">
        ${opts.map(o=>`<div class="q-option ${st.answers[key]===o?'chosen':''}" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}
      </div>`;
    container.appendChild(block);
    block.querySelectorAll('.q-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        st.answers[key] = opt.dataset.opt;
        saveIeltsSession();
        block.querySelectorAll('.q-option').forEach(o=>o.classList.remove('chosen'));
        opt.classList.add('chosen');
        const c = document.querySelector('.ielts-count');
        if(c){
          const done = list.filter(x=>st.answers[ieltsAnswerKey(section, x.n)]).length;
          c.textContent = done + '/' + list.length;
        }
        const dot = document.querySelector('.ielts-nav-dot[data-goto="' + section + '-' + q.n + '"]');
        if(dot) dot.classList.add('done');
      });
    });
  });
}

function renderIeltsListening(main){
  const st = ieltsState;
  const list = st.questions.listening;
  const answered = list.filter(q=>st.answers[ieltsAnswerKey('listening', q.n)]).length;
  main.innerHTML = `

/* ---------------- MYSTERY WORD ----------------
   One word a day, five clues, revealed one at a time. Clues are derived from
   data we already hold, so every word in the list can be the answer — no
   hand-written puzzle per word.                                           */
/** Blank a word out of a sentence even when it appears inflected there:
    "apply" has to match "applied", "sleep" has to match "sleeps". */
function blankWordInSentence(word, sentence){
  if(!sentence) return null;
  const base = String(word).trim();
  if(!base) return null;
  const direct = new RegExp('\\b' + escapeRegExp(base) + '\\b', 'i');
  if(direct.test(sentence)) return sentence.replace(direct, '_____');
  // try the usual endings, longest first so "applied" wins over "apply"
  const stem = base.replace(/(e|y)$/i, '');
  const forms = [
    base + 'ied', base + 'ing', base + 'ies', base + 'es', base + 'ed', base + 's',
    stem + 'ied', stem + 'ying', stem + 'ing', stem + 'ies', stem + 'ed', stem + 'es'
  ].sort((a,b)=>b.length - a.length);
  for(const f of forms){
    const re = new RegExp('\\b' + escapeRegExp(f) + '\\b', 'i');
    if(re.test(sentence)) return sentence.replace(re, '_____');
  }
  return null;
}
function mysteryWordForToday(){
  const pool = unlockedVocab().filter(w=>/^[a-zA-Z]{4,}$/.test(w.en));
  if(!pool.length) return null;
  const d = todayStr();
  let seed = 0;
  for(let i=0;i<d.length;i++) seed = (seed * 31 + d.charCodeAt(i)) >>> 0;
  return pool[seed % pool.length];
}
function mysteryClues(w){
  const letters = w.en.length;
  const blanked = blankWordInSentence(w.en, w.ex) || blankWordInSentence(w.en, w.ex2 || '');
  const lastClue = blanked ? `"${blanked}"`
    : (LANG === 'en' ? `It is used like this: "${w.ex}"` : `Şöyle kullanılır: "${w.ex}"`);
  return LANG === 'en' ? [
    `It belongs to the category "${uiLabel(w.cat)}".`,
    `It has ${letters} letters.`,
    `It starts with "${w.en[0].toUpperCase()}".`,
    `In Turkish it means: ${w.tr}`,
    lastClue
  ] : [
    `"${uiLabel(w.cat)}" kategorisinde.`,
    `${letters} harfli.`,
    `"${w.en[0].toUpperCase()}" harfiyle başlıyor.`,
    `Türkçesi: ${w.tr}`,
    lastClue
  ];
}
let mysteryState = null;
function mysteryDoneToday(){
  return progress.mission && progress.mission.mysteryDate === todayStr();
}
function renderMystery(main){
  const w = mysteryWordForToday();
  if(!w){ main.innerHTML = `<p class="section-sub">–</p>`; return; }
  if(!mysteryState || mysteryState.wordId !== w.id){
    mysteryState = { wordId:w.id, revealed:1, guess:'', solved:mysteryDoneToday(), failed:false };
  }
  const clues = mysteryClues(w);
  const st = mysteryState;
  main.innerHTML = `
    <h2 class="section-title">🔍 ${LANG==='en' ? 'Mystery word' : 'Gizemli kelime'}</h2>
    <p class="section-sub">${LANG==='en'

      : 'Günde bir kelime. Açtığın her ipucu ödülü düşürür, o yüzden cesaretin varsa erken tahmin et.'}</p>

    <div class="mystery-clues">
      ${clues.slice(0, st.solved ? clues.length : st.revealed).map((c,i)=>`
        <div class="mystery-clue"><span class="mystery-num">${i+1}</span>${escapeHtml(c)}</div>`).join('')}
    </div>

    ${st.solved ? `
      <div class="quiz-result">
        <div class="big">${escapeHtml(w.en)}</div>
        <p class="section-sub">${escapeHtml(w.tr)}</p>
        <p class="write-feedback ok show">${LANG==='en' ? 'Come back tomorrow for a new one.' : 'Yarın yenisi için tekrar gel.'}</p>
      </div>`
    : `
      ${st.failed ? `<p class="write-feedback no show">${LANG==='en' ? 'Not quite — try again.' : 'Olmadı — tekrar dene.'}</p>` : ''}
      <input class="write-input" id="mysteryInput" type="text" maxlength="40" autocomplete="off"
             placeholder="${LANG==='en' ? 'Your guess...' : 'Tahminin...'}" value="${escapeAttr(st.guess)}">
      <button class="btn-full" id="mysteryGuess">${LANG==='en' ? 'Guess' : 'Tahmin et'}</button>
      ${st.revealed < clues.length
        ? `<span class="pt-skip" id="mysteryMore">${LANG==='en'
            ? `Show clue ${st.revealed+1} of ${clues.length}`
            : `${st.revealed+1}. ipucunu göster (${clues.length} taneden)`}</span>`
        : `<span class="pt-skip" id="mysteryGiveUp">${LANG==='en' ? 'Reveal the answer' : 'Cevabı göster'}</span>`}
    `}
  `;
  if(st.solved) return;
  const input = document.getElementById('mysteryInput');
  const submit = ()=>{
    const val = normalize(input.value);

    if(val === normalize(w.en)){
      st.solved = true;

  document.getElementById('mysteryGuess').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  const more = document.getElementById('mysteryMore');
  if(more) more.addEventListener('click', ()=>{ st.revealed++; st.failed=false; render(); });
  const give = document.getElementById('mysteryGiveUp');
  if(give) give.addEventListener('click', ()=>{
    st.solved = true;
    missionState().mysteryDate = todayStr();
    saveProgress();
    render();
