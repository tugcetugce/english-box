/* ---------------- BOSS FIGHT ----------------
   A mixed 20-question gate at the end of each level: vocabulary, listening,
   translation, sentence completion and grammar in one run. Passing it is what
   marks a level as genuinely finished.                                     */
let bossState = null;
function bossLevelCode(){ return LEVELS[progress.level].code; }
function bossUnlocked(){
  const tier = currentTierWords();
  if(!tier.length) return false;
  const known = tier.filter(w=>progress.flashcards[w.id]==='known').length;
  return known / tier.length >= 0.5;
}
function bossBeaten(code){ return !!(progress.badges && progress.badges['boss_' + code]); }

function buildBoss(){
  const code = bossLevelCode();
  const pool = VOCAB.filter(w=>w.level === code);
  const wordPool = pool.length >= 12 ? pool : unlockedVocab();
  const pick = (n)=> [...wordPool].sort(()=>Math.random()-0.5).slice(0, n);
  const qs = [];

  // translation, both directions
  pick(6).forEach((w,i)=>{
    const toTr = i % 2 === 0;
    const correct = toTr ? w.tr : w.en;
    const opts = [...wordPool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3)
      .map(x=>toTr?x.tr:x.en), correct].sort(()=>Math.random()-0.5);
    qs.push({ kind:'vocab', wordId:w.id,
      label: toTr ? 'EN → TR' : 'TR → EN',
      prompt: toTr ? w.en : w.tr, options:opts, answer:correct });
  });
  // listening
  pick(4).forEach(w=>{
    const opts = [...wordPool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3)
      .map(x=>x.tr), w.tr].sort(()=>Math.random()-0.5);
    qs.push({ kind:'listen', wordId:w.id, say:w.en,
      label: LANG==='en'?'Listening':'Dinleme',
      prompt:'🔊', options:opts, answer:w.tr });
  });
  // sentence completion from real examples
  wordPool.filter(w=>findClozeSentence(w)).sort(()=>Math.random()-0.5).slice(0,5).forEach(w=>{
    const found = findClozeSentence(w);
    const blanked = blankWordInSentence(w.en, found.sentence);
    const opts = [...wordPool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3)
      .map(x=>x.en), w.en].sort(()=>Math.random()-0.5);
    qs.push({ kind:'cloze', wordId:w.id,
      label: LANG==='en'?'Complete it':'Cümleyi tamamla',
      prompt:blanked, options:opts, answer:w.en });
  });
  // grammar at this level or below
  const gPool = [];
  GRAMMAR.filter(t=>levelIdx(t.level) <= progress.level).forEach(t=>t.qs.forEach(q=>gPool.push(q)));
  gPool.sort(()=>Math.random()-0.5).slice(0,5).forEach(q=>{
    qs.push({ kind:'grammar', label:'Grammar', prompt:q.q, options:q.opts, answer:q.a, exp:q.exp, expEn:q.expEn });
  });

  bossState = { code, questions: qs.sort(()=>Math.random()-0.5).slice(0,20),
                idx:0, correct:0, answered:false, finished:false, won:false };
}

function renderBoss(main){
  if(!bossState){ renderBossIntro(main); return; }
  if(bossState.finished){ renderBossResult(main); return; }
  renderBossQuestion(main);
}
function renderBossIntro(main){
  const code = bossLevelCode();
  const unlocked = bossUnlocked();
  const beaten = bossBeaten(code);
  main.innerHTML = `
    <div class="boss-intro">
      <div class="boss-emoji">${beaten ? '🏆' : '👹'}</div>
      <h2 class="section-title">${code} ${LANG==='en' ? 'Boss Fight' : 'Seviye Sınavı'}</h2>
      <p class="section-sub">${LANG==='en'
        ? '20 mixed questions: translation both ways, listening, sentence completion and grammar. You need 16 to win.'
        : '20 karışık soru: çift yönlü çeviri, dinleme, cümle tamamlama ve gramer. Kazanmak için 16 doğru gerekiyor.'}</p>
      ${beaten ? `<p class="write-feedback ok show">${LANG==='en'
        ? `You have already beaten the ${code} boss. You can fight again for practice.`
        : `${code} sınavını zaten geçtin. Pratik için tekrar girebilirsin.`}</p>` : ''}
      ${unlocked
        ? `<button class="btn-full" id="bossStart">${LANG==='en' ? 'Start the fight' : 'Sınava başla'}</button>`
        : `<p class="write-feedback no show">${LANG==='en'
            ? `Learn half of the ${code} words first, then the boss unlocks.`
            : `Önce ${code} kelimelerinin yarısını öğren, sınav o zaman açılır.`}</p>`}
    </div>`;
  const b = document.getElementById('bossStart');
  if(b) b.addEventListener('click', ()=>{ buildBoss(); trackEvent('/boss/start','Boss started'); render(); });
}
function renderBossQuestion(main){
  const s2 = bossState;
  const q = s2.questions[s2.idx];
  const hearts = Math.max(0, 4 - (s2.idx - s2.correct));
  main.innerHTML = `
    <div class="boss-bar">
      <span class="boss-progress">${s2.idx+1} / ${s2.questions.length}</span>
      <span class="boss-label">${escapeHtml(q.label)}</span>
      <span class="boss-score">${s2.correct} ✓</span>
    </div>
    <div class="boss-track"><span class="boss-fill" style="width:${Math.round(100*s2.idx/s2.questions.length)}%"></span></div>
    <div class="quiz-q boss-q">${q.kind==='listen' ? '🔊' : escapeHtml(q.prompt)}</div>
    ${q.kind==='listen' ? `<button class="sound-btn listen-big" id="bossSay">${LANG==='en'?'🔊 Play again':'🔊 Tekrar dinle'}</button>` : ''}
    <div class="q-options">
      ${q.options.map(o=>`<div class="q-option" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}
    </div>
    <div class="q-explain" id="bossExplain"></div>`;
  if(q.kind === 'listen'){
    speak(q.say);
    document.getElementById('bossSay').addEventListener('click', ()=>speak(q.say));
  }
  main.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(s2.answered) return;
      s2.answered = true;
      const chosen = opt.dataset.opt;
      main.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt === q.answer) o.classList.add('correct');
      });
      const ok = chosen === q.answer;
      if(!ok) opt.classList.add('incorrect');
      else { s2.correct++; addXp(10); }
      if(q.wordId) gradeWord(q.wordId, ok ? 'good' : 'again');
      if(q.kind === 'listen') recordSkill('listening', ok);
      if(q.kind === 'grammar' && q.exp){
        const exp = document.getElementById('bossExplain');
        if(exp){ exp.textContent = LANG==='en' && q.expEn ? q.expEn : q.exp; exp.classList.add('show'); }
      }
      setTimeout(()=>{
        s2.idx++;
        s2.answered = false;
        if(s2.idx >= s2.questions.length) finishBoss();
        render();
      }, q.kind === 'grammar' ? 1800 : 900);
    });
  });
}
function finishBoss(){
  const s2 = bossState;
  s2.finished = true;
  s2.won = s2.correct >= 16;
  if(s2.won){
    if(!progress.badges) progress.badges = {};
    progress.badges['boss_' + s2.code] = true;
    addXp(120);

/** Words in our own list that share a stem — cheap, honest "related words". */
function relatedWords(word){
  const base = word.en.toLowerCase().replace(/[^a-z]/g,'');
  if(base.length < 4) return [];
  const stem = base.slice(0, Math.max(4, base.length - 2));
  return VOCAB
    .filter(w => w.id !== word.id && w.en.toLowerCase().replace(/[^a-z]/g,'').startsWith(stem))
    .slice(0, 4);
}

function blankConnective(item){
  const forms = item.en.split(' / ').map(f=>f.trim()).filter(Boolean);
  // multi-part patterns like "not only ... but also" are blanked piece by piece
  const candidates = forms.concat(forms.flatMap(f=>f.split('...').map(x=>x.trim()).filter(x=>x.length>2)));
  for(const source of [item.right, item.ex]){
    for(const form of candidates){
      const re = new RegExp('\\b' + escapeRegExp(form) + '\\b', 'i');
      if(re.test(source)) return source.replace(re, '_____');
    }
  }
  return item.right + ' (_____)';
}
function startConnDrill(groupId){
  const pool = groupId
    ? connectiveItems().filter(i=>i.group.id === groupId)
    : connectiveItems();
  const picks = [...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(8, pool.length));
  const all = connectiveItems();
  const questions = picks.map(item=>{
    // the sentence with the connective removed. Some entries list alternatives
    // ("for instance / for example") and the example may use either, so try each
    // and fall back to the plain example sentence rather than showing no blank.
    const blanked = blankConnective(item);
    const distractors = all
      .filter(x=>x.en !== item.en)
      .sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.en);
    const options = [...distractors, item.en].sort(()=>Math.random()-0.5);
    return { item, blanked, options, answer:item.en };
  });
  connState.drill = { questions, idx:0, correct:0, answered:false, finished:false };
  connState.mode = 'drill';
  trackEvent('/connectives/drill', 'Connective drill');
  render();
}

function renderConnDrill(main){
  const d = connState.drill;
  if(d.finished){
    main.innerHTML = `
      <div class="quiz-result">
        <div class="big">${d.correct}/${d.questions.length}</div>
        <p class="section-sub">${LANG==='en' ? 'correct' : 'doğru cevap'}</p>
        <button class="btn-full" id="connAgain">${LANG==='en' ? 'Try again' : 'Tekrar dene'}</button>
        <span class="pt-skip" id="connExit">${LANG==='en' ? 'Back to linking words' : 'Bağlaçlara dön'}</span>
      </div>`;
    document.getElementById('connAgain').addEventListener('click', ()=>startConnDrill(connState.group ? connState.group.id : null));
    document.getElementById('connExit').addEventListener('click', ()=>{ connState.mode='learn'; connState.drill=null; render(); });
    return;
  }
  const q = d.questions[d.idx];
  main.innerHTML = `
    <div class="quiz-progress">${LANG==='en' ? 'Question' : 'Soru'} ${d.idx+1} / ${d.questions.length}</div>
    <div class="write-card">
      <div class="write-prompt-label">${LANG==='en' ? 'Choose the right linking word' : 'Doğru bağlacı seç'}</div>
      <div class="cloze-sentence">${escapeHtml(q.blanked)}</div>
    </div>
    <div class="q-options">
      ${q.options.map(o=>`<div class="q-option" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}
    </div>
    <div class="q-explain" id="connExplain"></div>
  `;
  main.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(d.answered) return;
      d.answered = true;
      const chosen = opt.dataset.opt;
      main.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt === q.answer) o.classList.add('correct');
      });
      const ok = chosen === q.answer;
      if(!ok) opt.classList.add('incorrect');
      else { d.correct++; addXp(12); burstConfetti(opt.getBoundingClientRect().left+30, opt.getBoundingClientRect().top, 8); }
      // the pattern is the lesson, so show it again right where the mistake happened
      const exp = document.getElementById('connExplain');
      if(exp){
        exp.innerHTML = `<strong>${escapeHtml(LANG==='en' ? q.item.pattern : q.item.patternTr)}</strong><br>${escapeHtml(LANG==='en' ? q.item.noteEn : q.item.note)}`;
        exp.classList.add('show');
      }
      setTimeout(()=>{
        d.idx++;
        d.answered = false;
        if(d.idx >= d.questions.length) d.finished = true;
        render();
      }, 2600);
    });
  });
}

/* ---------------- SPACED REPETITION (Leitner) ----------------
   A word you just got right should not come back tomorrow at the same rate as
   one you keep failing. Each word sits in a box; answering well moves it up and
   pushes the next review further out, answering badly drops it to the bottom
   and brings it back within minutes.                                        */
const SRS_INTERVALS_MIN = [10, 60, 24*60, 2*24*60, 4*24*60, 7*24*60, 14*24*60, 30*24*60];
const SRS_MAX_BOX = SRS_INTERVALS_MIN.length - 1;

function srsEntry(id){
  if(!progress.srs) progress.srs = {};
  if(!progress.srs[id]) progress.srs[id] = { box:0, due:0, lapses:0 };
  return progress.srs[id];
}
/** grade: 'again' (wrong) | 'hard' (unsure) | 'good' (confident) */
function gradeWord(id, grade){
  const e = srsEntry(id);
  const now = Date.now();
  if(grade === 'again'){
    e.lapses = (e.lapses || 0) + 1;
    // first slip comes back in minutes; a repeated slip waits until tomorrow,
    // because drilling a word you just failed twice teaches the wrong thing
    e.box = e.lapses >= 2 ? 2 : 0;
  } else if(grade === 'hard'){
    e.box = Math.max(0, Math.min(SRS_MAX_BOX, (e.box || 0)));
    e.box = Math.max(e.box, 3);          // ~2 days
  } else {
    e.box = Math.min(SRS_MAX_BOX, (e.box || 0) + 1);
    if(e.box < 5) e.box = 5;             // confident -> at least 7 days
  }
  e.due = now + SRS_INTERVALS_MIN[e.box] * 60 * 1000;
  recordWord(id, grade !== 'again');
  progress.flashcards[id] = grade === 'again' ? 'learning' : (grade === 'good' ? 'known' : (progress.flashcards[id] || 'learning'));
  saveProgress();
}
function dueWords(limit){
  const now = Date.now();
  const pool = unlockedVocab().filter(w=>{
    const e = progress.srs && progress.srs[w.id];
    return e && e.due && e.due <= now;
  });
  pool.sort((a,b)=> (progress.srs[a.id].due) - (progress.srs[b.id].due));
  return limit ? pool.slice(0, limit) : pool;
}
function newWordsForToday(limit){
  const pool = currentTierWords().length >= limit ? currentTierWords() : unlockedVocab();
  const fresh = pool.filter(w=> !(progress.srs && progress.srs[w.id]));
  return fresh.slice(0, limit);
}
function srsDueCount(){ return dueWords().length; }

/* ---------------- ENGLISH HEALTH ----------------
   One number ("7 day streak") says whether you showed up. This says what is
   actually holding your English back, which is a different question.        */
function pct(right, total){
  if(!total) return null;
  return Math.max(0, Math.min(100, Math.round(100 * right / total)));
}
function englishHealth(){
  const ws = progress.wordStats || {};
  let vr = 0, vt = 0;
  Object.keys(ws).forEach(k=>{ vr += ws[k].right || 0; vt += (ws[k].right||0) + (ws[k].wrong||0); });
  // vocabulary also rewards breadth, not just accuracy
  const known = Object.values(progress.flashcards || {}).filter(v=>v==='known').length;
  const reach = unlockedVocab().length || 1;
  const breadth = Math.min(100, Math.round(100 * known / reach));
  const accuracy = pct(vr, vt);
  const vocabulary = accuracy === null ? (known ? breadth : null)
                                       : Math.round(accuracy * 0.6 + breadth * 0.4);

  const gTotal = GRAMMAR.filter(t=>levelIdx(t.level)<=progress.level)
                        .reduce((n,t)=>n + t.qs.length, 0);
  const gDone = Object.keys(progress.grammarDone || {}).length;
  const grammar = gTotal ? Math.min(100, Math.round(100 * gDone / gTotal)) : null;

  const ls = (progress.skillStats && progress.skillStats.listening) || { right:0, total:0 };
  const sp = (progress.skillStats && progress.skillStats.speaking) || { right:0, total:0 };
  return {
    vocabulary,
    grammar,
    listening: pct(ls.right, ls.total),
    speaking:  pct(sp.right, sp.total)
  };
}
function recordSkill(skill, right){
  if(!progress.skillStats) progress.skillStats = { listening:{right:0,total:0}, speaking:{right:0,total:0} };
  if(!progress.skillStats[skill]) progress.skillStats[skill] = { right:0, total:0 };
  progress.skillStats[skill].total++;
  if(right) progress.skillStats[skill].right++;
}
function healthColor(v){
  if(v === null) return 'grey';
  if(v >= 70) return 'green';
  if(v >= 45) return 'amber';
  return 'rose';
}

/* ---------------- AI CONVERSATION ----------------
   The differentiator: the tutor is steered toward the words this learner has
   actually been getting wrong, and words they use correctly in conversation
   feed straight back into wordStats — so speaking practice and vocabulary
   study are one loop instead of two separate features.                    */
let chatState = null;
const CHAT_TOPICS = [
  { id:'daily',   en:'Everyday life',      tr:'Günlük hayat' },
  { id:'travel',  en:'Travel',             tr:'Seyahat' },
  { id:'work',    en:'Work & study',       tr:'İş ve okul' },
  { id:'food',    en:'Food & cooking',     tr:'Yemek' },
  { id:'free',    en:'Anything you like',  tr:'Serbest konu' }
];
function topicLabel(t){ return LANG==='en' ? t.en : t.tr; }

/** The words this learner is currently worst at, at their own level. */
function weakWordsForChat(n){
  const pool = currentTierWords().length >= 8 ? currentTierWords() : unlockedVocab();
  const scored = pool.map(w=>{
    const st = progress.wordStats[w.id];
    const total = st ? st.right + st.wrong : 0;
    // never practised counts as mildly weak; frequently-wrong counts as very weak
    const weakness = total === 0 ? 0.5 : st.wrong / total;
    return { w, weakness, total };
  });
  scored.sort((a,b)=> (b.weakness - a.weakness) || (a.total - b.total));
  return scored.slice(0, n).map(x=>x.w);
}

async function callChatFunction(payload){
  const { data: sess } = await supabaseClient.auth.getSession();
  const token = sess && sess.session ? sess.session.access_token : null;
  if(!token) throw new Error('no_session');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/chat`, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const body = await res.json().catch(()=>({}));
  if(!res.ok){
    const e = new Error(body.error || 'request_failed');
    e.code = body.error;
    e.limit = body.limit;
    // 404 = the function was never deployed, 503 = deployed but no API key set
    e.notSetUp = res.status === 404 || res.status === 503;
    throw e;
  }
  return body;
}

function startChat(topicId){
  const topic = CHAT_TOPICS.find(t=>t.id===topicId) || CHAT_TOPICS[0];
  const words = weakWordsForChat(5);
  const opener = LANG==='en'
    ? `Hi! Let's talk about ${topic.en.toLowerCase()}. How has your day been so far?`
    : `Hi! Let's talk about ${topic.en.toLowerCase()}. How has your day been so far?`;
  chatState = {
    topic, targetWords: words,
    messages: [{ role:'assistant', content: opener }],
    sending: false, finished: false, review: null,
    error: null, remaining: null
  };
  trackEvent('/chat/start', 'Chat started');
  render();
}

async function sendChatMessage(text){
  if(!chatState || chatState.sending) return;
  const clean = String(text || '').trim().slice(0, 600);
  if(!clean) return;
  chatState.messages.push({ role:'user', content: clean });
  chatState.sending = true;
  chatState.error = null;
  render();
  try{
    const body = await callChatFunction({
      mode: 'chat',
      level: LEVELS[progress.level].code,
      uiLang: LANG,
      topic: chatState.topic.en,
      targetWords: chatState.targetWords.map(w=>({ en:w.en, tr:w.tr })),
      messages: chatState.messages
    });
    chatState.messages.push({ role:'assistant', content: body.reply });
    chatState.remaining = body.remaining;
    addXp(6);
  }catch(e){
    if(e.code === 'daily_limit'){
      chatState.error = LANG==='en'
        ? `You've used today's free messages. Come back tomorrow.`
        : `Bugünkü ücretsiz mesaj hakkın doldu. Yarın devam edebilirsin.`;
    } else if(e.notSetUp){
      chatState.error = LANG==='en'
        ? `AI conversation is not switched on for this app yet. Everything else works as normal.`
        : `AI konuşma bu uygulamada henüz açılmadı. Diğer her şey normal çalışıyor.`;
    } else {
      chatState.error = LANG==='en'
        ? `Couldn't reach the tutor. Check your connection and try again.`
        : `Öğretmene ulaşılamadı. Bağlantını kontrol edip tekrar dene.`;
    }
  }
  chatState.sending = false;
  render();
}

async function finishChat(){
  if(!chatState || chatState.sending) return;
  const learnerTurns = chatState.messages.filter(m=>m.role==='user').length;
  if(learnerTurns === 0){ chatState = null; render(); return; }
  chatState.sending = true;
  chatState.error = null;
  render();
  try{
    const body = await callChatFunction({
      mode: 'review',
      level: LEVELS[progress.level].code,
      uiLang: LANG,
      topic: chatState.topic.en,
      targetWords: chatState.targetWords.map(w=>({ en:w.en, tr:w.tr })),
      messages: chatState.messages
    });
    chatState.review = body.review || null;
    // the loop closes here: words produced correctly in real conversation
    // are stronger evidence of knowing them than a multiple-choice tap
    const usedRaw = (chatState.review && Array.isArray(chatState.review.used)) ? chatState.review.used : [];
    const used = usedRaw.map(u=>String(u).toLowerCase());
    let credited = 0;
    chatState.targetWords.forEach(w=>{
      if(used.includes(w.en.toLowerCase())){
        gradeWord(w.id, 'good');
        recordSkill('speaking', true);
        credited++;
      } else {
        recordSkill('speaking', false);
      }
    });
    chatState.credited = credited;
    addXp(10 + credited * 8);
    saveProgress();
    const leveledUp = checkLevelUp();
    afterProgress(leveledUp);
    checkBadges();
    trackEvent('/chat/finish', 'Chat finished');
  }catch(e){
    chatState.error = LANG==='en'
      ? `Couldn't build the summary. Your progress is still saved.`
      : `Özet oluşturulamadı. İlerlemen yine de kaydedildi.`;
  }
  chatState.finished = true;
  chatState.sending = false;
  render();
}

  if(!chatState){ renderChatStart(main); return; }
  if(chatState.finished){ renderChatReview(main); return; }
  renderChatConversation(main);

/* ---------------- DICTIONARY (TR-EN / EN-EN) ---------------- */
function looksTurkish(str){
  return /[çğıöşüÇĞİÖŞÜ]/.test(str);
}
const DICT_MAX_TERM = 60;
let _lastLookupAt = 0;
function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms || 8000);
  return fetch(url, { signal: ctrl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' })
    .finally(()=>clearTimeout(timer));
}
function sanitizeTerm(term){
  // Only letters (incl. Turkish), spaces and hyphens; nothing that could steer a URL.
  return String(term || '')
    .slice(0, DICT_MAX_TERM)
    .replace(/[^\p{L}\s'-]/gu, '')
    .trim();
}
async function translateText(text, from, to){
  const clean = sanitizeTerm(text);
  if(!clean) throw new Error('translate-empty');
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${encodeURIComponent(from)}|${encodeURIComponent(to)}`;
  const res = await fetchWithTimeout(url, 8000);
  if(!res.ok) throw new Error('translate-failed');
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if(typeof translated !== 'string' || !translated.trim()) throw new Error('translate-empty');
  return translated.slice(0, 300);
}
async function fetchEnglishDefinition(word){
  const clean = sanitizeTerm(word);
  if(!clean) return null;
  const res = await fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean)}`, 8000);
  if(res.status===404) return null;
  if(!res.ok) throw new Error('dict-failed');
  const data = await res.json();
  const entry = Array.isArray(data) ? data[0] : null;
  if(!entry || typeof entry !== 'object') return null;
  // Keep only the fields we render, as strings, with sane caps.
  const str = v => (typeof v === 'string' ? v.slice(0, 400) : '');
  return {
    word: str(entry.word),
    phonetic: str(entry.phonetic),
    meanings: Array.isArray(entry.meanings) ? entry.meanings.slice(0,3).map(m=>({
      partOfSpeech: str(m && m.partOfSpeech),
      synonyms: Array.isArray(m && m.synonyms) ? m.synonyms.slice(0,6).map(str).filter(Boolean) : [],
      antonyms: Array.isArray(m && m.antonyms) ? m.antonyms.slice(0,6).map(str).filter(Boolean) : [],
      definitions: Array.isArray(m && m.definitions) ? m.definitions.slice(0,2).map(d=>({
        definition: str(d && d.definition),
        example: str(d && d.example)
      })) : []
    })) : []
  };
}
async function performLookup(term){
  term = sanitizeTerm(term);
  if(!term) return;
  const now = Date.now();
  if(now - _lastLookupAt < 700) return;   // throttle rapid-fire lookups
  _lastLookupAt = now;
  dictState = {term, loading:true, result:null, error:null};
  render();
  trackEvent('/dictionary/search', 'Sözlük araması');
  try{
    const localMatches = VOCAB.filter(w=> w.en.toLowerCase()===term.toLowerCase() || w.tr.toLowerCase()===term.toLowerCase());
    const isTurkishInput = looksTurkish(term) || (localMatches.length>0 && localMatches[0].tr.toLowerCase()===term.toLowerCase());
    let englishWord = term;
    let turkishText = null;
    let definitionEntry = null;
    if(isTurkishInput){
      turkishText = term;
      try{ englishWord = await translateText(term, 'tr', 'en'); }catch(e){ englishWord = localMatches[0] ? localMatches[0].en : term; }
      try{ definitionEntry = await fetchEnglishDefinition(englishWord); }catch(e){}
    } else {
      try{ definitionEntry = await fetchEnglishDefinition(term); }catch(e){}
      if(definitionEntry){ englishWord = definitionEntry.word; }
      try{ turkishText = await translateText(englishWord, 'en', 'tr'); }catch(e){ turkishText = localMatches[0] ? localMatches[0].tr : null; }
    }
    if(!definitionEntry && !turkishText && localMatches.length===0){
      dictState = {term, loading:false, result:null, error:'notfound'};
    } else {
      dictState = {term, loading:false, error:null, result:{
        englishWord, turkishText, definitionEntry,
        localMatch: localMatches[0] || null
      }};
    }
  }catch(e){
    const localMatches = VOCAB.filter(w=> w.en.toLowerCase()===term.toLowerCase() || w.tr.toLowerCase()===term.toLowerCase());
    if(localMatches.length){
      dictState = {term, loading:false, error:null, result:{englishWord:localMatches[0].en, turkishText:localMatches[0].tr, definitionEntry:null, localMatch:localMatches[0]}};
    } else {
      dictState = {term, loading:false, result:null, error:'offline'};
    }
  }
  render();
}

/* ---------------- MATCHING GAME ---------------- */
function buildMatchRound(){
  const pool = currentTierWords().length>=6 ? currentTierWords() : unlockedVocab();
  const picks = weightedSample(pool, wordWeight, Math.min(6, pool.length));
  const enItems = picks.map(w=>({id:w.id, text:w.en})).sort(()=>Math.random()-0.5);
  const trItems = picks.map(w=>({id:w.id, text:w.tr})).sort(()=>Math.random()-0.5);
  matchState = {words:picks, enItems, trItems, selectedEn:null, selectedTr:null, matched:{}, wrongPair:null};
}
function renderMatch(main){
  if(!matchState) buildMatchRound();
  const total = matchState.words.length;
  const doneCount = Object.keys(matchState.matched).length;
  main.innerHTML = `
    <h2 class="section-title">Eşleştir</h2>
    <p class="section-sub">Solda İngilizcesini, sağda Türkçesini bul ve ikisine de dokunarak eşleştir.</p>
    <div class="deck-status">${doneCount} / ${total} eşleşti</div>
    <div class="match-grid">
      <div class="match-col" id="matchColEn">
        ${matchState.enItems.map(it=>`<div class="match-item ${matchState.matched[it.id]?'matched':''} ${matchState.selectedEn===it.id?'selected':''} ${matchState.wrongPair&&matchState.wrongPair.en===it.id?'wrong':''}" data-id="${it.id}" data-side="en">${it.text}</div>`).join('')}
      </div>
      <div class="match-col" id="matchColTr">
        ${matchState.trItems.map(it=>`<div class="match-item ${matchState.matched[it.id]?'matched':''} ${matchState.selectedTr===it.id?'selected':''} ${matchState.wrongPair&&matchState.wrongPair.tr===it.id?'wrong':''}" data-id="${it.id}" data-side="tr">${it.text}</div>`).join('')}
      </div>
    </div>
    ${doneCount>=total ? `<button class="btn-full" id="matchNext">Yeni Tur</button>` : ''}
  `;
  main.querySelectorAll('.match-item:not(.matched)').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = parseInt(el.dataset.id);
      const side = el.dataset.side;
      if(side==='en') matchState.selectedEn = matchState.selectedEn===id ? null : id;
      else matchState.selectedTr = matchState.selectedTr===id ? null : id;
      if(matchState.selectedEn!==null && matchState.selectedTr!==null){
        if(matchState.selectedEn===matchState.selectedTr){
          matchState.matched[matchState.selectedEn] = true;
          gradeWord(matchState.selectedEn, 'hard');
          addXp(8);
          burstConfetti(el.getBoundingClientRect().left+20, el.getBoundingClientRect().top, 6);
          matchState.selectedEn = null; matchState.selectedTr = null;
          updateHeaderStats();
          checkBadges();
          if(Object.keys(matchState.matched).length>=matchState.words.length){
            const leveledUp = checkLevelUp();
            afterProgress(leveledUp);
          }
          render();
        } else {
          matchState.wrongPair = {en:matchState.selectedEn, tr:matchState.selectedTr};
          render();
          setTimeout(()=>{
            matchState.selectedEn = null; matchState.selectedTr = null; matchState.wrongPair = null;
            render();
          }, 700);
        }
      } else {
        render();
      }
    });
  });
  const nextBtn = document.getElementById('matchNext');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ buildMatchRound(); render(); });
}

/* ---------------- LISTENING PRACTICE ---------------- */
function buildListening(){
  const pool = currentTierWords().length>=6 ? currentTierWords() : unlockedVocab();
  const picks = weightedSample(pool, wordWeight, Math.min(6, pool.length));
  const questions = picks.map(w=>{
    const distractors = pool.filter(x=>x.id!==w.id).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.tr);
    const options = [...distractors, w.tr].sort(()=>Math.random()-0.5);
    return {word:w, options, answer:w.tr};
  });
  listenState = {questions, idx:0, correctCount:0, finished:false, answered:false, revealed:false};
}
function renderListen(main){
  main.innerHTML = `
    <h2 class="section-title">Dinle</h2>
    <p class="section-sub">Kelimeyi dinle, duyduğun kelimenin Türkçesini seç. Okuma değil, dinleme pratiği.</p>
    <div id="listenArea"></div>
  `;
  if(!listenState) renderListenStart();
  else if(listenState.finished) renderListenResult();
  else renderListenQuestion();
}
function renderListenStart(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  area.innerHTML = `<button class="btn-full" id="startListen">6 Soruluk Dinleme Turu Başlat</button>`;
  document.getElementById('startListen').addEventListener('click', ()=>{ buildListening(); render(); });
}
function renderListenQuestion(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  const q = listenState.questions[listenState.idx];
  area.innerHTML = `
    <div class="quiz-progress">Soru ${listenState.idx+1} / ${listenState.questions.length}</div>
    <div class="listen-card">
      <button class="sound-btn listen-big" id="listenPlay">🔊 Dinle</button>
      ${listenState.revealed ? `<div class="listen-word">${q.word.en}</div>` : ''}
    </div>
    <div class="q-options">
      ${q.options.map(o=>`<div class="q-option" data-opt="${o}">${o}</div>`).join('')}
    </div>
  `;
  document.getElementById('listenPlay').addEventListener('click', ()=>speak(q.word.en));
  speak(q.word.en);
  area.querySelectorAll('.q-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(listenState.answered) return;
      listenState.answered = true;
      listenState.revealed = true;
      const chosen = opt.dataset.opt;
      area.querySelectorAll('.q-option').forEach(o=>{
        o.classList.remove('correct','incorrect');
        if(o.dataset.opt===q.answer) o.classList.add('correct');
      });
      const correct = chosen===q.answer;
      if(!correct) opt.classList.add('incorrect');
      else { listenState.correctCount++; addXp(12); burstConfetti(opt.getBoundingClientRect().left+30, opt.getBoundingClientRect().top, 8); }
      gradeWord(q.word.id, correct ? 'good' : 'again');
      recordSkill('listening', correct);
      setTimeout(()=>{
        listenState.idx++;
        listenState.answered = false;
        listenState.revealed = false;
        if(listenState.idx>=listenState.questions.length) finishListening();
        render();
      }, 1100);
    });
  });
}
function finishListening(){
  listenState.finished = true;
  const leveledUp = checkLevelUp();
  afterProgress(leveledUp);
  checkBadges();
}
function renderListenResult(){
  const area = document.getElementById('listenArea');
  if(!area) return;
  area.innerHTML = `

/* ---------------- FILL IN THE BLANK (CLOZE) ---------------- */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function findClozeSentence(w){
  if(blankWordInSentence(w.en, w.ex)) return {sentence:w.ex, sentenceTr:w.exTr};
  if(w.ex2 && blankWordInSentence(w.en, w.ex2)) return {sentence:w.ex2, sentenceTr:w.exTr2};
  return null;
}
function buildCloze(){
  const tierPool = currentTierWords().filter(w=>findClozeSentence(w));
  const fullPool = unlockedVocab().filter(w=>findClozeSentence(w));
  const basePool = tierPool.length>=6 ? tierPool : fullPool;
  const picks = weightedSample(basePool, wordWeight, Math.min(6, basePool.length));
  const questions = picks.map(w=>{
    const found = findClozeSentence(w);
    const blanked = blankWordInSentence(w.en, found.sentence);
    return {word:w, blanked, sentenceTr:found.sentenceTr, answer:w.en};
  });
  clozeState = {questions, idx:0, correctCount:0, finished:false, answered:false};
}
function renderCloze(main){
  main.innerHTML = `
    <h2 class="section-title">Boşluk Doldurma</h2>
    <p class="section-sub">Cümledeki boşluğa uygun İngilizce kelimeyi yaz. Türkçe çeviri sana ipucu verir.</p>
    <div id="clozeArea"></div>
  `;
  if(!clozeState) renderClozeStart();
  else if(clozeState.finished) renderClozeResult();
  else renderClozeQuestion();
}
function renderClozeStart(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  area.innerHTML = `<button class="btn-full" id="startCloze">6 Soruluk Boşluk Doldurma Başlat</button>`;
  document.getElementById('startCloze').addEventListener('click', ()=>{ buildCloze(); render(); });
}
function renderClozeQuestion(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  const q = clozeState.questions[clozeState.idx];
  area.innerHTML = `
    <div class="quiz-progress">Soru ${clozeState.idx+1} / ${clozeState.questions.length}</div>
    <div class="write-card">
      <div class="write-prompt-label">Cümleyi tamamla</div>
      <div class="cloze-sentence">${q.blanked}</div>
      <div class="cloze-tr">${q.sentenceTr}</div>
    </div>
    <input class="write-input" id="clozeInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Eksik kelimeyi yaz...">
    <div class="write-feedback" id="clozeFeedback"></div>
    <button class="btn-full" id="clozeCheck">Kontrol Et</button>
  `;
  const input = document.getElementById('clozeInput');
  input.focus();
  const doCheck = ()=>{
    if(clozeState.answered) return;
    clozeState.answered = true;
    const isCorrect = normalize(input.value) === normalize(q.answer);
    input.classList.add(isCorrect ? 'correct' : 'incorrect');
    input.disabled = true;
    const fb = document.getElementById('clozeFeedback');
    fb.className = 'write-feedback ' + (isCorrect ? 'ok' : 'no');
    fb.textContent = isCorrect ? '✓ Doğru!' : ('✗ Doğrusu: ' + q.answer);
    gradeWord(q.word.id, isCorrect ? 'good' : 'again');
    if(isCorrect){ clozeState.correctCount++; addXp(14); burstConfetti(window.innerWidth/2, 220, 10); }
    else { addXp(3); }
    const leveledUp = checkLevelUp();
    afterProgress(leveledUp);
    setTimeout(()=>{
      clozeState.idx++;
      clozeState.answered = false;
      if(clozeState.idx>=clozeState.questions.length) clozeState.finished = true;
      render();
    }, 1200);
  };
  document.getElementById('clozeCheck').addEventListener('click', doCheck);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doCheck(); });
}
function renderClozeResult(){
  const area = document.getElementById('clozeArea');
  if(!area) return;
  area.innerHTML = `

    </div>
  `;

}

/* ---------------- READING COMPREHENSION ---------------- */
function readingQuestions(r){
  return (LANG==='en' && r.qsEn && r.qsEn.length) ? r.qsEn : r.qs;
}
function renderReading(main){
  if(!readingLevelFilter) readingLevelFilter = LEVELS[progress.level].code;
  const levelOptions = LEVELS.map(l=>l.code);

  // every passage needs its own key: keying by level made the two passages at
  // the same level share answers, so finishing one "completed" the other
  const atLevel = READINGS.map((r,i)=>({ r, i })).filter(x=>x.r.level === readingLevelFilter);
  const pool = atLevel.length ? atLevel : READINGS.map((r,i)=>({ r, i }));
  if(readingPick == null || !pool.some(x=>x.i === readingPick)) readingPick = pool[0].i;
  const reading = READINGS[readingPick];
  const rqs = readingQuestions(reading);
  const keyFor = qi => 'r' + readingPick + '-' + qi;
  const doneInThis = rqs.filter((q,qi)=>progress.readingDone[keyFor(qi)]).length;
  const allDone = doneInThis === rqs.length;

  const posInPool = pool.findIndex(x=>x.i === readingPick) + 1;
  const finishedInPool = pool.filter(x=>
    readingQuestions(x.r).every((q,qi)=>progress.readingDone['r'+x.i+'-'+qi])).length;

  main.innerHTML = `
    <h2 class="section-title">Okuma Parçası</h2>
    <p class="section-sub">Metni oku, anlamını çıkar, sorulara cevap ver. Takılırsan Türkçe çevirisine bakabilirsin.</p>
    <div class="chip-row" id="readLevelRow">
      ${levelOptions.map((lv,i)=>`<div class="chip ${lv===readingLevelFilter?'active':''} ${i>progress.level?'ahead':''}" data-lvl="${lv}">${lv} ${lv===LEVELS[progress.level].code?'(seviyen)':(i>progress.level?'↑':'')}</div>`).join('')}
    </div>
    <div class="reading-meta">
      <span>${readingLevelFilter} · ${LANG==='en' ? 'Passage' : 'Parça'} ${posInPool}/${pool.length}</span>
      <span>${finishedInPool}/${pool.length} ${LANG==='en' ? 'finished' : 'tamamlandı'}</span>
    </div>
    <div class="reading-card">
      <div class="reading-title">${escapeHtml(reading.title)}</div>
      <div class="reading-text">${escapeHtml(reading.text)}</div>
      <div class="reading-tr" id="readingTr">${escapeHtml(reading.textTr)}</div>
      <button class="reveal-btn" id="revealTr">Türkçe Çeviriyi Göster</button>
    </div>
    <div class="deck-status">${doneInThis}/${rqs.length} soru tamamlandı</div>
    <div id="readingQs"></div>
    <div id="readingDoneBox"></div>
  `;

  document.querySelectorAll('#readLevelRow .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      readingLevelFilter = chip.dataset.lvl;
      readingPick = null;          // jump to the first passage of the new level
      render();
    });
  });
  const revealBtn = document.getElementById('revealTr');
  revealBtn.addEventListener('click', ()=>{
    const tr = document.getElementById('readingTr');
    tr.classList.toggle('show');
    revealBtn.textContent = tr.classList.contains('show') ? 'Türkçe Çeviriyi Gizle' : 'Türkçe Çeviriyi Göster';
  });

  const qArea = document.getElementById('readingQs');
  rqs.forEach((q, qIdx)=>{
    const key = keyFor(qIdx);
    const answered = !!progress.readingDone[key];
    const block = document.createElement('div');
    block.className = 'q-block';
    block.innerHTML = `
      <div class="q-text">${qIdx+1}. ${escapeHtml(q.q)}</div>
      <div class="q-options">
        ${q.opts.map(o=>`<div class="q-option ${answered && o===q.a ? 'correct' : ''}" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`).join('')}
      </div>
    `;
    qArea.appendChild(block);
    block.querySelectorAll('.q-option').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(progress.readingDone[key]) return;
        const chosen = opt.dataset.opt;
        block.querySelectorAll('.q-option').forEach(o=>{
          o.classList.remove('correct','incorrect');
          if(o.dataset.opt===q.a) o.classList.add('correct');
        });
        const ok = chosen === q.a;
        if(!ok){ opt.classList.add('incorrect'); addXp(2); }
        else { addXp(12); burstConfetti(opt.getBoundingClientRect().left+20, opt.getBoundingClientRect().top, 8); }
        progress.readingDone[key] = true;
        recordSkill('listening', ok);   // reading comprehension feeds the same comprehension meter
        saveProgress();
        updateHeaderStats();
        checkBadges();
        render();                        // so the completion panel can appear
      });
    });
  });

  // finishing a passage should visibly end, and offer the next one
  if(allDone){
    const box = document.getElementById('readingDoneBox');
    const remaining = pool.filter(x=>
      !readingQuestions(x.r).every((q,qi)=>progress.readingDone['r'+x.i+'-'+qi]));
    const nextUnread = remaining.find(x=>x.i !== readingPick);
    box.innerHTML = `
      <div class="reading-done">
        <div class="reading-done-emoji">${remaining.length ? '📖' : '🎉'}</div>
        <div class="reading-done-title">${LANG==='en' ? 'Passage complete' : 'Parça tamamlandı'}</div>
        <p class="section-sub">${remaining.length
          ? (LANG==='en'
              ? `${remaining.length} more passage${remaining.length>1?'s':''} at ${readingLevelFilter}.`
              : `${readingLevelFilter} seviyesinde ${remaining.length} parça daha var.`)
          : (LANG==='en'
              ? `You have finished every ${readingLevelFilter} passage. Try the level above.`
              : `${readingLevelFilter} seviyesindeki tüm parçaları bitirdin. Üst seviyeyi dene.`)}</p>
        ${nextUnread
          ? `<button class="btn-full" id="readingNext">${LANG==='en' ? 'Next passage' : 'Sonraki parça'} →</button>`
          : ''}
        <span class="pt-skip" id="readingReset">${LANG==='en' ? 'Read this one again' : 'Bu parçayı tekrar çöz'}</span>
      </div>`;
    const nb = document.getElementById('readingNext');
    if(nb) nb.addEventListener('click', ()=>{ readingPick = nextUnread.i; render(); });
    document.getElementById('readingReset').addEventListener('click', ()=>{
      rqs.forEach((q,qi)=>{ delete progress.readingDone[keyFor(qi)]; });
      saveProgress();
      render();
    });
  }
}


(async function init(){
  document.getElementById('retestBtn').addEventListener('click', ()=>{
    progress.placementDone = false;
    showPlacementIntro();
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('notifBtn').addEventListener('click', showNotifPanel);
  const langBtn = document.getElementById('langBtn');
  langBtn.textContent = LANG === 'en' ? 'EN' : 'TR';
  langBtn.addEventListener('click', ()=>{
    const next = LANG === 'en' ? 'tr' : 'en';
    langBtn.textContent = next === 'en' ? 'EN' : 'TR';
    setLang(next);
  });
  applyStaticI18n();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  if(!window.supabase){
    document.getElementById('main').innerHTML = `
      <div class="pt-wrap pt-intro">
        <h2>Bağlantı kurulamadı</h2>
        <p>Hesap sistemi için internete ihtiyaç var. Bağlantını kontrol edip sayfayı yenile.</p>
      </div>`;
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: 'pkce'
    }
  });
  // After a Google redirect the URL carries ?code=... — clean it once the session is set.
  supabaseClient.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_IN' && (window.location.search.includes('code=') || window.location.hash.includes('access_token'))){
      try{ window.history.replaceState({}, document.title, window.location.pathname); }catch(e){}
    }
  });

  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session && data.session.user){
      await onAuthed(data.session.user);
    } else {
      authMode = 'login';
      renderAuth();
    }
  }catch(e){
    authMode = 'login';
    authError = 'Bağlantı kurulamadı, tekrar dene.';
    renderAuth();
  }
})();
</script>
</body>
</html>
